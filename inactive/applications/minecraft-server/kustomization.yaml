namespace: minecraft-server
resources:
  - minecraft-networkpolicy.yaml
  - minecraft-server-namespace.yaml
  - minecraft-exporter-service.yaml
  - minecraft-secrets-externalsecret.yaml
helmCharts:
  - name: minecraft
    namespace: minecraft-server
    valuesFile: values-dummy.yaml
    releaseName: minecraft
    version: 5.2.0
    repo: https://itzg.github.io/minecraft-server-charts/
    valuesInline:
      image:
        repository: itzg/minecraft-server
        tag: latest@sha256:951c21928ffcca5b5b6efc996c994d43e292f7bd86345b2cc28535a1e3a3efb7
        pullPolicy: IfNotPresent
        pullSecret: ''
      replicaCount: 1
      resources:
        requests:
          memory: 30Gi
          cpu: 4000m
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      extraPodSpec:
        automountServiceAccountToken: 'false'
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      sidecarContainers:
        - name: minecraft-exporter
          image: ghcr.io/dirien/minecraft-exporter:0.22.0@sha256:a1d1da2e2f91631c6dc4806bef54c234750af9ac63af3761230f97a67d4681fa
          imagePullPolicy: IfNotPresent
          env:
            - name: MC_RCON_ADDRESS
              value: :25575
            - name: MC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: rcon-password
            - name: MC_NAME_SOURCE
              value: mojang
            - name: MC_MOD_SERVER_STATS
              value: papermc
            - name: MC_WORLD
              value: /data/world
          ports:
            - name: metrics
              containerPort: 9150
              protocol: TCP
          volumeMounts:
            - name: datadir
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      minecraftServer:
        eula: 'TRUE'
        version: 1.21.8
        type: PAPER
        difficulty: easy
        ops: count_cocofang
        maxPlayers: 20
        maxWorldSize: 10000
        maxBuildHeight: 256
        maxTickTime: 60000
        spawnProtection: 16
        viewDistance: 20
        gameMode: survival
        motd: Welcome to Nick's Shed
        levelType: DEFAULT
        memory: 28500M
        overrideServerProperties: true
        serviceType: NodePort
        nodePort: 30555
        pluginUrls:
          - https://cdn.modrinth.com/data/34T8oVNY/versions/sCKfp2wx/Pl3xMap-1.21.8-534.jar
        modrinth:
          optionalDependencies: false
          allowedVersionType: release
        rcon:
          enabled: true
          existingSecret: minecraft-secrets
          serviceType: NodePort
          nodePort: 30655
        extraPorts:
          - name: map
            containerPort: 8080
            protocol: TCP
            service:
              annotations:
                tailscale.com/expose: 'true'
              enabled: true
              embedded: false
              type: ClusterIP
              loadBalancerIP: ''
              loadBalancerSourceRanges: []
              port: 8100
      persistence:
        labels: {}
        annotations: {}
        storageClass: lvms-vg1-worker
        dataDir:
          enabled: true
          Size: 100Gi
      serviceAnnotations:
        tailscale.com/expose: 'true'
      mcbackup:
        enabled: true
        image:
          repository: itzg/mc-backup
          tag: latest@sha256:3ff6a1e8fa15ca4e4440b118676cf58c611a4079d4da8fe792b04a9a13619f16
          pullPolicy: IfNotPresent
        backupInterval: 6h
        rconRetries: -1
        backupMethod: rclone
        rcloneRemote: minio
        rcloneDestDir: minecraft
        rcloneConfig: |
          [minio]
          type = s3
          provider = Minio
          access_key_id = minecraft
          secret_access_key = CHANGEME
          endpoint = https://truenas.igou.systems:30000
        resticRepository: null
        resticEnvs: []
        resources:
          requests:
            memory: 512Mi
            cpu: 5000m
        persistence:
          annotations: {}
          backupDir:
            enabled: false
            Size: 100Gi
