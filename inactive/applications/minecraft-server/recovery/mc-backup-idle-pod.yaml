apiVersion: v1
kind: Pod
metadata:
  name: mc-backup-idle
  namespace: minecraft-server
  labels:
    app: mc-backup-idle
spec:
  restartPolicy: Always
  containers:
    - name: mc-backup
      image: itzg/mc-backup:latest@sha256:452e5c458e1eeb7ee47ae2d4afca0cec14ce878a12b4a8311ad2586b5e6cb118
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - sleep infinity
      volumeMounts:
        - name: minecraft-datadir
          mountPath: /data
        - name: backups
          mountPath: /backups
  volumes:
    - name: minecraft-datadir
      persistentVolumeClaim:
        claimName: minecraft-datadir
    - name: backups
      emptyDir: {}
