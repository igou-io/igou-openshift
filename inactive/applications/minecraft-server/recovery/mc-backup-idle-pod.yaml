apiVersion: v1
kind: Pod
metadata:
  name: mc-backup-idle
  namespace: minecraft-server
  labels:
    app: mc-backup-idle
spec:
  restartPolicy: Always
  containers:
    - name: mc-backup
      image: itzg/mc-backup:latest@sha256:c5f2c369bbe47d0b712601bf44af5927e67a18cb5816dc378efb45eb993dab0a
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - sleep infinity
      volumeMounts:
        - name: minecraft-datadir
          mountPath: /data
        - name: backups
          mountPath: /backups
  volumes:
    - name: minecraft-datadir
      persistentVolumeClaim:
        claimName: minecraft-datadir
    - name: backups
      emptyDir: {}
