apiVersion: v1
kind: Pod
metadata:
  name: mc-backup-idle
  namespace: minecraft-server
  labels:
    app: mc-backup-idle
spec:
  restartPolicy: Always
  containers:
    - name: mc-backup
      image: itzg/mc-backup:latest@sha256:ee9b6c8085be2d5d8df38bad1ff3af69c63dcb7a80e506c87d27a1807767d675
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - sleep infinity
      volumeMounts:
        - name: minecraft-datadir
          mountPath: /data
        - name: backups
          mountPath: /backups
  volumes:
    - name: minecraft-datadir
      persistentVolumeClaim:
        claimName: minecraft-datadir
    - name: backups
      emptyDir: {}
