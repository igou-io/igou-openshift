apiVersion: v1
kind: Pod
metadata:
  name: mc-backup-idle
  namespace: minecraft-server
  labels:
    app: mc-backup-idle
spec:
  restartPolicy: Always
  containers:
    - name: mc-backup
      image: itzg/mc-backup:latest@sha256:f1f17cb1a7455a4830d0baccd46a9142e3c697dd7abeab40a3e304b96a313efa
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - sleep infinity
      volumeMounts:
        - name: minecraft-datadir
          mountPath: /data
        - name: backups
          mountPath: /backups
  volumes:
    - name: minecraft-datadir
      persistentVolumeClaim:
        claimName: minecraft-datadir
    - name: backups
      emptyDir: {}
