apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-sre-truenas
  namespace: omnigent-sandboxes
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-truenas
  target:
    name: omnigent-sre-truenas
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        truenas.env: |
          TRUENAS_URL=https://truenas.igou.systems
          TRUENAS_WS_URL=wss://truenas.igou.systems/api/current
          TRUENAS_API_KEY={{ .api_key }}
          PERMISSIONS=readonly
  dataFrom:
    - extract:
        key: agent-ro-api
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
