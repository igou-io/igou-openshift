apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-slack
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-slack
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OMNIGENT_SLACK_BOT_TOKEN: '{{ index . "bot-token" }}'
        OMNIGENT_SLACK_APP_TOKEN: '{{ index . "app-token" }}'
        OMNIGENT_SLACK_TOKEN_ENCRYPTION_KEY: '{{ index . "encryption-key" }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: omnigent-slack
        metadataPolicy: None
        nullBytePolicy: Ignore
