apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-auth
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OMNIGENT_ACCOUNTS_COOKIE_SECRET: '{{ index . "cookie-secret" }}'
        OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD: '{{ index . "admin-password" }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: omnigent
        metadataPolicy: None
        nullBytePolicy: Ignore
