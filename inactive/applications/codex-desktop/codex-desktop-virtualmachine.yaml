---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: codex-desktop
  namespace: codex-desktop
  labels:
    app.kubernetes.io/name: codex-desktop
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-desktop
    spec:
      architecture: amd64
      terminationGracePeriodSeconds: 120
      domain:
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
              bootOrder: 1
              serial: codex-root
            - name: state
              disk:
                bus: virtio
              serial: codex-state
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              model: virtio
              masquerade: {}
          rng: {}
      networks:
        - name: default
          pod: {}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/burst
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      tolerations:
        - key: workload
          operator: Equal
          value: burst
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      volumes:
        # AAP owns this runtime-created DataVolume; it is deliberately not a template.
        - name: root
          dataVolume:
            name: codex-desktop-root
        - name: state
          persistentVolumeClaim:
            claimName: codex-desktop-state
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: codex-desktop
              ssh_pwauth: false
              disable_root: true
              users:
                - name: igou
                  groups:
                    - wheel
                  shell: /bin/bash
                  lock_passwd: true
                  sudo:
                    - ALL=(ALL) NOPASSWD:ALL
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINHO7UsiIgAepf5+s2z+1CbPQf2eqJo8aNK/vT9Oaf4B
