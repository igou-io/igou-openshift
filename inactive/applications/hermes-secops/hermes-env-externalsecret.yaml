---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes-secops
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        API_SERVER_KEY: '{{ .api_server_key }}'
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: '{{ .username }}'
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: '{{ .password_hash }}'
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: '{{ .password_secret }}'
  dataFrom:
    - extract:
        key: hermes-secops
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
