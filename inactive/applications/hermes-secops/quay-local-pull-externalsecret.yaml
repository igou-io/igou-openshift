---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-local-pull
  namespace: hermes-secops
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-container-registries
  target:
    name: quay-local-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"quay.apps.ocp.igou.systems":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: hermes-secops-quay-pull
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
