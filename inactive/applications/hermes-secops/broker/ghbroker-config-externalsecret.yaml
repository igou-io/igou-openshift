---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghbroker-config
  namespace: hermes-secops-auth
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: ghbroker-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config.yaml: |
          github_app:
            client_id: "{{ .client_id }}"
            app_slug: "{{ .app_slug }}"
            installations:
              igou-io: "{{ index . "installation_id_igou-io" }}"
            private_key_path: /etc/ghbroker/key.pem
        key.pem: '{{ .private_key }}'
  dataFrom:
    - extract:
        key: igou-hermes-github-app
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
