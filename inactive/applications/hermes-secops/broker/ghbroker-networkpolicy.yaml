---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghbroker
  namespace: hermes-secops-auth
spec:
  podSelector:
    matchLabels:
      app: ghbroker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-secops
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: hermes-secops
              app.kubernetes.io/name: hermes-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-secops
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: hermes-agent
      ports:
        - protocol: TCP
          port: 8085
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
