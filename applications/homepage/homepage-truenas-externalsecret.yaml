---
# Only the API-key field is extracted — the `truenas` item also holds SSH keys
# and passwords that must not land in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-truenas
  namespace: homepage
spec:
  refreshInterval: 24h
  data:
    - secretKey: HOMEPAGE_VAR_TRUENAS_KEY
      remoteRef:
        # conversion/decoding/metadata values are API-server defaults, stated
        # explicitly so ArgoCD's server-side-apply diff doesn't report the
        # resource as forever OutOfSync (same wart as the jellyfin HTTPRoute).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: truenas
        property: truenas_api_key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
