---
# Only the API-key field is extracted — the `truenas` item also holds SSH keys
# and passwords that must not land in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-truenas
  namespace: homepage
spec:
  refreshInterval: 24h
  data:
    - secretKey: HOMEPAGE_VAR_TRUENAS_KEY
      remoteRef:
        key: truenas
        property: truenas_api_key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
