---
# Long-lived token for the homepage SA (kube-controller-manager fills in
# .data.token). Injected as HOMEPAGE_VAR_THANOS_TOKEN so widget configs can
# reference {{HOMEPAGE_VAR_THANOS_TOKEN}} against thanos-querier.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-thanos-token
  namespace: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
type: kubernetes.io/service-account-token
