---
# Static tiles for apps exposed via raw Routes (no annotation-based discovery
# for the openshift Route kind). Apps exposed via Ingress or HTTPRoute are
# auto-discovered from gethomepage.dev/* annotations instead — do not
# duplicate them here (currently: ntfy, gitea-mirror, jellyfin).
#
# Alerts + Servers widgets query thanos-querier (bearer token from the
# homepage SA via HOMEPAGE_VAR_THANOS_TOKEN) and the open rk8s Prometheus
# API. All PromQL was validated against live data before landing here.
- Platform:
    - OpenShift Console:
        icon: openshift.png
        href: https://console-openshift-console.apps.ocp.igou.systems
        description: cluster console
    - ArgoCD:
        icon: argocd.png
        href: https://openshift-gitops-server-openshift-gitops.apps.ocp.igou.systems
        description: gitops
        widget:
          type: argocd
          url: https://openshift-gitops-server-openshift-gitops.apps.ocp.igou.systems
          key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
          refreshInterval: 60000
    - Grafana:
        icon: grafana.png
        href: https://grafana.apps.ocp.igou.systems
        description: dashboards (ocp + rk8s folders)
    - AAP:
        icon: ansible.png
        href: https://automation.apps.ocp.igou.systems
        description: automation controller
        widget:
          type: customapi
          url: https://automation.apps.ocp.igou.systems/api/controller/v2/jobs/?order_by=-started&page_size=4
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_AAP_TOKEN}}"
          refreshInterval: 120000
          display: dynamic-list
          mappings:
            items: results
            name: name
            label: status
            limit: 4
    - RHDH:
        icon: backstage.png
        href: https://rhdh.apps.ocp.igou.systems
        description: developer hub
    - Keycloak:
        icon: keycloak.png
        href: https://keycloak.apps.ocp.igou.systems
        description: sso
    - Quay:
        icon: quay.png
        href: https://quay.apps.ocp.igou.systems
        description: registry
    - Dev Spaces:
        icon: eclipse-che.png
        href: https://devspaces.apps.ocp.igou.systems
        description: cloud ide

- Alerts:
    - Fleet Alerts:
        icon: mdi-bell-ring
        href: https://console-openshift-console.apps.ocp.igou.systems/monitoring/alerts
        description: firing counts (thanos)
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          metrics:
            - label: ocp critical
              query: 'count(ALERTS{alertstate="firing",severity="critical",cluster!="rk8s"}) or vector(0)'
            - label: ocp warning
              query: 'count(ALERTS{alertstate="firing",severity="warning",cluster!="rk8s"}) or vector(0)'
            - label: rk8s firing
              query: 'count(ALERTS{alertstate="firing",severity=~"warning|critical",cluster="rk8s"}) or vector(0)'
    - OCP Alerts:
        icon: mdi-alert-circle
        href: https://console-openshift-console.apps.ocp.igou.systems/monitoring/alerts
        description: firing on ocp
        widget:
          type: customapi
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems/api/v1/query?query=count%20by%20(alertname,severity)%20(ALERTS%7Balertstate%3D%22firing%22,severity%3D~%22warning%7Ccritical%22,cluster!%3D%22rk8s%22%7D)
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.alertname
            label: metric.severity
            limit: 5
    - rk8s Alerts:
        icon: mdi-alert-circle-outline
        href: https://alertmanager.rk8s.igou.systems
        description: firing on rk8s
        widget:
          type: customapi
          url: https://prometheus.rk8s.igou.systems/api/v1/query?query=count%20by%20(alertname,severity)%20(ALERTS%7Balertstate%3D%22firing%22,severity%3D~%22warning%7Ccritical%22%7D)
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.alertname
            label: metric.severity
            limit: 5

- Work Queue:
    # GitHub search API, unauthenticated - works because igou-openshift and
    # igou-devenv are PUBLIC repos. igou-inventory is private, so its
    # alert-issue backlog can't be shown without token plumbing (ghapp
    # tokens are 1h; homepage reads env at startup only).
    - PRs igou-openshift:
        icon: github.png
        href: https://github.com/igou-io/igou-openshift/pulls
        description: open pull requests
        widget:
          type: customapi
          url: https://api.github.com/search/issues?q=repo%3Aigou-io%2Figou-openshift+is%3Apr+is%3Aopen&per_page=4
          headers:
            Accept: application/vnd.github+json
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: items
            name: title
            label: user.login
            limit: 4
    - PRs igou-devenv:
        icon: github.png
        href: https://github.com/igou-io/igou-devenv/pulls
        description: open pull requests
        widget:
          type: customapi
          url: https://api.github.com/search/issues?q=repo%3Aigou-io%2Figou-devenv+is%3Apr+is%3Aopen
          headers:
            Accept: application/vnd.github+json
          refreshInterval: 300000
          mappings:
            - field: total_count
              label: open
    - Renovate:
        icon: renovate.png
        href: https://github.com/pulls?q=org%3Aigou-io+is%3Apr+is%3Aopen+author%3Aapp%2Frenovate
        description: dependency PRs (public repos)
        widget:
          type: customapi
          url: https://api.github.com/search/issues?q=org%3Aigou-io+is%3Apr+is%3Aopen+author%3Aapp%2Frenovate
          headers:
            Accept: application/vnd.github+json
          refreshInterval: 300000
          mappings:
            - field: total_count
              label: open

