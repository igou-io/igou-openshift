    - truenas (host):
        icon: truenas.png
        description: storage host
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          metrics:
            - label: load1
              query: 'netdata_system_load_load_average{job="truenas-netdata",dimension="load1"}'
              format:
                type: number
                options:
                  maximumFractionDigits: 1
            - label: mem
              query: '100 * (1 - sum(netdata_Available_memory_Bytes_average{job="truenas-netdata"}) / sum(netdata_Total_memory_Bytes_average{job="truenas-netdata"}))'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: pool max
              query: '100 * max(zfs_pool_allocated_bytes{job="truenas-zfs"} / zfs_pool_size_bytes{job="truenas-zfs"})'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0

