- Servers:
    - ocp master (ms01):
        icon: mdi-server
        description: ocp control plane
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          metrics:
            - label: cpu
              query: '100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle",instance="ocp.igou.systems"}[5m])))'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: mem
              query: '100 * (1 - node_memory_MemAvailable_bytes{instance="ocp.igou.systems"} / node_memory_MemTotal_bytes{instance="ocp.igou.systems"})'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
            - label: disk /
              query: '100 * max(1 - node_filesystem_avail_bytes{instance="ocp.igou.systems",mountpoint="/"} / node_filesystem_size_bytes{instance="ocp.igou.systems",mountpoint="/"})'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
