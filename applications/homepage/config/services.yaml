    - KubeVirt VMs:
        icon: mdi-monitor-multiple
        href: https://console-openshift-console.apps.ocp.igou.systems/k8s/all-namespaces/kubevirt.io~v1~VirtualMachine
        description: vm fleet
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          metrics:
            - label: running
              query: 'sum(kubevirt_vmi_phase_count{phase="running"}) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: not running
              query: '(sum(kubevirt_vmi_phase_count) - sum(kubevirt_vmi_phase_count{phase="running"})) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

- Storage & Infra:
    - Backups:
        icon: mdi-backup-restore
        href: https://grafana.apps.ocp.igou.systems
        description: age of last success
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 300000
          metrics:
            - label: velero daily-apps
              query: 'time() - max(velero_backup_last_successful_timestamp{schedule="daily-apps"})'
              format:
                type: duration
            - label: velero daily-platform
              query: 'time() - max(velero_backup_last_successful_timestamp{schedule="daily-platform"})'
              format:
                type: duration
            - label: velero weekly
              query: 'time() - max(velero_backup_last_successful_timestamp{schedule=~"weekly.*"})'
              format:
                type: duration
            - label: etcd
              query: 'time() - max(kube_cronjob_status_last_successful_time{namespace="etcd-backup",cronjob="etcd-backup"})'
              format:
                type: duration
    - Lab Power:
        icon: mdi-flash
        href: https://grafana.apps.ocp.igou.systems
        description: wall draw (ups estimate)
        widget:
          type: prometheusmetric
          url: https://thanos-querier-openshift-monitoring.apps.ocp.igou.systems
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_THANOS_TOKEN}}"
          refreshInterval: 60000
          metrics:
            - label: total wall
              query: 'sum(network_ups_tools_ups_load / 100 * on(ups) group_left() network_ups_tools_ups_realpower_nominal)'
              format:
                type: number
                suffix: " W"
                options:
                  maximumFractionDigits: 0
            - label: truenas (ipmi)
              query: 'max(ipmi_dcmi_power_consumption_watts{job="truenas-ipmi"})'
              format:
                type: number
                suffix: " W"
                options:
                  maximumFractionDigits: 0
            - label: ups battery
              query: 'min(network_ups_tools_battery_charge)'
              format:
                type: number
                suffix: "%"
                options:
                  maximumFractionDigits: 0
    - TrueNAS:
        icon: truenas.png
        href: https://truenas.igou.systems
        description: storage
        widget:
          type: truenas
          url: https://truenas.igou.systems
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
          enablePools: true

