apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - homepage-namespace.yaml
  - homepage-clusterrole.yaml
  - homepage-clusterrolebinding.yaml
  - homepage-monitoring-clusterrolebinding.yaml
  - homepage-thanos-token-secret.yaml
  - homepage-truenas-externalsecret.yaml
  - homepage-argocd-externalsecret.yaml
  - homepage-aap-externalsecret.yaml
  - default-deny-networkpolicy.yaml
  - homepage-ingress-networkpolicy.yaml
  - homepage-egress-networkpolicy.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - config/settings.yaml
      - config/widgets.yaml
      - config/services.yaml
      - config/bookmarks.yaml
      - config/kubernetes.yaml
      - config/docker.yaml
      - config/proxmox.yaml
      - config/custom.css
      - config/custom.js
generatorOptions:
  disableNameSuffixHash: true
helmCharts:
- name: app-template
  namespace: homepage
  version: 4.6.2
  releaseName: homepage
  repo: oci://ghcr.io/bjw-s-labs/helm
  valuesFile: values-dummy.yaml
  valuesInline:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    controllers:
      homepage:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
              pullPolicy: IfNotPresent
            env:
              HOMEPAGE_ALLOWED_HOSTS: home.apps.ocp.igou.systems
              HOMEPAGE_VAR_THANOS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: homepage-thanos-token
                    key: token
            envFrom:
              - secretRef:
                  name: homepage-truenas
              - secretRef:
                  name: homepage-argocd
              - secretRef:
                  name: homepage-aap
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config
            readOnly: true
      # homepage writes request logs under config/logs — give it a writable
      # overlay so the configMap mount can stay read-only
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
    service:
      app:
        controller: homepage
        ports:
          http:
            port: 80
            targetPort: 3000
    ingress:
      app:
        className: openshift-default
        annotations:
          route.openshift.io/termination: edge
        hosts:
          - host: home.apps.ocp.igou.systems
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
    serviceAccount:
      homepage:
        enabled: true
