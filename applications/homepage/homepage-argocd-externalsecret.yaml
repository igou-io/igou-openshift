---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-argocd
  namespace: homepage
spec:
  refreshInterval: 24h
  data:
    - secretKey: HOMEPAGE_VAR_ARGOCD_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: homepage-argocd
        property: argocd_token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
