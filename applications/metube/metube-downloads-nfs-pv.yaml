---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: metube-downloads-nfs
  labels:
    # Download staging is bulk, reproducible media. OADP protects only the
    # small state PVC; TrueNAS snapshots protect the containing cold dataset.
    velero.io/exclude-from-backup: "true"
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: metube-static-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  claimRef:
    namespace: metube
    name: metube-downloads
  nfs:
    server: 10.10.9.213
    path: /mnt/cold/media/data/metube
    readOnly: false
