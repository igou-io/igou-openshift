---
# Declarative equivalent of:
#   oc adm policy add-scc-to-user hermes-agent-root -z hermes-agent -n hermes-k8s
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:hermes-agent-root
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - hermes-agent-root
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:hermes-agent-root
  namespace: hermes-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:hermes-agent-root
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: hermes-k8s
