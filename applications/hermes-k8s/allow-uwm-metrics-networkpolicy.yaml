---
# Additive to the operator/hermes-managed policies: UWM prometheus must be
# able to reach the agent's metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uwm-metrics
  namespace: hermes-k8s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes-k8s
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9090
          protocol: TCP
