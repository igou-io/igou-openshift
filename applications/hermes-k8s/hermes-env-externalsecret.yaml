---
# Runtime secrets for the agent container, sourced from the same 1Password
# items the VM's Ansible-managed .env used (group_vars/hermes.yml in
# igou-inventory). Consumed via `spec.envFrom` on the HermesInstance.
#
# PREREQUISITE: ClusterSecretStore `onepassword-lab-agents`
# (clusters/ocp/external-secrets-operator/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes-k8s
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
      remoteRef:
        key: hermes
        property: password_hash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes
        property: password_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # CUTOVER GATE — deliberately absent while the VM is live: Slack socket
    # mode round-robins events across connections, so a second gateway with
    # the same tokens STEALS messages from the prod VM. Uncomment when the VM
    # retires (verified live 2026-08-14: the parallel instance connected to
    # the workspace within seconds of getting the tokens).
    # - secretKey: SLACK_APP_TOKEN
    #   remoteRef:
    #     key: hermes
    #     property: slack_app_token
    # - secretKey: SLACK_BOT_TOKEN
    #   remoteRef:
    #     key: hermes
    #     property: slack_bot_token
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: opencode-go-api-key
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# GCP service-account key for the storescrape → Google Sheets cron
# ("zero-role SA, Editor on the meat-prices spreadsheet only"). On the VM this
# was ~/.config/gcp-sa/storescrape-sheets.json bind-mounted read-only into
# terminal containers; here it is a Secret volume in the session PodSpec.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-sa-storescrape
  namespace: hermes-k8s
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: gcp-sa-storescrape
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: storescrape-sheets.json
      remoteRef:
        key: storescrape-sheets
        property: keyfile
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
