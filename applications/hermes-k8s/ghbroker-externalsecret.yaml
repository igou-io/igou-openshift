---
# The ghapp broker's GitHub App identity (`igou-hermes` App — the same identity
# the VM's broker used). The 1Password item was copied from vault `awx` into
# `lab_agents` (2026-08-14, Connect REST) because the cluster's Connect token
# cannot read `awx`; AAP keeps using the original.
#
# The whole ghapp config.yaml is templated here rather than split into a
# ConfigMap because the item stores every field (including client_id) as
# concealed — simplest to treat the lot as secret material.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghbroker-config
  namespace: hermes-k8s
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: ghbroker-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yaml: |
          github_app:
            client_id: "{{ .client_id }}"
            app_slug: "{{ .app_slug }}"
            installations:
              david-igou: "{{ .inst_david }}"
              igou-io: "{{ .inst_igouio }}"
            private_key_path: /etc/ghbroker/key.pem
        key.pem: '{{ .private_key }}'
  data:
    - secretKey: client_id
      remoteRef:
        key: igou-hermes-github-app
        property: client_id
    - secretKey: app_slug
      remoteRef:
        key: igou-hermes-github-app
        property: app_slug
    - secretKey: inst_david
      remoteRef:
        key: igou-hermes-github-app
        property: installation_id_david-igou
    - secretKey: inst_igouio
      remoteRef:
        key: igou-hermes-github-app
        property: installation_id_igou-io
    - secretKey: private_key
      remoteRef:
        key: igou-hermes-github-app
        property: private_key
