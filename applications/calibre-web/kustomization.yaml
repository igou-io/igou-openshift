---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: calibre-web
resources:
  - default-deny-networkpolicy.yaml
  - allow-calibre-web-networkpolicy.yaml
  - calibre-web-namespace.yaml
  - calibre-web-books-nfs-pv.yaml
  - calibre-web-books-nfs-pvc.yaml
  - calibre-web-config-pvc.yaml
  - calibre-web-anyuid-clusterrolebinding.yaml
  - calibre-web-route.yaml
helmCharts:
  - name: app-template
    namespace: calibre-web
    version: 4.6.2
    releaseName: calibre-web
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        automountServiceAccountToken: false
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      controllers:
        calibre-web:
          type: deployment
          replicas: 0
          strategy: Recreate
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
          pod:
            annotations:
              backup.velero.io/backup-volumes: books
          containers:
            app:
              # No pod/container securityContext at all: OpenShift SCC admission
              # rejected the pod otherwise (Forbidden: seccomp may not be set /
              # runAsUser must be in the namespace range). The SA already gets
              # anyuid via calibre-web-anyuid, which allows the root entrypoint
              # the LinuxServer.io image needs.
              image:
                repository: lscr.io/linuxserver/calibre-web
                tag: 0.6.27-ls400@sha256:b1b9d15e12561ab4cd7cb01a693000e57925bf1906c69d04d5685891c7376ead
                pullPolicy: IfNotPresent
              env:
                PGID: "3006"
                PUID: "1000"
                TZ: America/New_York
              probes:
                startup:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8083
                  spec:
                    failureThreshold: 30
                    periodSeconds: 10
                readiness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8083
                liveness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8083
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
      persistence:
        config:
          type: persistentVolumeClaim
          existingClaim: calibre-web-config
          advancedMounts:
            calibre-web:
              app:
                - path: /config
        books:
          type: persistentVolumeClaim
          existingClaim: calibre-web-books
          advancedMounts:
            calibre-web:
              app:
                - path: /books
                  readOnly: false
        tmp:
          type: emptyDir
          advancedMounts:
            calibre-web:
              app:
                - path: /tmp
      service:
        app:
          controller: calibre-web
          ports:
            http:
              port: 80
              targetPort: 8083
      serviceAccount:
        calibre-web:
          enabled: true
