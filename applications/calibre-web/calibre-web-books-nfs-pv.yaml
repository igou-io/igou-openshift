---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: calibre-web-books-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: calibre-web-static-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 10.10.9.213
    path: /mnt/cold/media/data/media/books
    readOnly: false
  claimRef:
    namespace: calibre-web
    name: calibre-web-books
