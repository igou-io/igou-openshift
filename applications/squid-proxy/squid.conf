# Squid forward proxy — cluster-internal Hermes HTTP/HTTPS egress, no disk cache

http_port 3128

# ICMP health probing needs raw sockets, which are intentionally unavailable
# under the container's non-root, drop-all-capabilities security context.
pinger_enable off

# Allow ordinary HTTP/80 and HTTPS CONNECT/443. No TLS interception is used;
# CONNECT remains an end-to-end tunnel between the client and its destination.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Destination-network guardrails are evaluated before the public allow. This
# protects against DNS rebinding and direct requests to internal IPs without
# relying on a hostname allowlist.
acl dst_blocked_ipv4 dst 0.0.0.0/8
acl dst_blocked_ipv4 dst 10.0.0.0/8 100.64.0.0/10
acl dst_blocked_ipv4 dst 127.0.0.0/8 169.254.0.0/16
acl dst_blocked_ipv4 dst 172.16.0.0/12 192.0.0.0/24
acl dst_blocked_ipv4 dst 192.0.2.0/24 192.168.0.0/16
acl dst_blocked_ipv4 dst 198.18.0.0/15 198.51.100.0/24
acl dst_blocked_ipv4 dst 203.0.113.0/24 224.0.0.0/4
acl dst_blocked_ipv4 dst 240.0.0.0/4
acl dst_blocked_ipv6 dst ::/128 ::1/128
acl dst_blocked_ipv6 dst fc00::/7 fe80::/10 ff00::/8

# Clamp CONNECT to SSL ports only (prevents CONNECT tunneling to arbitrary ports).
http_access deny CONNECT !SSL_ports

# Deny requests to non-standard ports and every protected destination range
# before allowing arbitrary public HTTP/HTTPS.
http_access deny !Safe_ports
http_access deny dst_blocked_ipv4
http_access deny dst_blocked_ipv6
http_access allow all
http_access deny all

# Container-friendly logging: access log to stdout, cache log to stderr
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

# Do not serve or store cached responses; this is a tunnel-only forward proxy.
cache deny all

# Runtime write locations (emptyDir mount)
coredump_dir /var/spool/squid
pid_filename /var/spool/squid/squid.pid
