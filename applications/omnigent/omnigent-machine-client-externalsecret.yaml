apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-machine-client
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-machine-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OMNIGENT_MACHINE_CLIENT_ID: '{{ index . "client-id" }}'
        OMNIGENT_MACHINE_CLIENT_SECRET_HASH: '{{ index . "client-secret-hash" }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: omnigent-automation-orchestrator
        metadataPolicy: None
        nullBytePolicy: Ignore
