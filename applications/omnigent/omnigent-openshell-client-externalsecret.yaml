apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-openshell-client
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-openshell-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OMNIGENT_OPENSHELL_OIDC_CLIENT_SECRET: '{{ .OPENSHELL_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: omnigent-openshell
        metadataPolicy: None
        nullBytePolicy: Ignore
