apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-sre-ocp
  namespace: omnigent-sandboxes
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-serviceaccounts
  target:
    name: omnigent-sre-ocp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: ocp
              cluster:
                server: https://api.ocp.igou.systems:6443
          users:
            - name: ocp-cluster-reader
              user:
                token: '{{ .token }}'
          contexts:
            - name: ocp-cluster-reader
              context:
                cluster: ocp
                user: ocp-cluster-reader
          current-context: ocp-cluster-reader
  dataFrom:
    - extract:
        key: ocp-cluster-read-only
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
