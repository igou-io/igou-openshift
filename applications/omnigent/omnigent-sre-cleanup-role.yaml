apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnigent-sre-cleanup
  namespace: omnigent-sandboxes
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - delete
