# Source definitions for the four user-owned Omnigent Automations.
# Register with scripts/register_automations.py; registration always leaves them paused.
agent: igou-sre
timezone: America/New_York
execution_target: managed_sandbox
automations:
  - name: SRESweepDailyHealth
    prompt_file: sweeps/daily-health.md
    rrule: FREQ=DAILY;BYHOUR=7;BYMINUTE=0
  - name: SRESweepHygiene
    prompt_file: sweeps/hygiene.md
    rrule: FREQ=WEEKLY;BYDAY=MO;BYHOUR=9;BYMINUTE=30
  - name: SRESweepCapacity
    prompt_file: sweeps/capacity.md
    rrule: FREQ=WEEKLY;BYDAY=TU;BYHOUR=9;BYMINUTE=0
  - name: SRESweepPRFollowup
    prompt_file: sweeps/pr-followup.md
    rrule: FREQ=WEEKLY;BYDAY=MO,TH;BYHOUR=10;BYMINUTE=30
