apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-device-auth
  namespace: omnigent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-device-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OMNIGENT_DEVICE_CLIENT_SECRET: '{{ index . "device-client-secret" }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: omnigent-slack
        metadataPolicy: None
        nullBytePolicy: Ignore
