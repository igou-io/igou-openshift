apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-creds
  namespace: omnigent-sandboxes
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: omnigent-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OPENCODE_GO_API_KEY: '{{ .password }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: opencode-go-subscription-key
        metadataPolicy: None
        nullBytePolicy: Ignore
