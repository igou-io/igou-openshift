apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigent-slack
  namespace: omnigent
spec:
  podSelector:
    matchLabels:
      app: omnigent-slack
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - podSelector:
            matchLabels:
              app: omnigent
      ports:
        - protocol: TCP
          port: 8000
