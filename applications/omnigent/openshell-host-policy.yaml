version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /opt/omnigent
    - /opt/mise
    - /home/igou
  read_write:
    - /sandbox
    - /codex-auth
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/shm
network_policies:
  omnigent_server:
    endpoints:
      - host: omnigent.apps.ocp.igou.systems
        port: 443
        tls: skip
    binaries:
      - path: /usr/bin/python3.12
      - path: /opt/omnigent/bin/python*
  opencode_go:
    endpoints:
      - host: opencode.ai
        port: 443
        tls: skip
    binaries:
      - path: /home/igou/.opencode/bin/opencode
      - path: /usr/local/bin/node
      - path: /opt/mise/installs/node/*/node-*/bin/node
      - path: /usr/bin/python3.12
      - path: /opt/omnigent/bin/python*
  codex_chatgpt:
    endpoints:
      - host: auth.openai.com
        port: 443
        tls: skip
      - host: chatgpt.com
        port: 443
        tls: skip
      - host: api.openai.com
        port: 443
        tls: skip
    binaries:
      - path: /home/igou/.local/bin/codex
      - path: /home/igou/.local/share/codex/*/bin/codex
