apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigent-sre-runner
  namespace: omnigent-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: omnigent
      omnigent.ai/agent: igou-sre
      omnigent.ai/role: sandbox-host
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnigent
          podSelector:
            matchLabels:
              app: omnigent
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-sre
          podSelector:
            matchLabels:
              app: ghbroker
      ports:
        - protocol: TCP
          port: 8085
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sands-of-time
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.10.9.30/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 10.10.9.11/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.10.99.1/32
        - ipBlock:
            cidr: 10.10.99.20/32
        - ipBlock:
            cidr: 10.10.99.22/32
        - ipBlock:
            cidr: 10.10.99.23/32
      ports:
        - protocol: TCP
          port: 8729
    - to:
        - ipBlock:
            cidr: 10.10.9.213/32
      ports:
        - protocol: TCP
          port: 443
