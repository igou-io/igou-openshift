apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      annotations:
        omnigent.io/sandbox-config-sha256: d4b81bc5ad538a83a8e803a15eade41408dfd264a3feeb981bfee5c0523e3fe5
      labels:
        app: omnigent
    spec:
      serviceAccountName: omnigent-server
      imagePullSecrets:
        - name: quay-local-pull
      securityContext:
        runAsNonRoot: true
      containers:
        - name: omnigent
          image: quay.apps.ocp.igou.systems/igou-io/omnigent-server-openshell@sha256:8ada0a0f00e40ec032284ce13eef2c3b6efad1ede58d973186b7a78697a7e9a3
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: omnigent-config
            - secretRef:
                name: omnigent-auth
            - secretRef:
                name: omnigent-machine-client
            - secretRef:
                name: omnigent-opencode-go
            - secretRef:
                name: omnigent-openshell-client
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnigent-pg-app
                  key: uri
            - name: OMNIGENT_CONFIG
              value: /etc/omnigent/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: openshell-policy
              mountPath: /etc/omnigent/openshell
              readOnly: true
            - name: artifacts
              mountPath: /data/artifacts
            - name: sandbox-config
              mountPath: /etc/omnigent/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: test-agent
              mountPath: /etc/omnigent/agents
              readOnly: true
            - name: openshell-gateway
              mountPath: /etc/openshell/gateways/ocp/metadata.json
              subPath: metadata.json
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: openshell-policy
          configMap:
            name: omnigent-openshell-policy
        - name: artifacts
          persistentVolumeClaim:
            claimName: omnigent-artifacts
        - name: sandbox-config
          configMap:
            name: omnigent-sandbox-config
        - name: test-agent
          configMap:
            name: omnigent-test-agent
        - name: openshell-gateway
          configMap:
            name: omnigent-openshell-gateway
