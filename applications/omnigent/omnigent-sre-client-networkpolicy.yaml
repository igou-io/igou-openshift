apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigent-sre-client
  namespace: omnigent
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - omnigent-sre-sweep-client
          - omnigent-sre-cleanup-client
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app: omnigent
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 172.30.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
