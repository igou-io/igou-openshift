apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-sre-routeros
  namespace: omnigent-sandboxes
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-routeros
  target:
    name: omnigent-sre-routeros
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        routeros.env: |
          ROUTEROS_USERNAME={{ .username }}
          ROUTEROS_PASSWORD={{ .password }}
          ROUTEROS_API_PORT=8729
          ROUTEROS_HOSTS=rb5009.igou.systems,crs310.igou.systems,crs317.igou.systems,crs328.igou.systems
          PERMISSIONS=readonly
  dataFrom:
    - extract:
        key: mktxp-exporter
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
