apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: 0.0.0.0
  PORT: '8000'
  ARTIFACT_DIR: /data/artifacts
  OMNIGENT_AUTH_ENABLED: '1'
  OMNIGENT_AUTH_PROVIDER: accounts
  OMNIGENT_DEVICE_GRANT_ENABLED: '1'
  OMNIGENT_ACCOUNTS_BASE_URL: https://omnigent.apps.ocp.igou.systems
  OMNIGENT_ACCOUNTS_INIT_ADMIN_USERNAME: igou
  OMNIGENT_ACCOUNTS_AUTO_OPEN: '0'
  OMNIGENT_BUILTIN_AGENT_DIRS: /etc/omnigent/igou-sre
  OMNIGENT_MACHINE_SUB: automation-orchestrator
  OMNIGENT_MACHINE_TOKEN_TTL: '300'
  OPENCODE_CONFIG_DIR: /mnt/opencode-config
  XDG_CONFIG_HOME: /etc
  OMNIGENT_RUNNER_ENV_PASSTHROUGH: https_proxy,http_proxy,HTTPS_PROXY,HTTP_PROXY,NO_PROXY,no_proxy,GHAPP_BROKER_URL,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL,GIT_COMMITTER_NAME,GIT_COMMITTER_EMAIL,OPENCODE_CONFIG_DIR
