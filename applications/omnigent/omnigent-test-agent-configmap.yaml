apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-test-agent
  namespace: omnigent
data:
  codex-chatgpt.yaml: |
    name: codex-chatgpt
    prompt: |
      You are a concise coding assistant. Use the workspace tools to complete
      the user's task and verify your changes.
    executor:
      harness: codex
      auth:
        type: provider
        name: codex-chatgpt
    os_env:
      type: caller_process
      cwd: .
      sandbox:
        type: none
  opencode-go-test.yaml: |
    name: opencode-go-test
    prompt: |
      You are a concise coding assistant. Use the workspace tools to complete
      the user's task and verify your changes.
    executor:
      harness: opencode
      model: glm-5.3-flash
      auth:
        type: provider
        name: opencode-go
    os_env:
      type: caller_process
      cwd: .
      sandbox:
        type: none
