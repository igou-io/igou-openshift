apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: openshell
      server_url: https://omnigent.apps.ocp.igou.systems
      host_config:
        inference:
          harnesses:
            opencode:
              provider: opencode-go
              default_model: glm-5.3-flash
              model_allowlist:
                - glm-5.3-flash
        providers:
          codex-chatgpt:
            kind: subscription
            cli: codex
          opencode-go:
            kind: gateway
            openai:
              base_url: https://opencode.ai/zen/go/v1
              api_key_ref: env:OPENCODE_GO_API_KEY
              wire_api: chat
      openshell:
        image: ghcr.io/igou-io/igou-devenv@sha256:f1203aeaf1fa3fcafbc21b10bce45e1454ab4cfdac2a6aadf92c2e0fd12bb457
        env:
          - OPENCODE_GO_API_KEY
          - OMNIGENT_RUNNER_ENV_PASSTHROUGH
