apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      server_url: https://omnigent.apps.ocp.igou.systems
      host_config:
        providers:
          opencode-go:
            kind: gateway
            default:
              - opencode
            openai:
              base_url: https://opencode.ai/zen/go/v1
              api_key_ref: env:OPENCODE_GO_API_KEY
              wire_api: chat
      providers:
        - provider: kubernetes
          kubernetes:
            namespace: omnigent-sandboxes
            secret_name: omnigent-creds
            service_account: omnigent-runner
            image: ghcr.io/omnigent-ai/omnigent-host@sha256:f3dee09609ccecbebd6841c30b33f0160eaf3d2758d535b2e3993c1a3df5664a
            node_selector:
              kata-runtime: enabled
            pod_ready_timeout_s: 300
            in_cluster: true
            home_size_limit: 4Gi
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
                ephemeral-storage: 2Gi
              limits:
                cpu: '2'
                memory: 4Gi
                ephemeral-storage: 6Gi
        - provider: openshell
          openshell:
            cluster: ocp
            workspace: default
            image: ghcr.io/igou-io/igou-devenv@sha256:f1203aeaf1fa3fcafbc21b10bce45e1454ab4cfdac2a6aadf92c2e0fd12bb457
            env:
              - OPENCODE_GO_API_KEY
              - OMNIGENT_RUNNER_ENV_PASSTHROUGH
