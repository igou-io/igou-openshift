apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: agent_sandbox
      server_url: http://omnigent.omnigent.svc.cluster.local
      keep_warm_s: 1800
      reaper:
        enabled: true
        terminate_after_offline_days: 7
        sweep_interval_s: 3600
      host_config:
        inference:
          harnesses:
            opencode:
              provider: opencode-go
              default_model: glm-5.3-flash
              model_allowlist:
                - glm-5.3-flash
        providers:
          codex-chatgpt:
            kind: subscription
            cli: codex
          opencode-go:
            kind: gateway
            openai:
              base_url: https://opencode.ai/zen/go/v1
              api_key_ref: env:OPENCODE_GO_API_KEY
              wire_api: chat
      kubernetes:
        namespace: omnigent-sandboxes
        service_account: omnigent-runner
        secret_name: omnigent-creds
        image: ghcr.io/igou-io/igou-devenv@sha256:0e22e3ffccdea6fa1412fc97149cf7794cedcdf779bd7d9f227e552d8de989d4
        home_size_limit: 8Gi
        pvc_mounts:
          - claim_name: omnigent-sre-codex-auth
            mount_path: /codex-auth
            read_only: false
        pod_ready_timeout_s: 300
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 10Gi
        secret_mounts:
          - secret_name: omnigent-sre-ocp
            mount_path: /mnt/credentials/ocp
          - secret_name: sre-rk8s
            mount_path: /mnt/credentials/rk8s
          - secret_name: omnigent-sre-routeros
            mount_path: /mnt/credentials/routeros
          - secret_name: omnigent-sre-truenas
            mount_path: /mnt/credentials/truenas
          - secret_name: omnigent-creds
            mount_path: /mnt/opencode-config
        env:
          - PATH
          - USER
          - LOGNAME
          - GIT_AUTHOR_NAME
          - GIT_AUTHOR_EMAIL
          - GIT_COMMITTER_NAME
          - GIT_COMMITTER_EMAIL
          - OMNIGENT_RUNNER_ENV_PASSTHROUGH
          - OPENCODE_CONFIG_DIR
          - CODEX_HOME
          - GHAPP_BROKER_URL
          - KUBECONFIG
          - HTTP_PROXY
          - HTTPS_PROXY
          - http_proxy
          - https_proxy
          - NO_PROXY
          - no_proxy
