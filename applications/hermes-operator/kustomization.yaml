---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared Hermes plumbing, owned once: the hermes-operator chart (ns
# hermes-operator), the hermes-agent-root SCC and the ClusterRole that lets a
# namespace bind it. The per-purpose instances (hermes-assistant,
# hermes-developer, hermes-sre) only carry namespaced objects. Split out of
# applications/hermes-k8s at the 2026-08-29 cutover.
#
# No top-level `namespace:` — the SCC is cluster-scoped and kustomize would
# stamp a namespace onto it. Requires --enable-helm (build and pipe).
helmCharts:
  - name: hermes-operator
    repo: oci://ghcr.io/paperclipinc/charts
    version: 0.1.20
    releaseName: hermes-operator
    namespace: hermes-operator
    includeCRDs: true
    valuesInline:
      # Chart defaults (limits 256Mi/500m) leave the manager OOM-adjacent under
      # API watch churn: observed major-page-fault thrash at ~1.5 GB/s on the
      # node's nvme0n1 (incident 2026-09-29, NodeMemoryMajorPagesFaults).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

resources:
  - hermes-operator-namespace.yaml
  - hermes-agent-root-securitycontextconstraints.yaml
  - system-openshift-scc-hermes-agent-root-clusterrole.yaml
