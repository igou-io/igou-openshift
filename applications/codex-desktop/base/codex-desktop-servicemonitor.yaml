---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: codex-desktop
  namespace: codex-desktop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-desktop-metrics
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: codex-desktop
