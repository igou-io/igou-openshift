---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-desktop
  namespace: codex-desktop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codex-desktop
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ansible-automation-platform
      ports:
        - protocol: TCP
          port: 22
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 9100
    - ports:
        - protocol: UDP
          port: 41641
