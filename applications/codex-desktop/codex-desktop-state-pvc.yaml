---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-desktop-state
  namespace: codex-desktop
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: freenas-nvmeof-ssd-csi
  resources:
    requests:
      storage: 50Gi
