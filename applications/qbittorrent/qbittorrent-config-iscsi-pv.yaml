---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-config-iscsi
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: ""
  claimRef:
    namespace: qbittorrent
    name: qbittorrent-config
  iscsi:
    targetPortal: 10.10.9.213:3260
    iqn: iqn.2005-10.org.freenas.ctl:qbittorrent-config
    lun: 0
    fsType: ext4
    readOnly: false
