---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: qbittorrent
spec:
  parentRefs:
    - name: trusted-lan
      namespace: openshift-ingress
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - prowlarr.lan.igou.systems
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prowlarr
          port: 9696
          group: ""
          kind: Service
          weight: 1
