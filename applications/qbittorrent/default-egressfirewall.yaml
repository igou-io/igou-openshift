apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  # OVN-K requires the namespace-wide firewall to be named "default".
  name: default
  namespace: qbittorrent
spec:
  egress:
    # Service traffic is evaluated after OVN has translated the ClusterIP to a
    # Pod IP. Restrict the shared Pod CIDR exception to the two required arr
    # ports; the Gluetun firewall independently restricts their ClusterIPs.
    - type: Allow
      to:
        cidrSelector: 10.128.0.0/14
      ports:
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8989

    # Gluetun is pinned to these two Mullvad Malmö WireGuard relays. If Mullvad
    # changes either address, the tunnel fails closed until both this policy
    # and Gluetun's server data are deliberately updated.
    - type: Allow
      to:
        cidrSelector: 193.138.218.130/32
      ports:
        - protocol: UDP
          port: 51820
    - type: Allow
      to:
        cidrSelector: 193.138.218.82/32
      ports:
        - protocol: UDP
          port: 51820

    # Independent backstop for a missing, flushed, or misconfigured Gluetun
    # firewall. Public application traffic must only leave as encrypted
    # WireGuard packets covered by the relay rules above.
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
    - type: Deny
      to:
        cidrSelector: ::/0
