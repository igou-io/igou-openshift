apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Do not use a namespace transformer: the SCC and ClusterRole are cluster-
# scoped, and each namespaced resource declares namespace explicitly.
resources:
  - qbittorrent-namespace.yaml
  - qbittorrent-config-iscsi-pv.yaml
  - qbittorrent-config-pvc.yaml
  - qbittorrent-data-nfs-pv.yaml
  - qbittorrent-data-pvc.yaml
  - qbittorrent-prowlarr-config-iscsi-pv.yaml
  - prowlarr-config-pvc.yaml
  - qbittorrent-serviceaccount.yaml
  - qbittorrent-vpn-securitycontextconstraints.yaml
  - system-openshift-scc-qbittorrent-vpn-clusterrole.yaml
  - system-openshift-scc-qbittorrent-vpn-rolebinding.yaml
  - qbittorrent-mullvad-externalsecret.yaml
  - qbittorrent-deployment.yaml
  - qbittorrent-service.yaml
  - prowlarr-service.yaml
  - qbittorrent-httproute.yaml
  - prowlarr-httproute.yaml
