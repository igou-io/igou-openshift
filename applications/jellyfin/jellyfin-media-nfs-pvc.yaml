apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
  labels:
    # See jellyfin-media-nfs-pv.yaml — excluded from OADP backups.
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
  volumeName: jellyfin-media-nfs
