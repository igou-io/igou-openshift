apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-nfs
  labels:
    # 1Ti read-only media library — kept out of the OADP daily-apps
    # backup (the library is rebuildable; only jellyfin-config matters).
    velero.io/exclude-from-backup: "true"
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.10.9.213
    path: /mnt/cold/media/data/media
    readOnly: true
  claimRef:
    namespace: jellyfin
    name: jellyfin-media
