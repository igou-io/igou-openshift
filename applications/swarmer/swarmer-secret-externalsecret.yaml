---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: swarmer-secret
  namespace: openshell
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: swarmer-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SWARMER_SECRET_KEY: '{{ .SWARMER_SECRET_KEY }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: swarmer
        metadataPolicy: None
        nullBytePolicy: Ignore
