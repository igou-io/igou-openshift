apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rust
resources:
  - rust-namespace.yaml
  - rust-data-pvc.yaml
  - rust-rcon-externalsecret.yaml
  - rust-runtime-imagestream.yaml
  - rust-runtime-buildconfig.yaml
  - default-deny-networkpolicy.yaml
  - allow-rust-networkpolicy.yaml
  - allow-build-networkpolicy.yaml
configMapGenerator:
  - name: rust-scripts
    files:
      - install.sh
      - manage.py
      - server.cfg
helmCharts:
  - name: app-template
    namespace: rust
    version: 4.6.2
    releaseName: rust
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        nodeSelector:
          kubernetes.io/arch: amd64
      controllers:
        rust:
          type: deployment
          replicas: 1
          strategy: Recreate
          pod:
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 120
            securityContext:
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
          initContainers:
            install:
              image:
                repository: image-registry.openshift-image-registry.svc:5000/rust/rust-runtime
                tag: 1@sha256:174a4557a3dc5d5482364f82da8e6476981ae8ae4617fc37e4a0b54c94a1cac5
              command:
                - /bin/bash
                - /opt/rust/install.sh
              env:
                HOME: /data/home
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: '2'
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            app:
              image:
                repository: image-registry.openshift-image-registry.svc:5000/rust/rust-runtime
                tag: 1@sha256:174a4557a3dc5d5482364f82da8e6476981ae8ae4617fc37e4a0b54c94a1cac5
              command:
                - python3
                - /opt/rust/manage.py
                - start
              env:
                HOME: /data/home
                LD_LIBRARY_PATH: /data/rust/RustDedicated_Data/Plugins/x86_64:/data/steamcmd/linux64
              ports:
                - name: game
                  containerPort: 28015
                  protocol: UDP
                - name: query
                  containerPort: 28017
                  protocol: UDP
              lifecycle:
                preStop:
                  exec:
                    command:
                      - python3
                      - /opt/rust/manage.py
                      - stop
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    exec:
                      command:
                        - python3
                        - /opt/rust/manage.py
                        - query
                    periodSeconds: 10
                    timeoutSeconds: 8
                    failureThreshold: 180
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    exec:
                      command:
                        - python3
                        - /opt/rust/manage.py
                        - query
                    periodSeconds: 15
                    timeoutSeconds: 8
                    failureThreshold: 4
                # UDP query failure should remove endpoints, not kill a busy
                # server during a save. Kubernetes restarts process crashes.
                liveness:
                  enabled: false
              resources:
                requests:
                  cpu: '4'
                  memory: 12Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: '6'
                  memory: 16Gi
                  ephemeral-storage: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
      persistence:
        data:
          existingClaim: rust-data
          globalMounts:
            - path: /data
        scripts:
          type: configMap
          name: rust-scripts
          globalMounts:
            - path: /opt/rust
              readOnly: true
        rcon:
          type: secret
          name: rust-rcon
          advancedMounts:
            rust:
              app:
                - path: /run/rcon
                  readOnly: true
        runtime:
          type: emptyDir
          medium: Memory
          globalMounts:
            - path: /runtime
        tmp:
          type: emptyDir
          globalMounts:
            - path: /tmp
      service:
        rust:
          forceRename: rust
          controller: rust
          type: ClusterIP
          ports:
            game:
              port: 28015
              targetPort: 28015
              protocol: UDP
            query:
              port: 28017
              targetPort: 28017
              protocol: UDP
