---
# The igou-devenv `read-only` bundle rendered as an env-file catalog for session
# pods (mounted read-only at /etc/agent/envs; AGENT_PROFILE=read-only). Same
# format as igou-devenv envs/*.env with literal values instead of op:// refs, so
# the baked `resolve-profile` + ~/.bashrc.d/05-agent-profile.sh activate it
# without 1Password. Identities: OCP + rk8s `cluster-read-only` SAs, RouterOS
# `mktxp` (policy read,api), TrueNAS `agent-ro` (READONLY_ADMIN, JSON-RPC WS).
# One ExternalSecret per ClusterSecretStore (a store maps to one vault); the
# Secret is assembled by ESO's merge (target.creationPolicy Merge on the followers).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-serviceaccounts
  target:
    name: hermes-session-readonly
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        read-only.env: |
          INCLUDE=ocp-cluster-reader,rk8s-cluster-reader,routeros-ro,truenas-ro
          PERMISSIONS=readonly
        ocp-cluster-reader.env: |
          KUBECONFIG_TOKEN={{ .ocp_token }}
          KUBECONFIG_HOST=https://api.ocp.igou.systems:6443
          PERMISSIONS=readonly
  data:
    - secretKey: ocp_token
      remoteRef:
        key: ocp-cluster-read-only
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-rk8s
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: hermes-session-readonly
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        rk8s-cluster-reader.env: |
          KUBECONFIG_TOKEN={{ .rk8s_token }}
          KUBECONFIG_HOST=https://cm3588-nas-01.igou.systems:6443
          PERMISSIONS=readonly
  data:
    - secretKey: rk8s_token
      remoteRef:
        key: rk8s-cluster-read-only
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-routeros
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-routeros
  target:
    name: hermes-session-readonly
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        routeros-ro.env: |
          ROUTEROS_USERNAME={{ .ros_user }}
          ROUTEROS_PASSWORD={{ .ros_pass }}
          ROUTEROS_API_PORT=8729
          ROUTEROS_HOSTS=rb5009.igou.systems,crs310.igou.systems,crs317.igou.systems,crs328.igou.systems
          PERMISSIONS=readonly
  data:
    - secretKey: ros_user
      remoteRef:
        key: mktxp-exporter
        property: username
    - secretKey: ros_pass
      remoteRef:
        key: mktxp-exporter
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-truenas
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-truenas
  target:
    name: hermes-session-readonly
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        truenas-ro.env: |
          TRUENAS_URL=https://truenas.igou.systems
          TRUENAS_WS_URL=wss://truenas.igou.systems/api/current
          TRUENAS_API_KEY={{ .tn_key }}
          PERMISSIONS=readonly
  data:
    - secretKey: tn_key
      remoteRef:
        key: agent-ro-api
        property: api_key
