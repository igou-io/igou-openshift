apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-serviceaccounts
  target:
    name: hermes-session-readonly
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        read-only.env: |
          INCLUDE=ocp-cluster-reader,rk8s-cluster-reader,routeros-ro,truenas-ro
          PERMISSIONS=readonly
        ocp-cluster-reader.env: |
          KUBECONFIG_TOKEN={{ .ocp_token }}
          KUBECONFIG_HOST=https://api.ocp.igou.systems:6443
          PERMISSIONS=readonly

  data:
    - secretKey: ocp_token
      remoteRef:
        key: ocp-hermes-sre-reader
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
