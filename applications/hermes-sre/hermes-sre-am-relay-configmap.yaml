---
# Alertmanager -> Hermes webhook relay. Hermes' generic webhook platform
# requires an HMAC signature unless it binds to loopback, and Alertmanager
# cannot sign requests. So the webhook platform binds 127.0.0.1:8644 and this
# sidecar (same pod) accepts Alertmanager on :8645, signs the body with the
# route secret (X-Webhook-Signature-V2 = HMAC-SHA256("<ts>.<body>")) and
# forwards over loopback. The signing secret only protects a loopback socket,
# so it can live in git. Inbound authorization is the hermes-sre-am-relay
# bearer token (required on every POST — the relay is exposed on a Route for
# the rk8s Alertmanager, so network policy alone is no longer sufficient).
# The relay also answers 503 (Retry-After) while Hermes is at its session
# limit: Alertmanager retries 5xx, so alerts queue upstream instead of the
# gateway rejecting them. Capacity is read from Hermes' PVC-backed gateway
# state, whose active_agents count is persisted at every turn boundary;
# MAX_SESSIONS must match config max_concurrent_sessions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-sre-am-relay
  namespace: hermes-sre
data:
  relay.py: |
    import hashlib, hmac, http.client, json, os, sys, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SECRET = os.environ["WEBHOOK_SECRET"].encode()
    TARGET = os.environ.get("WEBHOOK_TARGET", "127.0.0.1:8644")
    ROUTE = os.environ.get("WEBHOOK_ROUTE", "alertmanager")
    TOKEN = os.environ.get("INBOUND_TOKEN", "")
    MAX_SESSIONS = int(os.environ.get("MAX_SESSIONS", "0"))
    STATUS_PATH = os.environ.get("GATEWAY_STATUS_PATH", "/opt/data/gateway_state.json")

    def at_capacity():
        if MAX_SESSIONS <= 0:
            return False
        try:
            with open(STATUS_PATH, encoding="utf-8") as status_file:
                payload = json.load(status_file)
            active = max(0, int(payload.get("active_agents", 0)))
        except Exception:
            # Preserve alert availability if the status probe itself fails;
            # Hermes remains the final authority and can still reject the turn.
            return False
        return active >= MAX_SESSIONS

    class H(BaseHTTPRequestHandler):
        # BaseHTTPRequestHandler answers HTTP/1.0 by default, which the
        # blackbox-exporter http_2xx module (valid_http_versions 1.1/2.0)
        # rejects. HTTP/1.1 requires an accurate Content-Length on every
        # response, hence the single reply helper. It also keeps connections
        # alive, so the server must be threaded: a plain HTTPServer serves one
        # connection to completion and a parked keep-alive client starves the
        # kubelet readiness probe.
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *a):
            sys.stderr.write("am-relay: " + (fmt % a) + "\n")

        def _reply(self, status, body, ctype="text/plain", extra=None):
            self.send_response(status)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            for k, v in (extra or {}).items():
                self.send_header(k, v)
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self._reply(200, b"ok"); return
            self._reply(404, b"not found")

        def do_POST(self):
            if TOKEN and self.headers.get("Authorization", "") != f"Bearer {TOKEN}":
                self._reply(401, b"unauthorized")
                sys.stderr.write("am-relay: rejected POST (bad or missing token)\n")
                return
            if at_capacity():
                self._reply(503, b"hermes at session limit; retry", extra={"Retry-After": "120"})
                sys.stderr.write("am-relay: 503 busy (session limit), Alertmanager will retry\n")
                return
            n = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(n)
            ts = str(int(time.time()))
            sig = hmac.new(SECRET, f"{ts}.".encode() + body, hashlib.sha256).hexdigest()
            try:
                c = http.client.HTTPConnection(TARGET, timeout=30)
                c.request("POST", f"/webhooks/{ROUTE}", body=body, headers={
                    "Content-Type": "application/json",
                    "X-Webhook-Timestamp": ts,
                    "X-Webhook-Signature-V2": sig,
                })
                r = c.getresponse(); out = r.read()
                self._reply(r.status, out, ctype="application/json")
                sys.stderr.write(f"am-relay: forwarded {n}B -> {r.status}\n")
            except Exception as e:
                self._reply(502, str(e).encode())
                sys.stderr.write(f"am-relay: forward failed: {e}\n")

    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("RELAY_PORT", "8645"))), H).serve_forever()
