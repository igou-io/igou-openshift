# Network lockdown for Hermes session pods.
#
# RBAC and pod-shape hardening address the filesystem and ServiceAccount-token
# attack surface; this is the network half. Session pods are selected by
# `app.kubernetes.io/managed-by: hermes-agent`, which the backend stamps onto
# every pod it renders.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-session-default-deny
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hermes-agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Cluster DNS. OpenShift CoreDNS listens on 5353 behind the :53 Service
    # and OVN-K applies the DNAT before egress ACLs, so BOTH ports are needed
    # (same finding as the agent egress policy).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# In-cluster services the crons rely on: the sands-of-time tracker (ClusterIP
# :80 → pod :8000; post-DNAT port again). The VM allowed this from its
# terminal containers via nftables + a tirith plain-HTTP trust entry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-session-cluster-services
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hermes-agent
  policyTypes:
    - Egress
  egress:
    # In-cluster Forgejo (http/git-over-http): dispatched agents push their
    # work to the sandbox org via forgejo-http.forgejo.svc:3000.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 3000
    # In-cluster LLM endpoints (llmkube OpenAI-compatible servers): lets a
    # session run opencode against qwen38-27b et al with no cloud key.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llmkube-system
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sands-of-time
      ports:
        - protocol: TCP
          port: 8000
    # ghapp broker (same namespace): runtime GitHub App tokens.
    - to:
        - podSelector:
            matchLabels:
              app: ghbroker
      ports:
        - protocol: TCP
          port: 8085
    # HTTP-aware session clients use the shared cluster-local proxy for public
    # HTTP/HTTPS; NO_PROXY keeps the explicit in-cluster paths direct.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
---
# hermes-sre: read-only infrastructure targets reachable from session pods.
# OVN-K applies the apiserver service DNAT (172.30.0.1:443 -> :6443) before
# egress ACLs, so the in-cluster API needs the post-DNAT port (see the
# hermes-k8s README finding #1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-session-readonly-infra
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hermes-agent
  policyTypes:
    - Egress
  egress:
    # OCP API (VIP, post-DNAT) and *.apps routes
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
    # rk8s API
    - to:
        - ipBlock:
            cidr: 10.10.9.30/32
      ports:
        - protocol: TCP
          port: 6443
    # rk8s ingress VIP (prometheus.rk8s, headlamp.rk8s)
    - to:
        - ipBlock:
            cidr: 10.10.9.11/32
      ports:
        - protocol: TCP
          port: 443
    # RouterOS api-ssl
    - to:
        - ipBlock:
            cidr: 10.10.99.1/32
        - ipBlock:
            cidr: 10.10.99.20/32
        - ipBlock:
            cidr: 10.10.99.22/32
        - ipBlock:
            cidr: 10.10.99.23/32
      ports:
        - protocol: TCP
          port: 8729
    # TrueNAS API
    - to:
        - ipBlock:
            cidr: 10.10.9.213/32
      ports:
        - protocol: TCP
          port: 443
