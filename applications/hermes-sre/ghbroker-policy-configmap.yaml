---
# Broker minting policy — the same allowlist and ceilings the VM's broker ran
# (igou-inventory group_vars/hermes.yml `hermes_ghapp_policy`). deny-not-clamp:
# requests outside policy are denied, not silently reduced. The allowlist is
# bounded by what the igou-hermes App is actually installed on — adding a repo
# here also requires adding it to the App's installations on GitHub.
#
# The broker reads policy at startup only; roll the Deployment after changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghbroker-policy
  namespace: hermes-sre
data:
  policy.yaml: |
    policy:
      allowed_repos:
        - david-igou/hermes_github_app_plugin
        - david-igou/ansible-collection-armbian
        - david-igou/ansible-collection-devhost
        - david-igou/ansible-collection-linux_baseline
        - david-igou/ansible-collection-molecule_provisioners
        - david-igou/ansible-collection-routeros_configuration
        - david-igou/ansible-collection-rustfs
        - igou-io/igou-ansible
        - igou-io/igou-containers
        - igou-io/igou-devenv
        - igou-io/igou-docs
        - igou-io/igou-inventory
        - igou-io/igou-kubernetes
        - igou-io/igou-openshift
      # contents/pull_requests write let the SRE PROPOSE fixes as PRs
      # (branch + PR only). Merging is forbidden by contract (SOUL +
      # propose-fix skill), not by the token: GitHub's merge API needs the
      # same contents:write as pushing. default_permissions stays read, so
      # write tokens exist only when a mint explicitly asks for them.
      max_permissions:
        contents: write
        issues: write
        pull_requests: write
      default_permissions:
        contents: read
      # igou-inventory and igou-docs are private repos where GitHub branch
      # protection is unavailable (free plan), so the write ceiling above
      # must not apply to them: capped at read here (issues stay writable
      # for incident memory). Tightening only; broker >= 115e45d.
      repo_max_permissions:
        igou-io/igou-inventory:
          contents: read
        igou-io/igou-docs:
          contents: read
