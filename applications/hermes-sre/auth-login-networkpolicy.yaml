---
# The login shell uses Squid for device-code OAuth and has no other egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-login
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app: auth-login
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # All external HTTP-aware login clients use the shared proxy; keep this
    # explicit rather than broadening the helper's general in-cluster egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
