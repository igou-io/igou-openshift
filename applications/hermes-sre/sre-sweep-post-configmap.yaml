---
# Shared poster for the sre-sweep-* CronJobs: builds a synthetic
# info-severity Alertmanager v4 payload from ALERTNAME/SUMMARY/DESCRIPTION
# and POSTs it to the am-relay with the bearer token — the same chain the
# sre-heartbeat exercises. Severity info keeps EDA from filing incident
# issues for scheduled sweeps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-sweep-post
  namespace: hermes-sre
data:
  post-alert.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    payload=$(jq -n --arg ts "$ts" --arg an "$ALERTNAME" \
      --arg sum "$SUMMARY" --arg desc "$DESCRIPTION" '{
      version: "4", groupKey: ("{}:{alertname=\"" + $an + "\"}"),
      status: "firing", receiver: "hermes-sre",
      groupLabels: {alertname: $an},
      commonLabels: {alertname: $an, severity: "info"},
      commonAnnotations: {summary: $sum, description: $desc},
      alerts: [{status: "firing",
        labels: {alertname: $an, severity: "info"},
        annotations: {summary: $sum, description: $desc},
        startsAt: $ts}]}')
    code=$(curl -s -o /tmp/resp -w '%{http_code}' -m 30 \
      -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
      --data-binary "$payload" http://hermes-sre.hermes-sre.svc:8644/)
    cat /tmp/resp; echo
    case "$code" in 2*) exit 0;; *) echo "relay returned $code"; exit 1;; esac
