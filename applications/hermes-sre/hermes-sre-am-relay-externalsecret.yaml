---
# Inbound bearer token for the am-relay sidecar. One 1Password item
# (lab_rk8s/hermes-sre-am-relay) backs three copies of this Secret: here (the
# relay's own INBOUND_TOKEN + the heartbeat CronJob), openshift-monitoring
# (Alertmanager's credentials_file) and the rk8s monitoring namespace (the
# rk8s AlertmanagerConfig, igou-kubernetes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sre-am-relay
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: hermes-sre-am-relay
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hermes-sre-am-relay
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
