---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Purpose-scoped Hermes instance: SRE / read-only inspection. Every session
# carries the igou-devenv read-only bundle (ADR-0006) and nothing else. Shares
# the operator (ns hermes-operator) and the hermes-agent-root SCC, owned by
# applications/hermes-operator; no Slack socket (shared app stays on
# the interactive instance), reports go out via webhook.
#
# Sync waves: ExternalSecrets at -5 so the Secrets exist before the ghbroker
# Deployment (0) mounts ghbroker-config and the HermesInstance (10) envFrom's
# hermes-env — a fresh namespace has none of them, unlike hermes-k8s whose
# secrets predated ArgoCD (first sync deadlocked at wave 0 otherwise).
#
# NOTE: deliberately no top-level `namespace:` transformer. Every resource
# below already declares its own namespace, and the transformer would stamp
# one onto the SecurityContextConstraints too — kustomize has no scope
# information for that CRD-backed kind and treats it as namespaced.

resources:
  - hermes-sre-namespace.yaml
  - hermes-agent-serviceaccount.yaml
  - hermes-session-noperms-serviceaccount.yaml
  - hermes-session-exec-role.yaml
  - hermes-session-exec-rolebinding.yaml
  - system-openshift-scc-hermes-agent-root-rolebinding.yaml
  - system-openshift-scc-nonroot-v2-rolebinding.yaml
  - hermes-agent-networkpolicy.yaml
  - hermes-session-networkpolicy.yaml
  - sre-heartbeat-networkpolicy.yaml
  - igou-docs-sync-networkpolicy.yaml
  - quay-local-pull-externalsecret.yaml
  - hermes-env-externalsecret.yaml
  - hermes-sre-slack-webhook-externalsecret.yaml
  - hermes-slack-externalsecret.yaml
  - hermes-session-readonly-externalsecret.yaml
  - hermes-session-readonly-rk8s-externalsecret.yaml
  - hermes-session-readonly-routeros-externalsecret.yaml
  - hermes-session-readonly-truenas-externalsecret.yaml
  - hermes-sre-am-relay-externalsecret.yaml
  - hermes-sre-am-relay-configmap.yaml
  - hermes-sre-context-configmap.yaml
  - hermes-sre-skill-openshift-alert-triage-configmap.yaml
  - hermes-sre-skill-propose-fix-configmap.yaml
  - hermes-sre-skill-sre-sweeps-configmap.yaml
  - hermes-sre-skill-triage-domains-configmap.yaml
  - hermes-sre-skill-incident-reporting-configmap.yaml
  - hermes-workspace-pvc.yaml
  - auth-login-deployment.yaml
  - auth-login-networkpolicy.yaml
  - ghbroker-config-externalsecret.yaml
  - ghbroker-policy-configmap.yaml
  - ghbroker-deployment.yaml
  - ghbroker-service.yaml
  - ghbroker-networkpolicy.yaml
  - igou-docs-sync-cronjob.yaml
  - sre-heartbeat-cronjob.yaml
  - hermes-sre-am-relay-route.yaml
  - hermes-sre-hermesinstance.yaml
  - hermes-sre-dashboard-route.yaml
