---
# Agent-pod environment for hermes-sre. Deliberately NOT included: Slack tokens
# (the shared Slack app is connected only by the interactive instance), Forgejo
# token, GCP service accounts. Dashboard basic-auth and the API-server key are
# come from this instance's own item `hermes-sre` (lab_agents).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-sre
        property: api_server_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-sre
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
      remoteRef:
        key: hermes-sre
        property: password_hash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes-sre
        property: password_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Own Slack app ("Hermes SRE" / "Hermes Developer"), tokens on this
    # instance's item. Socket mode: one app per instance, no round-robin.
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: hermes-sre
        property: slack_app_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: hermes-sre
        property: slack_bot_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: opencode-go-api-key
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Slack incoming webhook (lab_openshift item, url in `password`) for reports:
# the SRE instance has no Slack socket, it posts findings with curl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sre-slack-webhook
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: hermes-sre-slack-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: slack-webhook-igoucloud-alerts-warning
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
