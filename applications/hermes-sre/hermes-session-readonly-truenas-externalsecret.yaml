apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-truenas
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-truenas
  target:
    name: hermes-session-readonly-truenas
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        truenas-ro.env: 'TRUENAS_URL=https://truenas.igou.systems

          TRUENAS_WS_URL=wss://truenas.igou.systems/api/current

          TRUENAS_API_KEY={{ .tn_key }}

          PERMISSIONS=readonly

          '
  data:
    - secretKey: tn_key
      remoteRef:
        key: agent-ro-api
        property: api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
