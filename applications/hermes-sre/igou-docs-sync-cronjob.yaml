---
# Keeps a read-only igou-docs mirror on the shared workspace. The fixed UID
# matches session ownership; its ServiceAccount receives only the nonroot-v2
# SCC in the adjacent RoleBinding.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: igou-docs-sync
  namespace: hermes-sre
spec:
  schedule: '*/30 * * * *'
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: igou-docs-sync
        spec:
          restartPolicy: Never
          serviceAccountName: hermes-session-noperms
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/igou-io/igou-devenv:latest@sha256:aa2f9196446749353e1719fa3eb489d3bfd49b2e23d564842e057cd829c0520d
              env:
                - name: HOME
                  value: /tmp
                - name: GHAPP_BROKER_URL
                  value: http://ghbroker.hermes-sre.svc.cluster.local:8085
                - name: HTTP_PROXY
                  value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                - name: HTTPS_PROXY
                  value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                - name: http_proxy
                  value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                - name: https_proxy
                  value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                - name: NO_PROXY
                  value: localhost,127.0.0.1,::1,.cluster.local,172.30.0.1,api.ocp.igou.systems,10.10.9.10
                - name: no_proxy
                  value: localhost,127.0.0.1,::1,.cluster.local,172.30.0.1,api.ocp.igou.systems,10.10.9.10
                - name: NODE_USE_ENV_PROXY
                  value: '1'
                - name: REPO
                  value: igou-io/igou-docs
                - name: DEST
                  value: /workspace/igou-docs
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - "# Explicit contents=read: the CLI's default set asks for write,\n\
                  # which this namespace's broker policy denies. Git-over-HTTPS on\n\
                  # GitHub takes Basic x-access-token:<token>, not Bearer; the\n#\
                  \ image's system-wide ghapp credential helper is disabled so a\n\
                  # failure cannot fall through to a second (write) mint.\ntoken=$(ghapp\
                  \ token --repo \"$REPO\" --permission contents=read)\n[ -n \"$token\"\
                  \ ]\nauth=\"Authorization: Basic $(printf 'x-access-token:%s' \"\
                  $token\" | base64 -w0)\"\ng() { git -c credential.helper= -c \"\
                  http.extraHeader=${auth}\" \"$@\"; }\nif [ -d \"$DEST/.git\" ];\
                  \ then\n  g -C \"$DEST\" fetch -q --depth 1 origin main\n  git -C\
                  \ \"$DEST\" reset -q --hard origin/main\nelse\n  rm -rf \"$DEST\"\
                  \n  g clone -q --depth 1 --branch main \"https://github.com/${REPO}.git\"\
                  \ \"$DEST\"\nfi\necho \"igou-docs at $(git -C \"$DEST\" rev-parse\
                  \ --short HEAD)\"\n"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: workspace
                  subPath: repos
                  mountPath: /workspace
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: hermes-workspace
            - name: tmp
              emptyDir: {}
