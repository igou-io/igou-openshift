apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-rk8s
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: hermes-session-readonly-rk8s
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        rk8s-cluster-reader.env: 'KUBECONFIG_TOKEN={{ .rk8s_token }}

          KUBECONFIG_HOST=https://cm3588-nas-01.igou.systems:6443

          PERMISSIONS=readonly

          '
  data:
    - secretKey: rk8s_token
      remoteRef:
        key: rk8s-cluster-read-only
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
