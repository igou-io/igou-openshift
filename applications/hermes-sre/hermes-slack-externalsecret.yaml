---
# Own Slack app for hermes-sre. Kept separate so the Hermes operator can inject
# each credential through spec.gateways.slack instead of a broad envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-slack
  namespace: hermes-sre
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-slack
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: hermes-sre
        property: slack_app_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: hermes-sre
        property: slack_bot_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
