---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-sre
---
# The agent's own ServiceAccount. Created here rather than by the operator
# because hermes-operator's RBACSpec has no extra-rules field, and the
# kubernetes terminal backend needs pod create/get/delete + pods/exec get.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: hermes-sre
# The agent image lives on the cluster's own Quay (not anonymously pullable).
# Declarative equivalent of `oc secrets link hermes-agent quay-local-pull
# --for=pull`; the secret itself comes from quay-pull-externalsecret.yaml.
imagePullSecrets:
  - name: quay-local-pull
