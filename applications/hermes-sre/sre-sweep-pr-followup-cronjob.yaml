---
# Twice-weekly follow-up on this instance's own open pull requests: CI state
# per PR, nudge the ones green and waiting on review, flag stale ones for
# closing. Posts a synthetic alert through the am-relay; the session follows
# the sre-sweeps skill (SRESweepPRFollowup).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sre-sweep-pr-followup
  namespace: hermes-sre
spec:
  schedule: '30 14 * * 1,4'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: sre-sweep-pr-followup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: post-alert
              image: ghcr.io/igou-io/igou-devenv:latest@sha256:e1cfc53edf3c7875bfe37d578280f38ac03ad0e362ef138197767e013fab771d
              command:
                - bash
                - /opt/sweep/post-alert.sh
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hermes-sre-am-relay
                      key: token
                - name: ALERTNAME
                  value: SRESweepPRFollowup
                - name: SUMMARY
                  value: Follow up on open hermes-sre pull requests (CI state, review nudges, stale proposals)
                - name: DESCRIPTION
                  value: >-
                    Scheduled read-only sweep. Follow the SRESweepPRFollowup
                    section of the sre-sweeps skill and post its digest.
                    This alert is synthetic: skip the incident-memory lookup.
              volumeMounts:
                - name: sweep
                  mountPath: /opt/sweep
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: sweep
              configMap:
                name: sre-sweep-post
