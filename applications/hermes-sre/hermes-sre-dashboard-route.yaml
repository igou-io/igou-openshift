apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-sre-dashboard
  namespace: hermes-sre
  labels:
    app: hermes-sre
spec:
  host: hermes-sre.apps.ocp.igou.systems
  to:
    kind: Service
    name: hermes-sre
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
