---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-sre-dashboard
  namespace: hermes-sre
  labels:
    app: hermes-sre
spec:
  # The production hostname, taken over from the VM app at cutover
  # (2026-08-14); the VM's Route is removed in the same commit.
  host: hermes-sre.apps.ocp.igou.systems
  to:
    kind: Service
    # Operator-created Service, named after the HermesInstance.
    name: hermes-sre
    weight: 100
  port:
    targetPort: dashboard
  # Edge termination, same as the VM route: the router terminates TLS and the
  # dashboard enforces its own scrypt BasicAuth gate (fail-closed: the
  # dashboard only starts when HERMES_DASHBOARD_BASIC_AUTH_USERNAME is set).
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# The operator's NetworkPolicy only admits ingress from the instance's own
# namespace; the router lives in openshift-ingress. Without this the Route 502s.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-sre-router-ingress
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes-sre
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ''
      ports:
        - protocol: TCP
          port: 9119
