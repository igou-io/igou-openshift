---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: igou-docs-sync-egress
  namespace: hermes-sre
spec:
  podSelector:
    matchLabels:
      app: igou-docs-sync
  policyTypes:
    - Egress
  egress:
    # OpenShift CoreDNS service and post-DNAT pod ports.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Mint the read-only clone token from the namespace-local broker.
    - to:
        - podSelector:
            matchLabels:
              app: ghbroker
      ports:
        - protocol: TCP
          port: 8085
    # GitHub HTTPS leaves through the shared proxy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
