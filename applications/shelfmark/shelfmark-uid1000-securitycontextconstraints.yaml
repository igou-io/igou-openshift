---
# The built-in anyuid SCC rejects an explicit seccompProfile: RuntimeDefault.
# Keep the required UID/GID and seccomp settings with a purpose-specific SCC
# instead of weakening the pod or the cluster-wide anyuid SCC. RunAsAny is
# needed because init-config explicitly runs as root to initialize the config
# PVC; the main container and create-incoming init are fixed to UID/GID 1000.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: shelfmark-uid1000
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    kubernetes.io/description: >-
      Shelfmark-only SCC for the non-root Shelfmark workload and its root-only
      config-volume initialization helper. No host access or privilege
      escalation; CHOWN is the only addable capability and is used only by
      init-config.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - CHOWN
defaultAddCapabilities: null
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
readOnlyRootFilesystem: false
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
users: []
groups: []
