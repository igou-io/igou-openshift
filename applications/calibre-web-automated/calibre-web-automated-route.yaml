---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: calibre-web-automated
  namespace: calibre-web-automated
spec:
  host: calibre-web-automated.apps.ocp.igou.systems
  to:
    kind: Service
    name: calibre-web-automated
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
