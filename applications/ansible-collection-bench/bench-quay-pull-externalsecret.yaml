---
# Pull secret for the runner image on local Quay (repo is private).
# Built from the igou-local-quay-modify robot (LOGIN item) because the
# ci-quay-shared robot (igou-io+tekton) currently 500s at Quay's token
# endpoint — see run bench-run-74zr6 postmortem.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-quay-pull
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-container-registries
  target:
    name: bench-quay-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths": {"quay.apps.ocp.igou.systems": {"auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: igou-local-quay-modify
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: igou-local-quay-modify
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
