---
# bench-pipeline: setup/report/teardown tasks — namespace lifecycle for
# ephemeral bench-vms-* namespaces and the results push.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-pipeline
  namespace: ansible-collection-bench
imagePullSecrets:
  - name: bench-quay-pull
---
# bench-agent: the agent and grade task pods. Cluster-scope: nothing.
# VM verbs arrive via a RoleBinding to ClusterRole bench-vm-provisioner
# created inside each ephemeral namespace by the pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-agent
  namespace: ansible-collection-bench
imagePullSecrets:
  - name: bench-quay-pull
