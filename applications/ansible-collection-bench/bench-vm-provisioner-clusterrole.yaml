---
# The kubevirt molecule provisioner's documented verb set
# (david_igou.molecule_provisioners roles/kubevirt README, minimal
# container_disk mode; cluster-scoped nodes lookup avoided by pinning
# mp.kubevirt.connection_ip). Bound per ephemeral namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bench-vm-provisioner
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
    verbs:
      - create
      - get
      - list
      - delete
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachineinstances
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - get
      - list
      - delete
