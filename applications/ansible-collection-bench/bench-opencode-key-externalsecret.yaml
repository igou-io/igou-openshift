---
# opencode API key for the agent step (key-mode auth).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-opencode-key
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: bench-opencode-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: opencode-go-api-key
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
