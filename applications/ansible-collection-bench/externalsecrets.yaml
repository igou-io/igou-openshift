---
# opencode API key for the agent step (key-mode auth).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-opencode-key
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: bench-opencode-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: opencode-go-api-key
        property: password
---
# Forgejo token for the results push (bench-bot, write:repository).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-forgejo-ci
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-forgejo
  target:
    name: bench-forgejo-ci
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ci-forgejo-ansible-collection-bench
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# Pull secret for the runner image on local Quay (repo is private).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-quay-pull
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-container-registries
  target:
    name: bench-quay-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: ci-quay-shared
        property: dockerconfigjson
