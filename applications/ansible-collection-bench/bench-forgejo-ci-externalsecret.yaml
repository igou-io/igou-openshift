---
# Forgejo token for the results push (bench-bot, write:repository).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bench-forgejo-ci
  namespace: ansible-collection-bench
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-forgejo
  target:
    name: bench-forgejo-ci
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ci-forgejo-ansible-collection-bench
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
