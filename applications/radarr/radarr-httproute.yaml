---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
spec:
  parentRefs:
    - name: trusted-lan
      namespace: openshift-ingress
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - radarr.lan.igou.systems
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radarr
          port: 7878
          group: ""
          kind: Service
          weight: 1
