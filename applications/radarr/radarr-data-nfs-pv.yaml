---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-data-nfs
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  claimRef:
    namespace: radarr
    name: radarr-data
  nfs:
    server: 10.10.9.213
    path: /mnt/cold/media/data
    readOnly: false
