---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-config-iscsi
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: ""
  claimRef:
    namespace: radarr
    name: radarr-config
  iscsi:
    targetPortal: 10.10.9.213:3260
    iqn: iqn.2005-10.org.freenas.ctl:radarr-config
    lun: 0
    fsType: ext4
    readOnly: false
