---
# The agent image needs the purpose-built SCC for its fixed runtime identity;
# this binding grants only that existing ClusterRole to the agent ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:hermes-agent-root
  namespace: hermes-developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:hermes-agent-root
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: hermes-developer
