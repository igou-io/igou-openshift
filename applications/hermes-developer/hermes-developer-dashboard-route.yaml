apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-developer-dashboard
  namespace: hermes-developer
  labels:
    app: hermes-developer
spec:
  host: hermes-developer.apps.ocp.igou.systems
  to:
    kind: Service
    name: hermes-developer
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
