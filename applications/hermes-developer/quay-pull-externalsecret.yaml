---
# PREREQUISITE: 1Password item `igou-local-quay-modify` (fields
# username/password) in vault `lab_container_registries` — the `igou-io+modify`
# robot account of the in-cluster Quay. See the project-local-quay-robot notes.
#
# Replaces the imperative `oc create secret docker-registry quay-local-pull`.
# The image under test is hosted on the cluster's own Quay, which (unlike the
# GHCR images used elsewhere) is not anonymously pullable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-local-pull
  namespace: hermes-developer
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-container-registries
  target:
    name: quay-local-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      # API-defaulted; declared so ArgoCD (SSA) stays Synced.
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"quay.apps.ocp.igou.systems":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: igou-local-quay-modify
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: igou-local-quay-modify
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
