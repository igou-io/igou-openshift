apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-session-readonly-routeros
  namespace: hermes-developer
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-routeros
  target:
    name: hermes-session-readonly-routeros
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        routeros-ro.env: 'ROUTEROS_USERNAME={{ .ros_user }}

          ROUTEROS_PASSWORD={{ .ros_pass }}

          ROUTEROS_API_PORT=8729

          ROUTEROS_HOSTS=rb5009.igou.systems,crs310.igou.systems,crs317.igou.systems,crs328.igou.systems

          PERMISSIONS=readonly

          '
  data:
    - secretKey: ros_user
      remoteRef:
        key: mktxp-exporter
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ros_pass
      remoteRef:
        key: mktxp-exporter
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
