---
# Runtime secrets for the agent container, sourced from the same 1Password
# items the VM's Ansible-managed .env used (group_vars/hermes.yml in
# igou-inventory). Consumed via `spec.envFrom` on the HermesInstance.
#
# PREREQUISITE: ClusterSecretStore `onepassword-lab-agents`
# (clusters/ocp/external-secrets-operator/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes-developer
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-developer
        property: api_server_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-developer
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
      remoteRef:
        key: hermes-developer
        property: password_hash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes-developer
        property: password_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Forgejo agent identity (user hermes-agent, sandbox-org owner): lets
    # hermes + dispatched coding agents push repos to the in-cluster Forgejo.
    # Token scopes: write:repository, write:organization, read:user.
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: forgejo-agent
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: FORGEJO_USERNAME
      remoteRef:
        key: forgejo-agent
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: opencode-go-api-key
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
