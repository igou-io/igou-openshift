---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drawio-egress
  namespace: drawio
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Keycloak's public issuer resolves to the cluster's HTTPS router.
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - port: 443
          protocol: TCP
