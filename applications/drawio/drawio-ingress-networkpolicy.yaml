---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: drawio-ingress
  namespace: drawio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
      ports:
        - port: 4180
          protocol: TCP
