apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drawio
resources:
  - drawio-namespace.yaml
  - default-deny-networkpolicy.yaml
  - drawio-ingress-networkpolicy.yaml
  - drawio-egress-networkpolicy.yaml
  - drawio-oidc-externalsecret.yaml
  - drawio-github-externalsecret.yaml
  - default-egressfirewall.yaml
configMapGenerator:
  - name: drawio-github-config
    files:
      - github-storage.sh
helmCharts:
  - name: app-template
    namespace: drawio
    version: 4.6.2
    releaseName: drawio
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        automountServiceAccountToken: false
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      controllers:
        drawio:
          type: deployment
          replicas: 1
          containers:
            app:
              image:
                repository: docker.io/jgraph/drawio
                tag: 32.6.1@sha256:3d0a5a5ffb4f76abcecd9d17ae1373e3eefd0db07b657c545637dc9c6a7412e1
              command:
                - /docker-entrypoint.sh
              args:
                - /bin/bash
                - /opt/drawio/github-storage.sh
              env:
                DRAWIO_SERVER_URL: https://drawio.apps.ocp.igou.systems/
                DRAWIO_BASE_URL: https://drawio.apps.ocp.igou.systems
                DRAWIO_VIEWER_URL: https://drawio.apps.ocp.igou.systems/js/viewer-static.min.js
                DRAWIO_LIGHTBOX_URL: https://drawio.apps.ocp.igou.systems
                DRAWIO_GITHUB_APP_URL: https://github.com/apps/david-igou-drawio
                JAVA_OPTS: -Xms128m -Xmx512m
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              probes:
                startup:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                  spec:
                    failureThreshold: 60
                    periodSeconds: 2
                    timeoutSeconds: 2
                readiness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                liveness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
            auth:
              image:
                repository: quay.io/oauth2-proxy/oauth2-proxy
                tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
              args:
                - --provider=keycloak-oidc
                - --client-id=drawio
                - --oidc-issuer-url=https://keycloak.apps.ocp.igou.systems/realms/igou
                - --redirect-url=https://drawio.apps.ocp.igou.systems/oauth2/callback
                - --allowed-role=drawio:access
                - --email-domain=*
                - --scope=openid profile email
                - --code-challenge-method=S256
                - --insecure-oidc-skip-nonce=false
                - --http-address=0.0.0.0:4180
                - --upstream=http://127.0.0.1:8080
                - --reverse-proxy=true
                - --skip-provider-button=true
                - --cookie-name=__Host-drawio_session
                - --cookie-secure=true
                - --cookie-samesite=lax
                - --cookie-expire=8h
                - --cookie-refresh=1m
                - --pass-access-token=false
                - --pass-authorization-header=false
                - --pass-basic-auth=false
                - --request-logging=false
              envFrom:
                - secretRef:
                    name: drawio-oidc
              ports:
                - name: auth
                  containerPort: 4180
                  protocol: TCP
              probes:
                startup:
                  enabled: true
                  type: HTTP
                  path: /ping
                  port: 4180
                  spec:
                    failureThreshold: 30
                    periodSeconds: 2
                readiness:
                  enabled: true
                  type: HTTP
                  path: /ready
                  port: 4180
                liveness:
                  enabled: true
                  type: HTTP
                  path: /ping
                  port: 4180
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
      persistence:
        github-config:
          type: configMap
          name: drawio-github-config
          advancedMounts:
            drawio:
              app:
                - path: /opt/drawio
                  readOnly: true
        github-credentials:
          type: secret
          name: drawio-github
          advancedMounts:
            drawio:
              app:
                - path: /usr/local/tomcat/webapps/draw/WEB-INF/github_client_id
                  subPath: github_client_id
                  readOnly: true
                - path: /usr/local/tomcat/webapps/draw/WEB-INF/github_client_secret
                  subPath: github_client_secret
                  readOnly: true
      service:
        app:
          controller: drawio
          ports:
            http:
              port: 80
              targetPort: 4180
      ingress:
        app:
          className: openshift-default
          annotations:
            route.openshift.io/termination: edge
            route.openshift.io/insecureEdgeTerminationPolicy: Redirect
          hosts:
            - host: drawio.apps.ocp.igou.systems
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: app
                    port: http
      serviceAccount:
        drawio:
          enabled: true
