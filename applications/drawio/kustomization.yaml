apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drawio
resources:
  - drawio-namespace.yaml
  - default-deny-networkpolicy.yaml
  - drawio-ingress-networkpolicy.yaml
configMapGenerator:
  - name: drawio-mcp-config
    files:
      - configure-mcp.mjs
helmCharts:
  - name: app-template
    namespace: drawio
    version: 4.6.2
    releaseName: drawio
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        automountServiceAccountToken: false
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      controllers:
        drawio:
          type: deployment
          replicas: 1
          containers:
            app:
              image:
                repository: docker.io/jgraph/drawio
                tag: 32.6.1@sha256:3d0a5a5ffb4f76abcecd9d17ae1373e3eefd0db07b657c545637dc9c6a7412e1
              env:
                DRAWIO_SERVER_URL: https://drawio.apps.ocp.igou.systems/
                DRAWIO_BASE_URL: https://drawio.apps.ocp.igou.systems
                DRAWIO_VIEWER_URL: https://drawio.apps.ocp.igou.systems/js/viewer-static.min.js
                DRAWIO_LIGHTBOX_URL: https://drawio.apps.ocp.igou.systems
                JAVA_OPTS: -Xms128m -Xmx512m
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              probes:
                startup:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                  spec:
                    failureThreshold: 60
                    periodSeconds: 2
                    timeoutSeconds: 2
                readiness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                liveness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
      service:
        app:
          controller: drawio
          ports:
            http:
              port: 80
              targetPort: 8080
      ingress:
        app:
          className: openshift-default
          annotations:
            route.openshift.io/termination: edge
            route.openshift.io/insecureEdgeTerminationPolicy: Redirect
          hosts:
            - host: drawio.apps.ocp.igou.systems
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: app
                    port: http
      serviceAccount:
        drawio:
          enabled: true
  - name: app-template
    namespace: drawio
    version: 4.6.2
    releaseName: drawio-mcp
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        automountServiceAccountToken: false
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      controllers:
        mcp:
          type: deployment
          replicas: 1
          serviceAccount:
            identifier: mcp
          initContainers:
            configure:
              image:
                repository: docker.io/jgraph/drawio-mcp
                tag: 1.4.1@sha256:c834380e09c49f277e3e55c44d8b99cbab52e7dabc5786acde5145d3e4a02dec
              command:
                - node
                - /config/configure-mcp.mjs
              env:
                DRAWIO_BASE_URL: https://drawio.apps.ocp.igou.systems
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          containers:
            app:
              image:
                repository: docker.io/jgraph/drawio-mcp
                tag: 1.4.1@sha256:c834380e09c49f277e3e55c44d8b99cbab52e7dabc5786acde5145d3e4a02dec
              env:
                ALLOWED_HOSTS: drawio-mcp.apps.ocp.igou.systems,localhost,127.0.0.1
                DRAWIO_ICON_SERVICE_URL: "off"
              ports:
                - name: http
                  containerPort: 3001
                  protocol: TCP
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: http
                      httpHeaders:
                        - name: Host
                          value: drawio-mcp.apps.ocp.igou.systems
                    failureThreshold: 30
                    periodSeconds: 2
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: http
                      httpHeaders:
                        - name: Host
                          value: drawio-mcp.apps.ocp.igou.systems
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /health
                      port: http
                      httpHeaders:
                        - name: Host
                          value: drawio-mcp.apps.ocp.igou.systems
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
      persistence:
        config:
          type: configMap
          name: drawio-mcp-config
          advancedMounts:
            mcp:
              configure:
                - path: /config
                  readOnly: true
        source:
          type: emptyDir
          advancedMounts:
            mcp:
              configure:
                - path: /configured-src
              app:
                - path: /app/mcp-app-server/src
                  readOnly: true
      service:
        app:
          controller: mcp
          ports:
            http:
              port: 80
              targetPort: 3001
      ingress:
        app:
          className: openshift-default
          annotations:
            route.openshift.io/termination: edge
            route.openshift.io/insecureEdgeTerminationPolicy: Redirect
            haproxy.router.openshift.io/timeout: 5m
          hosts:
            - host: drawio-mcp.apps.ocp.igou.systems
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: app
                    port: http
      serviceAccount:
        mcp:
          enabled: true
