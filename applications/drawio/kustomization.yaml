apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drawio
resources:
  - drawio-namespace.yaml
  - default-deny-networkpolicy.yaml
  - drawio-ingress-networkpolicy.yaml
helmCharts:
  - name: app-template
    namespace: drawio
    version: 4.6.2
    releaseName: drawio
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      defaultPodOptions:
        automountServiceAccountToken: false
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      controllers:
        drawio:
          type: deployment
          replicas: 1
          containers:
            app:
              image:
                repository: docker.io/jgraph/drawio
                tag: 32.6.1@sha256:3d0a5a5ffb4f76abcecd9d17ae1373e3eefd0db07b657c545637dc9c6a7412e1
              env:
                DRAWIO_SERVER_URL: https://drawio.apps.ocp.igou.systems/
                DRAWIO_BASE_URL: https://drawio.apps.ocp.igou.systems
                DRAWIO_VIEWER_URL: https://drawio.apps.ocp.igou.systems/js/viewer-static.min.js
                DRAWIO_LIGHTBOX_URL: https://drawio.apps.ocp.igou.systems
                JAVA_OPTS: -Xms128m -Xmx512m
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              probes:
                startup:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                  spec:
                    failureThreshold: 60
                    periodSeconds: 2
                    timeoutSeconds: 2
                readiness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
                liveness:
                  enabled: true
                  type: HTTP
                  path: /
                  port: 8080
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
      service:
        app:
          controller: drawio
          ports:
            http:
              port: 80
              targetPort: 8080
      ingress:
        app:
          className: openshift-default
          annotations:
            route.openshift.io/termination: edge
            route.openshift.io/insecureEdgeTerminationPolicy: Redirect
          hosts:
            - host: drawio.apps.ocp.igou.systems
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: app
                    port: http
      serviceAccount:
        drawio:
          enabled: true
