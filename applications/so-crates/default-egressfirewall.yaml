---
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  # OVN-Kubernetes requires this object to be named "default".
  name: default
  namespace: so-crates
spec:
  egress:
    # The Kubernetes API Service DNATs to the control-plane host at :6443.
    - type: Allow
      to:
        cidrSelector: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443

    # oauth-openshift and OpenShift DNS Services DNAT to Pod IPs. These
    # exceptions must precede the RFC1918 deny rules below.
    - type: Allow
      to:
        cidrSelector: 10.128.0.0/14
      ports:
        - protocol: TCP
          port: 6443
    # The OAuth proxy's ClusterIP upstream is DNATed to the analysis Pod.
    # NetworkPolicy still restricts this port to the proxy -> analysis path.
    - type: Allow
      to:
        cidrSelector: 10.128.0.0/14
      ports:
        - protocol: TCP
          port: 8000
    - type: Allow
      to:
        cidrSelector: 10.128.0.0/14
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353

    # Never allow the analysis workload to reach private, cluster, homelab,
    # carrier-grade NAT, or link-local destinations. OVN evaluates rules in
    # order, so the required cluster exceptions above remain narrow.
    - type: Deny
      to:
        cidrSelector: 10.0.0.0/8
    - type: Deny
      to:
        cidrSelector: 172.16.0.0/12
    - type: Deny
      to:
        cidrSelector: 192.168.0.0/16
    - type: Deny
      to:
        cidrSelector: 100.64.0.0/10
    - type: Deny
      to:
        cidrSelector: 169.254.0.0/16

    # SO-CRATES rule refresh and Load from URL are limited to public HTTP(S).
    - type: Allow
      to:
        cidrSelector: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

    # Deny every other destination and port.
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
