---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: so-crates
  namespace: so-crates
spec:
  host: so-crates.apps.ocp.igou.systems
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: so-crates
    weight: 100
  wildcardPolicy: None
