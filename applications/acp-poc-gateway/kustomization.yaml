apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acp-poc
resources:
  - acp-poc-namespace.yaml
  - acp-poc-openshell-credential-encryption-key-externalsecret.yaml
  - opencode-go-externalsecret.yaml
  - acp-poc-openshell-sandbox-privileged-clusterrolebinding.yaml
patches:
  # Let OpenShift SCC admission allocate a valid UID and fsGroup.
  - target:
      kind: StatefulSet
      name: openshell-gateway
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openshell-gateway
      spec:
        template:
          spec:
            securityContext:
              fsGroup: null
            containers:
              - name: openshell-gateway
                securityContext:
                  runAsUser: null
  - target:
      kind: StatefulSet
      name: openshell-gateway
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openshell-gateway
      spec:
        volumeClaimTemplates:
          - metadata:
              name: openshell-data
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: freenas-nvmeof-ssd-csi
              resources:
                requests:
                  storage: 10Gi
helmCharts:
  - name: helm-chart
    namespace: acp-poc
    version: 0.0.116
    releaseName: openshell-gateway
    repo: oci://ghcr.io/nvidia/openshell
    valuesInline:
      image:
        tag: 0.0.116@sha256:05cf77bbb022a739aed6f22daa0e7e164415f4ab273b5f84319e46d91eb8f645
      supervisor:
        image:
          tag: 0.0.116@sha256:c8c42aef16c200063e32cbf72e553e4ead027085427b555efafd95063ecead42
      agentSandbox:
        preflight:
          enabled: false
      certManager:
        enabled: true
        serverDnsNames:
          - openshell-gateway
          - openshell-gateway.acp-poc.svc
          - openshell-gateway.acp-poc.svc.cluster.local
          - localhost
      openshiftRoute:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      server:
        telemetryEnabled: false
        sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base:latest@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
        workspaceDefaultStorageSize: 10Gi
        workspaceStorageClass: freenas-nvmeof-ssd-csi
        defaultRuntimeClassName: ''
        appArmorProfile: ''
        disableTls: false
        auth:
          allowUnauthenticatedUsers: false
        oidc:
          issuer: https://keycloak.apps.ocp.igou.systems/realms/igou
          audience: agent-control-plane
          rolesClaim: realm_access.roles
          adminRole: openshell-admin
          userRole: openshell-user
        credentialStorage:
          existingSecret: openshell-credential-encryption-key
