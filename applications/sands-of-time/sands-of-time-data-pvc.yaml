---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sands-of-time-data
  namespace: sands-of-time
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # The database is ~1.7Gi and an in-place backup doubles that; 10Gi
      # leaves room for one backup plus years of growth.
      storage: 10Gi
  storageClassName: freenas-nvmeof-ssd-csi
