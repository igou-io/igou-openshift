apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ollama
resources:
  - ollama-namespace.yaml
helmCharts:
  - name: ollama
    namespace: ollama
    version: 1.83.0
    releaseName: ollama
    repo: https://helm.otwld.com/
    valuesInline:
      replicaCount: 1
      image:
        repository: ollama/ollama
        pullPolicy: IfNotPresent
        tag: 0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
      ollama:
        gpu:
          enabled: true
          number: 2
        models:
          pull:
            - gpt-oss:20b
        mountPath: /.ollama
      serviceAccount:
        create: true
        automount: true
        annotations: {}
        name: ''
      podSecurityContext: {}
      securityContext: {}
      resources:
        requests: {}
        limits: {}
      extraEnv:
        - name: OLLAMA_SCHED_SPREAD
          value: '1'
        - name: OLLAMA_NUM_PARALLEL
          value: '2'
        - name: OLLAMA_DEBUG
          value: 'true'
      persistentVolume:
        enabled: true
        size: 100Gi
      nodeSelector:
        node-role.kubernetes.io/burst: ''
      tolerations:
        - key: workload
          operator: Equal
          value: burst
          effect: NoSchedule
      tests:
        enabled: false
