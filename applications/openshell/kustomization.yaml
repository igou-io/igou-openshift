apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openshell
resources:
  - openshell-credential-encryption-key-externalsecret.yaml
patches:
  # Kustomize drops null Helm overrides while merging values. Clear the fixed
  # identities after rendering so restricted SCC admission can assign them.
  - target:
      kind: StatefulSet
      name: openshell
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openshell
      spec:
        template:
          spec:
            securityContext:
              fsGroup: null
            containers:
              - name: openshell-gateway
                securityContext:
                  runAsUser: null
  # OpenShell 0.1.1 does not expose values for its gateway PVC. Pin it to
  # this cluster's storage class and evaluation capacity after Helm renders.
  - target:
      kind: StatefulSet
      name: openshell
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openshell
      spec:
        volumeClaimTemplates:
          - metadata:
              name: openshell-data
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: freenas-nvmeof-ssd-csi
              resources:
                requests:
                  storage: 10Gi
helmCharts:
  - name: helm-chart
    namespace: openshell
    version: 0.1.1
    releaseName: openshell
    repo: oci://ghcr.io/nvidia/openshell
    valuesInline:
      gateway:
        image:
          tag: 0.1.1
          digest: sha256:09ce3db99430e973743f94adf032d79089f41f2c3fe571e3670d8ba7c92c6313
      supervisor:
        image:
          tag: 0.1.1
          digest: sha256:297b4b681e13a4dccda4b4796e155e2231134aae1f9e3c94aba5bb981c0e1240
      sandboxRuntime:
        image:
          tag: 0.1.1
          digest: sha256:48bb1deb5c0cd9f7c5c123a9559e469ce046e700e1099f5f4362178108306c0b
      sandbox:
        image:
          repository: nvcr.io/nvidia/base/ubuntu
          tag: '24.04'
          digest: sha256:c280ee89f8bfcbdaba6179ad4347f60c509e841cbe63eb93002f01bf70e0819c
      agentSandbox:
        # Kustomize renders offline. The live v1beta1 API was verified on ocp.
        preflight:
          enabled: false
      certManager:
        enabled: true
        serverIssuerRef:
          name: cluster-acme
          kind: ClusterIssuer
        serverDnsNames:
          - openshell.apps.ocp.igou.systems
      openshiftRoute:
        enabled: true
        host: openshell.apps.ocp.igou.systems
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      server:
        telemetryEnabled: false
        workspaceDefaultStorageSize: 10Gi
        workspaceStorageClass: freenas-nvmeof-ssd-csi
        # Use capability-free workloads on the standard CRI-O runtime.
        defaultRuntimeClassName: ''
        disableTls: false
        auth:
          allowUnauthenticatedUsers: false
        oidc:
          issuer: https://keycloak.apps.ocp.igou.systems/realms/igou
          audience: openshell-cli
          rolesClaim: realm_access.roles
          adminRole: openshell-admin
          userRole: openshell-user
        tls:
          # Avoid reusing the legacy certgen Secret when cert-manager is enabled.
          clientTlsSecretName: openshell-client-cert-manager-tls
        credentialStorage:
          existingSecret: openshell-credential-encryption-key
