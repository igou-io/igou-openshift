version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /opt
    - /etc
    - /proc
    - /dev/urandom
    - /home/igou
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /dev/shm
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
