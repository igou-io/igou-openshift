id: opencode-go-devenv
display_name: OpenCode Go for devenv agents
description: GLM inference through the sandbox-local protocol adapter
category: inference
credentials:
  - name: api_key
    env_vars:
      - OPENAI_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: opencode.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/python3.12
  - /opt/agent-proxy/bin/python
  - /opt/agent-proxy/bin/python3
  - /opt/agent-proxy/bin/python3.12
inference_capable: true
discovery:
  credentials:
    - api_key
