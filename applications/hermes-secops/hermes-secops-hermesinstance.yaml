---
apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: hermes-secops
  namespace: hermes-secops
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  image:
    repository: ghcr.io/igou-io/hermes-agent-k8s
    tag: c085af4a9e89164b35e9c708329b5020e028e222@sha256:824fca9377624e2dd182301d13ad6ca835f20fc09ec3e16d4ceb104a56c4d5fe
    digest: sha256:824fca9377624e2dd182301d13ad6ca835f20fc09ec3e16d4ceb104a56c4d5fe
    pullPolicy: IfNotPresent
  security:
    rbac:
      createServiceAccount: false
      serviceAccountName: hermes-agent
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
    networkPolicy:
      enabled: false
  env:
    - name: TZ
      value: America/New_York
    - name: GATEWAY_HEALTH_URL
      value: http://127.0.0.1:8642
    - name: SEARXNG_URL
      value: http://searxng.searxng.svc.cluster.local:8080
    - name: HERMES_DASHBOARD_FILES_ROOT
      value: /opt/data/dashboard-files
    # File-tool policy is evaluated by the gateway; I/O runs in the terminal pod.
    - name: HERMES_WRITE_SAFE_ROOT
      value: /workspace/reports:/output
    - name: SLACK_ALLOWED_USERS
      valueFrom:
        secretKeyRef:
          name: hermes-slack-routing
          key: SLACK_ALLOWED_USERS
    - name: SLACK_HOME_CHANNEL
      valueFrom:
        secretKeyRef:
          name: hermes-slack-routing
          key: SLACK_HOME_CHANNEL
    - name: SLACK_ALLOWED_CHANNELS
      valueFrom:
        secretKeyRef:
          name: hermes-slack-routing
          key: SLACK_ALLOWED_CHANNELS
    - name: GHAPP_BROKER_URL
      value: http://ghbroker.hermes-secops-auth.svc.cluster.local:8085
    - name: HTTP_PROXY
      value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
    - name: HTTPS_PROXY
      value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
    - name: http_proxy
      value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
    - name: https_proxy
      value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
    - name: NO_PROXY
      value: localhost,127.0.0.1,::1,.cluster.local,.svc,172.30.0.1,api.ocp.igou.systems,10.10.9.10
    - name: no_proxy
      value: localhost,127.0.0.1,::1,.cluster.local,.svc,172.30.0.1,api.ocp.igou.systems,10.10.9.10
    - name: NODE_USE_ENV_PROXY
      value: '1'
  envFrom:
    - secretRef:
        name: hermes-env
  gateways:
    slack:
      enabled: true
      botTokenSecretRef:
        name: hermes-slack
        key: SLACK_BOT_TOKEN
      appTokenSecretRef:
        name: hermes-slack
        key: SLACK_APP_TOKEN
  # Prepare the empty workspace claim before any subPath mounts are used.
  initContainers:
    - name: workspace-init
      image: ghcr.io/igou-io/hermes-agent-k8s@sha256:80f41ad2ab24a31f217198a6dae2980fbd988e4c609c4fd238219e86cb4f76a2
      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p /workspace-volume/repos/reports /workspace-volume/output
          chown 1000:1000 /workspace-volume /workspace-volume/repos /workspace-volume/repos/reports /workspace-volume/output
          chmod 0770 /workspace-volume /workspace-volume/repos /workspace-volume/repos/reports /workspace-volume/output
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
      volumeMounts:
        - name: hermes-workspace
          mountPath: /workspace-volume
    # Native cron API owns its store and preserves execution history and pauses.
    - name: secops-schedules
      image: ghcr.io/igou-io/hermes-agent-k8s@sha256:80f41ad2ab24a31f217198a6dae2980fbd988e4c609c4fd238219e86cb4f76a2
      command:
        - /opt/hermes/.venv/bin/python
        - /opt/data/scripts/secops/install.py
      env:
        - name: HERMES_HOME
          value: /opt/data
        - name: PYTHONPATH
          value: /opt/hermes
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: hermes-workspace
          subPath: repos
          mountPath: /workspace
        - name: config
          mountPath: /opt/data/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: secops-schedules
          mountPath: /opt/data/scripts/secops
          readOnly: true

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  observability:
    metrics:
      enabled: false
    serviceMonitor:
      enabled: false
    prometheusRule:
      enabled: false
  networking:
    service:
      type: ClusterIP
      ports:
        - name: gateway
          port: 8443
          protocol: TCP
          targetPort: 8443
        - name: dashboard
          port: 9119
          protocol: TCP
          targetPort: 9119
  sidecars:
    - name: dashboard
      image: ghcr.io/igou-io/hermes-agent-k8s@sha256:80f41ad2ab24a31f217198a6dae2980fbd988e4c609c4fd238219e86cb4f76a2
      imagePullPolicy: IfNotPresent
      args:
        - dashboard
        - --host
        - 0.0.0.0
        - --port
        - '9119'
        - --skip-build
        - --no-open
      env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_UID
          value: '1000'
        - name: HERMES_GID
          value: '1000'
        - name: TZ
          value: America/New_York
        - name: HERMES_DASHBOARD_FILES_ROOT
          value: /opt/data/dashboard-files
      envFrom:
        - secretRef:
            name: hermes-env
      ports:
        - name: dashboard
          containerPort: 9119
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
      volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: hermes-workspace
          subPath: output
          mountPath: /opt/data/dashboard-files
          readOnly: true
        - name: config
          mountPath: /opt/data/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
  storage:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: freenas-nvmeof-ssd-csi
  extraVolumes:
    - name: secops-context
      configMap:
        name: hermes-secops-context
    - name: hermes-workspace
      persistentVolumeClaim:
        claimName: hermes-workspace
    - name: secops-skill
      configMap:
        name: hermes-secops-skill-assess
    - name: secops-scheduled-skills
      configMap:
        name: hermes-secops-scheduled-skills
    - name: secops-schedules
      configMap:
        name: hermes-secops-schedules
  extraVolumeMounts:
    - name: hermes-workspace
      subPath: repos
      mountPath: /workspace
    - name: hermes-workspace
      subPath: output
      mountPath: /opt/data/cache/documents
    - name: secops-context
      subPath: SOUL.md
      mountPath: /opt/data/SOUL.md
      readOnly: true
    - name: secops-context
      subPath: AGENTS.md
      mountPath: /workspace/AGENTS.md
      readOnly: true
    - name: secops-skill
      mountPath: /opt/data/agent-skills/secops/assess
      readOnly: true
    - name: secops-schedules
      mountPath: /opt/data/scripts/secops
      readOnly: true
    - name: secops-scheduled-skills
      subPath: security-brief.md
      mountPath: /opt/data/agent-skills/secops/security-brief/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: kev-watch.md
      mountPath: /opt/data/agent-skills/secops/kev-watch/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: scan-coverage.md
      mountPath: /opt/data/agent-skills/secops/scan-coverage/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: hardening-review.md
      mountPath: /opt/data/agent-skills/secops/hardening-review/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: runtime-triage.md
      mountPath: /opt/data/agent-skills/secops/runtime-triage/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: security-trends.md
      mountPath: /opt/data/agent-skills/secops/security-trends/SKILL.md
      readOnly: true
    - name: secops-scheduled-skills
      subPath: access-health.md
      mountPath: /opt/data/agent-skills/secops/access-health/SKILL.md
      readOnly: true
  config:
    raw:
      _config_version: 33
      auth:
        adopt_external_logins: false
      agent:
        environment_probe: false
        max_turns: 80
        reasoning_effort: high
      approvals:
        mode: manual
        timeout: 60
      auxiliary:
        compression: &sol_aux
          provider: openai-codex
          model: gpt-6.1-sol
          reasoning_effort: high
        vision: *sol_aux
        title_generation: *sol_aux
        approval: *sol_aux
        skills_hub: *sol_aux
      max_concurrent_sessions: '2'
      cron:
        max_parallel_jobs: 1
        catch_up_missed: false
        script_timeout_seconds: 900
      model:
        default: gpt-6.1-sol
        provider: openai-codex
      platforms:
        api_server:
          enabled: true
          extra:
            host: 127.0.0.1
            port: 8642
      platform_toolsets:
        cli:
          - file
          - skills
          - terminal
          - web
        slack:
          - file
          - skills
          - terminal
          - web
        webhook:
          - file
          - skills
          - terminal
          - web
        cron:
          - file
          - skills
          - terminal
          - web
      slack:
        require_mention: true
      terminal:
        backend: kubernetes
        cwd: /workspace
        timeout: 300
        lifetime_seconds: 1800
        kubernetes:
          namespace: hermes-secops
          ready_timeout_seconds: 300
          spec:
            priorityClassName: llmkube-low
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/tenant
                          operator: Exists
            serviceAccountName: hermes-session-noperms
            automountServiceAccountToken: false
            enableServiceLinks: false
            restartPolicy: Never
            terminationGracePeriodSeconds: 1
            activeDeadlineSeconds: 14400
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: workspace
                image: ghcr.io/igou-io/igou-devenv:latest@sha256:1a60a6305262afd85e52cc1d77083d92af949f56b5f1feb5b0ce3d71805cf57e
                command:
                  - sleep
                  - infinity
                workingDir: /workspace
                env:
                  - name: HERMES_WRITE_SAFE_ROOT
                    value: /workspace/reports:/output
                  - name: GHAPP_BROKER_URL
                    value: http://ghbroker.hermes-secops-auth.svc.cluster.local:8085
                  - name: HTTP_PROXY
                    value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                  - name: HTTPS_PROXY
                    value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                  - name: http_proxy
                    value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                  - name: https_proxy
                    value: http://squid-proxy.squid-proxy.svc.cluster.local:3128
                  - name: NO_PROXY
                    value: localhost,127.0.0.1,::1,.cluster.local,.svc,172.30.0.1,api.ocp.igou.systems,10.10.9.10
                  - name: no_proxy
                    value: localhost,127.0.0.1,::1,.cluster.local,.svc,172.30.0.1,api.ocp.igou.systems,10.10.9.10
                  - name: NODE_USE_ENV_PROXY
                    value: '1'
                  - name: HOME
                    value: /home/igou
                  - name: BASH_ENV
                    value: /home/igou/.bashrc
                  - name: AGENT_PROFILE
                    value: none
                  - name: ROX_ENDPOINT
                    value: central.stackrox.svc:443
                  - name: ROX_CA_CERT_FILE
                    value: /etc/secops/rhacs/ca.pem
                  - name: ROX_API_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hermes-secops-rhacs
                        key: ROX_API_TOKEN
                volumeMounts:
                  - name: secops-collector
                    mountPath: /usr/local/bin/secops-collect
                    subPath: secops-collect
                    readOnly: true
                  - name: workspace
                    subPath: repos
                    mountPath: /workspace
                  - name: workspace
                    subPath: output
                    mountPath: /output
                  - name: secops-context
                    subPath: AGENTS.md
                    mountPath: /workspace/AGENTS.md
                    readOnly: true
                  - name: rhacs-ca
                    mountPath: /etc/secops/rhacs
                    readOnly: true
                  - name: hermes-sync
                    mountPath: /workspace/.hermes
                  - name: tmp
                    mountPath: /tmp
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
                  limits:
                    cpu: '2'
                    memory: 2Gi
                    ephemeral-storage: 5Gi
                securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            volumes:
              - name: secops-collector
                configMap:
                  name: hermes-secops-collector
                  defaultMode: 0555
              - name: workspace
                persistentVolumeClaim:
                  claimName: hermes-workspace
              - name: secops-context
                configMap:
                  name: hermes-secops-context
              - name: rhacs-ca
                secret:
                  secretName: hermes-secops-rhacs
                  items:
                    - key: ca.pem
                      path: ca.pem
              - name: hermes-sync
                emptyDir: {}
              - name: tmp
                emptyDir: {}
      skills:
        external_dirs:
          - /opt/data/agent-skills/secops
        guard_agent_created: true
        write_approval: true
      tool_loop_guardrails:
        hard_stop_enabled: true
      web:
        search_backend: searxng
        keyless_fallback: false
        use_gateway: false
      updates:
        pre_update_backup: false
