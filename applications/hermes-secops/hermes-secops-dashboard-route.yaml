---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-secops-dashboard
  namespace: hermes-secops
  labels:
    app: hermes-secops
spec:
  host: hermes-secops.apps.ocp.igou.systems
  to:
    kind: Service
    name: hermes-secops
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
