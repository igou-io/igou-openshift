---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-secops-skill-assess
  namespace: hermes-secops
data:
  SKILL.md: |
    ---
    name: assess
    description: Read-only SBOM and ACS vulnerability and policy assessment for the allowed igou-* repositories.
    ---

    1. Read /workspace/AGENTS.md. Scope the requested repositories and time window.
       If none are specified, use the broker's explicit allowlist; do not expand
       to other organizations or the user's unrelated personal repositories.
    2. A scheduled preflight supplies checksummed fresh evidence and its output
       directory. Reuse it; never launch a duplicate collection for that run.
       Otherwise run `flock -n /output/.secops-collect.lock secops-collect --budget-seconds 540`
       in a fresh terminal with timeout=600 and background=false. Never request
       a timeout above 600: that silently promotes the command to background.
       A busy lock means another collection is active; report that status rather
       than starting parallel work. Verify actual completion and output artifacts;
       a background-start acknowledgement is not a completed assessment.
       The read-only collector is mounted from the GitOps-owned ConfigMap;
       do not rewrite it, install a replacement, or reconstruct collection code.
       It uses only the explicit broker allowlist, repository-scoped read tokens,
       asynchronous SBOM exports, existing ACS GET endpoints with verified TLS,
       and public advisory queries. No alternate identity is permitted.
       Exit 2 means PARTIAL: read the emitted evidence and every gap, then
       continue the assessment without presenting inaccessible sources as clean.
       A deadline failure retains available sanitized evidence. Do not retry
       indefinitely or launch scans, rescans, or ACS report-generation writes.
    3. Read the emitted summary.json and report.md under /output/<run-id>.
       Query evidence.json selectively with the terminal JSON parser for the
       relevant digests/advisories; do not dump the full evidence into context.
       Check acs_integrity, per-source completeness, distinct counts, duplicates,
       before/after server totals, missing details, scan timestamps, export times,
       reader-token expiry, and the observed cluster coverage. Counts may change
       between runs; compare each run with its own server totals. The collection
       is not a transactional snapshot. Missing GitHub alert grants, repository
       access, SBOMs or scans remain coverage gaps. An exported SBOM's creation
       time is not the freshness of every submitted dependency snapshot.
    4. Use the collector's image/deployment digest joins and sanitized security
       context, policy and alert metadata for hardening/exposure triage.
       Configured UID 0 is not observed process identity. Required operator/CSI
       privileges are not automatically excess access. ROUTE, EXTERNAL and NODE
       are configured exposure, not proof of public Internet reachability.
    5. Correlate PURLs and advisory aliases; count a CVE once per affected image.
       Keep source dependencies, embedded tools, base-image RPMs, and deployed
       artifacts distinct. A current repository-wide SBOM is not proof of the
       contents of an older running image digest. Check vendor backports before
       assigning an RPM finding to an upstream semantic-version range.
    6. Enrich CVEs from OSV, CISA KEV, FIRST EPSS, and primary vendor advisories.
       Use only package coordinates/versions and public advisory IDs in public
       API requests. The collector handles positional OSV results and pagination;
       its supplemental matches are not confirmed GitHub alerts. Verify the top
       findings against primary vendor advisories before recommending fixes.
       Record feed timestamps. KEV absence and low EPSS do not establish safety.
    7. Write assessment.md beside evidence.json under /output/<run-id>, containing
       scope, collection times, severity, evidence, image digests, fix availability,
       confidence, and blind spots. Separate confirmed alerts from supplemental
       matches. Classify proposals as dependency update, tool/vendor update,
       image rebuild, rollout of an existing rebuilt image, upstream blocked,
       or investigation. Do not invent replacement tags/digests or claim a
       package match proves exploitability.
       The shared output appears in the authenticated dashboard Files browser
       under <run-id>/ and in the gateway at /opt/data/cache/documents/<run-id>/.
       Return those artifact paths. Do not connect to the dashboard from the
       isolated terminal or widen network access to deliver artifacts.
       Keep credentials, raw deployment environment values, signed URLs and
       private source out of artifacts. Do not create issues, PRs, suppressions,
       live changes, additional notifications, scheduled jobs, or self-modified skills.
       Only operator-provisioned native schedules may deliver their final briefs
       through the gateway to the configured SecOps home channel. Do not send
       Slack API messages from terminals or grant them Slack credentials.
