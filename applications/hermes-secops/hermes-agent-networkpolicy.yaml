---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent
  namespace: hermes-secops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes-secops
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ''
      ports:
        - protocol: TCP
          port: 9119
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-secops-auth
          podSelector:
            matchLabels:
              app: ghbroker
      ports:
        - protocol: TCP
          port: 8085
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443
