apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-control-plane-control-plane
---
# Upstream's standard namespace provisioner creates one namespace per project.
# This cluster-wide permission is the POC's primary remaining trust boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-control-plane-control-plane
rules:
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - configmaps
      - secrets
      - serviceaccounts
      - services
      - pods
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
  # Required to create ACP's project-manager Role without RBAC escalation.
  - apiGroups:
      - ''
    resources:
      - configmaps
      - pods
      - secrets
      - serviceaccounts
      - services
    verbs:
      - deletecollection
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
      - routes/custom-host
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-control-plane-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-control-plane-control-plane
subjects:
  - kind: ServiceAccount
    name: agent-control-plane-control-plane
    namespace: agent-control-plane
