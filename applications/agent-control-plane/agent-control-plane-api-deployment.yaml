apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-plane-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-control-plane-api
  template:
    metadata:
      labels:
        app: agent-control-plane-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: quay.io/ambient_code/acp_api_server@sha256:b808860db3b86b1f49fef97cffc1594335f323116b17755ed6fe0efbf2d299b3
          command:
            - /usr/local/bin/ambient-api-server
            - migrate
            - --db-host-file=/secrets/db/db.host
            - --db-port-file=/secrets/db/db.port
            - --db-user-file=/secrets/db/db.user
            - --db-password-file=/secrets/db/db.password
            - --db-name-file=/secrets/db/db.name
          volumeMounts:
            - name: database
              mountPath: /secrets/db
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: quay.io/ambient_code/acp_api_server@sha256:b808860db3b86b1f49fef97cffc1594335f323116b17755ed6fe0efbf2d299b3
          command:
            - /usr/local/bin/ambient-api-server
            - serve
            - --db-host-file=/secrets/db/db.host
            - --db-port-file=/secrets/db/db.port
            - --db-user-file=/secrets/db/db.user
            - --db-password-file=/secrets/db/db.password
            - --db-name-file=/secrets/db/db.name
            - --db-sslmode=disable
            - --enable-jwt=true
            - --enable-authz=true
            - --jwk-cert-url=https://keycloak.apps.ocp.igou.systems/realms/igou/protocol/openid-connect/certs
            - --enable-https=false
            - --api-server-bindaddress=:8000
            - --metrics-server-bindaddress=:4433
            - --health-check-server-bindaddress=:4434
            - --enable-metrics-https=false
            - --cors-allowed-origins=https://agent-control-plane.apps.ocp.igou.systems
            - --cors-allowed-headers=X-Ambient-Project
            - --enable-grpc=true
            - --grpc-server-bindaddress=:9000
            - --grpc-jwk-cert-url=https://keycloak.apps.ocp.igou.systems/realms/igou/protocol/openid-connect/certs
          env:
            - name: AMBIENT_ENV
              value: production
            - name: OIDC_ISSUER_URL
              value: https://keycloak.apps.ocp.igou.systems/realms/igou
            - name: GRPC_SERVICE_ACCOUNT
              value: agent-control-plane
            - name: CREDENTIAL_ENCRYPTION_ALLOW_PLAINTEXT
              value: 'false'
            - name: CREDENTIAL_ENCRYPTION_KEYRING
              valueFrom:
                secretKeyRef:
                  name: agent-control-plane-credentials
                  key: CREDENTIAL_ENCRYPTION_KEYRING
            - name: CREDENTIAL_ENCRYPTION_KEY_VERSION
              value: '1'
          ports:
            - name: api
              containerPort: 8000
            - name: grpc
              containerPort: 9000
            - name: health
              containerPort: 4434
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: health
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /api/ambient
              port: api
            initialDelaySeconds: 30
          volumeMounts:
            - name: database
              mountPath: /secrets/db
              readOnly: true
            - name: auth
              mountPath: /configs/authentication
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: database
          projected:
            sources:
              - configMap:
                  name: agent-control-plane-db-config
              - secret:
                  name: agent-control-plane-db-app
                  items:
                    - key: password
                      path: db.password
        - name: auth
          configMap:
            name: agent-control-plane-auth
