apiVersion: v1
kind: Service
metadata:
  name: agent-control-plane-api
spec:
  selector:
    app: agent-control-plane-api
  ports:
    - name: api
      port: 8000
      targetPort: api
    - name: grpc
      port: 9000
      targetPort: grpc
    - name: health
      port: 4434
      targetPort: health
