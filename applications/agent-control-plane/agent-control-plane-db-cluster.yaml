apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agent-control-plane-db
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  instances: 1
  enablePDB: false
  storage:
    size: 10Gi
    storageClass: freenas-nvmeof-ssd-csi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  bootstrap:
    initdb:
      database: ambient
      owner: ambient
