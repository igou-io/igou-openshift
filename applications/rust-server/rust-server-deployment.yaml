---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-server
  namespace: public-services
  labels:
    app.kubernetes.io/name: rust-server
spec:
  replicas: 0
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-server
    spec:
      runtimeClassName: kata
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rust-server
          image: docker.io/cm2network/steamcmd:steam-bookworm@sha256:6420fb40313fc00ee0d7fe1ae02c4c32f2b085980f5795b7171022d3409e29fb
          workingDir: /data
          command:
            - /bin/bash
            - /config/start.sh
          env:
            - name: HOME
              value: /data
            - name: LD_LIBRARY_PATH
              value: /data/rust/RustDedicated_Data/Plugins/x86_64:/data/steamcmd/linux64
          ports:
            - name: game
              containerPort: 27020
              protocol: UDP
            - name: query
              containerPort: 27021
              protocol: UDP
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - test -r /proc/net/udp && grep -qi ':698D ' /proc/net/udp
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: '1'
              memory: 8Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: '3'
              memory: 12Gi
              ephemeral-storage: 40Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: rust-server
        - name: data
          emptyDir:
            sizeLimit: 38Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
