---
apiVersion: v1
kind: Service
metadata:
  name: rust-server-public
  namespace: public-services
  annotations:
    tailscale.com/proxy-class: public-services
    tailscale.com/hostname: ocp-public-rust-server
    tailscale.com/tags: tag:ocp-public-service
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: rust-server
  ports:
    - name: game
      port: 27020
      targetPort: 27020
      protocol: UDP
