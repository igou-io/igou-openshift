apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hermes-assistant-dashboard
  namespace: hermes-assistant
  labels:
    app: hermes-assistant
spec:
  host: hermes-dashboard.apps.ocp.igou.systems
  to:
    kind: Service
    name: hermes-assistant
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
