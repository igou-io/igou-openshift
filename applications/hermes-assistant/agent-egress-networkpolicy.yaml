---
# This policy replaces the operator baseline, whose generic TCP/443 egress is
# incompatible with enforced proxy-only public web access. On OVN-Kubernetes,
# the load-balancer
# DNAT from ClusterIP to the backend pod happens BEFORE egress ACLs are
# evaluated, so the rule must match the POST-DNAT port. kube-apiserver's
# 172.30.0.1:443 becomes :6443, and OpenShift CoreDNS's 172.30.0.10:53
# becomes :5353. Neither matched, so the agent could reach nothing —
# in-cluster auth failed and DNS timed out.
#
# It also preserves the operator baseline's same-namespace service ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-openshift-egress
  namespace: hermes-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes-assistant
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-assistant
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9119
  egress:
    # In-cluster Forgejo: hermes itself can create repos / push to sandbox.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 3000
    # Cluster DNS: OpenShift CoreDNS listens on 5353 behind the :53 service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Shared Hermes HTTP/HTTPS egress proxy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
    # kube-apiserver: needed to create session pods and open exec streams.
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - protocol: TCP
          port: 6443
    # In-cluster services the VM's nftables/egress rules allowed, ports are
    # POST-DNAT pod ports (the OVN gotcha above applies to these too).
    # llama.cpp custom providers (config custom_providers).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llmkube-system
      ports:
        - protocol: TCP
          port: 8080
    # web.search_backend: searxng
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng
      ports:
        - protocol: TCP
          port: 8080
    # web.backend / extract_backend: firecrawl
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: firecrawl
      ports:
        - protocol: TCP
          port: 3002
    # sands-of-time price tracker (plain HTTP, tirith-trusted on the VM)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sands-of-time
      ports:
        - protocol: TCP
          port: 8000
    # ghapp broker (same namespace): runtime GitHub App tokens
    - to:
        - podSelector:
            matchLabels:
              app: ghbroker
      ports:
        - protocol: TCP
          port: 8085
