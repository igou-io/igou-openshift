apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-sa-storescrape
  namespace: hermes-assistant
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: gcp-sa-storescrape
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: storescrape-sheets.json
      remoteRef:
        key: storescrape-sheets
        property: keyfile
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
