---
# The broker listener is unauthenticated, so ingress policy is its client
# authorization boundary. The broker itself can reach only DNS and Squid.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghbroker
  namespace: hermes-assistant
spec:
  podSelector:
    matchLabels:
      app: ghbroker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: hermes-assistant
              app.kubernetes.io/name: hermes-agent
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: hermes-agent
      ports:
        - protocol: TCP
          port: 8085
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: squid-proxy
      ports:
        - protocol: TCP
          port: 3128
