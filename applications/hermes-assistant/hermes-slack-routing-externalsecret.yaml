---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-slack-routing
  namespace: hermes-assistant
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: hermes-slack-routing
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_ALLOWED_USERS
      remoteRef:
        key: hermes-assistant
        property: slack_allowed_users
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SLACK_HOME_CHANNEL
      remoteRef:
        key: hermes-assistant
        property: slack_channel_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
