apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-iscsi-ssd-config
  namespace: democratic-csi
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: democratic-csi-iscsi-ssd-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        driver-config-file.yaml: |-
          driver: freenas-api-iscsi
          instance_id:
          node:
            mount:
              # predominantly used to facilitate testing
              # mount_flags should generally be defined in storage classes, etc
              mount_flags: ""
              # should fsck be executed before mounting the fs
              checkFilesystem:
                xfs:
                  enabled: true
                  customOptions: []
                ext4:
                  enabled: true
                  customOptions: []
                  customFilesystemOptions: []
                btrfs:
                  enabled: true
                  customOptions: []
                  customFilesystemOptions: []
          httpConnection:
            protocol: https
            host: {{ .truenas_host }}
            port: 443
            apiKey: {{ .truenas_csi_api_key_ocp }}
            allowInsecure: false
            apiVersion: 2
          zfs:
            datasetParentName: ssd/k8s/vols
            detachedSnapshotsDatasetParentName: cold/k8sbak/ssd
            # Stamp every volume with its k8s identity as ZFS user properties
            # (drives name-addressed snapshot tasks + restore-by-name; the
            # Handlebars {{ }} below are emitted as literals through the ESO
            # Go-template so democratic-csi resolves them at CreateVolume time
            # from --extra-create-metadata parameters).
            datasetProperties:
              "k8s:cluster": "ocp"
              "k8s:pvc_namespace": "{{ `{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}` }}"
              "k8s:pvc_name": "{{ `{{ parameters.[csi.storage.k8s.io/pvc/name] }}` }}"
            zvolCompression:
            zvolDedup:
            zvolEnableReservation: false
            zvolBlocksize:
          iscsi:
            targetPortal: "{{ .truenas_host }}:3260"
            targetPortals: []
            interface:
            namePrefix: csi-
            nameSuffix: "-ocp"
            targetGroups:
              - targetGroupPortalGroup: 1
                targetGroupInitiatorGroup: 5
                targetGroupAuthType: None
                targetGroupAuthGroup:
            extentInsecureTpc: true
            extentXenCompat: false
            extentDisablePhysicalBlocksize: true
            extentBlocksize: 512
            extentRpm: "SSD"
            extentAvailThreshold: 0
  dataFrom:
  - extract:
      key: truenas
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
