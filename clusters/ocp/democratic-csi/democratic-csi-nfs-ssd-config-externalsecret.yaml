apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-nfs-ssd-config
  namespace: democratic-csi
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: democratic-csi-nfs-ssd-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        driver-config-file.yaml: |-
          driver: freenas-api-nfs
          instance_id:
          httpConnection:
            protocol: https
            host: {{ .truenas_host }}
            port: 443
            apiKey: {{ .truenas_csi_api_key_ocp }}
            allowInsecure: false
            apiVersion: 2
          zfs:
            datasetParentName: ssd/k8s/vols
            detachedSnapshotsDatasetParentName: cold/k8sbak/ssd
            # Stamp every volume with its k8s identity as ZFS user properties
            # (drives name-addressed snapshot tasks + restore-by-name; the
            # Handlebars expressions below are emitted as literals through the ESO
            # Go-template so democratic-csi resolves them at CreateVolume time
            # from --extra-create-metadata parameters).
            datasetProperties:
              "k8s:cluster": "ocp"
              "k8s:pvc_namespace": "{{ `{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}` }}"
              "k8s:pvc_name": "{{ `{{ parameters.[csi.storage.k8s.io/pvc/name] }}` }}"
            datasetEnableQuotas: true
            datasetEnableReservation: false
            datasetPermissionsMode: "0777"
            datasetPermissionsUser: 0
            datasetPermissionsGroup: 0
          nfs:
            shareHost: truenas.igou.systems
            shareAlldirs: false
            shareAllowedHosts: []
            shareAllowedNetworks: []
            shareMaprootUser: root
            shareMaprootGroup: wheel
            shareMapallUser: ""
            shareMapallGroup: ""
  dataFrom:
  - extract:
      key: truenas
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
