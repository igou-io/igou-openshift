---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-desktop-ssh
  namespace: ansible-automation-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: codex-desktop
          podSelector:
            matchLabels:
              app.kubernetes.io/name: codex-desktop
              kubevirt.io: virt-launcher
      ports:
        - port: 22
          protocol: TCP
