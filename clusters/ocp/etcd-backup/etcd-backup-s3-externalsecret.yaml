---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-s3
  namespace: etcd-backup
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: etcd-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # API-defaulted; declared so ArgoCD (SSA) stays Synced.
      mergePolicy: Replace
      data:
        access_key_id: "{{ .username }}"
        secret_access_key: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: etcd-backups-rustfs-cold
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: etcd-backups-rustfs-cold
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
