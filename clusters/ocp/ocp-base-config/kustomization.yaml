apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../../.helm/charts
helmCharts:
- name: ocp-base-config
  valuesFile: values.yaml
patches: []
secretGenerator:
- name: saturn-oauth-templates
  namespace: openshift-config
  files:
  - oauth-templates/login.html
  - oauth-templates/providers.html
  - oauth-templates/errors.html
  options:
    disableNameSuffixHash: true
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
