cluster:
  name: ocp
  baseDomain: igou.systems

certManager:
  enabled: true
  apiCert: true
  defaultIngressCert: true
  acmeBase: 'https://acme-v02.api.letsencrypt.org/directory'
  externalSecret:
    name: dns-token
    onePasswordSecretName: dns-token
  solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            key: credential
            name: dns-token
          email: igou.david@gmail.com
      selector:
        dnsZones:
          - igou.systems
          - ocp.igou.systems


monitoring:
  enabled: false
  storageClass: freenas-nvmeof-fast-csi

network:
  hostRouting: false

auth:
  enabled: true
  # dev1 (and any other non-admin htpasswd persona) must not create arbitrary
  # projects; their workspaces are pre-provisioned with scoped RBAC instead.
  # NOTE: also affects ava — plain users lose `oc new-project`.
  disableSelfProvisioning: true
  htpasswdDisplayName: igou
  globalAdmins:
    - igou
  externalSecret:
    name: htpasswd-secret
    onePasswordSecretName: htpasswd

timesync:
  enabled: false
  ptp:
    enabled: false
    loadKvmModule: false
    device: 'ptp_kvm'
    sourceStratum: 2
  ntpServers:
    - 10.10.90.1
