apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 98-casval-data-partition
  labels:
    machineconfiguration.openshift.io/role: casval
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      disks:
        - device: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNU0Y110642R
          wipeTable: false
          partitions:
            - number: 5
              label: casval-lvm
              startMiB: 307200
              sizeMiB: 0
              typeGuid: E6D6D379-F507-44C2-A23C-238F2A3DF928
      files:
        # Register in the Casval pool immediately; CAPI labels arrive later.
        - path: /etc/kubernetes/casval-kubelet-env
          mode: 420
          overwrite: true
          contents:
            source: data:,CUSTOM_KUBELET_LABELS%3Dnode-role.kubernetes.io%2Fcasval%3D%2Cnode-role.kubernetes.io%2Fburst%3D%0A
    systemd:
      units:
        - name: kubelet.service
          dropins:
            - name: 30-casval-node-labels.conf
              contents: |
                [Service]
                EnvironmentFile=/etc/kubernetes/casval-kubelet-env
