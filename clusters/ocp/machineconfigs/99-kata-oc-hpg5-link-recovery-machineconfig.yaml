---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-kata-oc-hpg5-link-recovery
  labels:
    machineconfiguration.openshift.io/role: kata-oc
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        # Source: files/hpg5-link-recovery.sh. The behavioral check verifies parity.
        - path: /usr/local/bin/hpg5-link-recovery
          mode: 493
          overwrite: true
          contents:
            source: data:;base64,
    systemd:
      units:
        - name: hpg5-link-recovery.service
          contents: |
            [Unit]
            Description=Recover HP I219-LM link speed once after boot
            ConditionHost=hpg5.igou.systems
            After=network-online.target
            Wants=network-online.target
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            Environment=PATH=/usr/sbin:/usr/bin:/sbin:/bin
            ExecStart=/usr/local/bin/hpg5-link-recovery
            TimeoutStartSec=60s
        - name: hpg5-link-recovery.timer
          enabled: true
          contents: |
            [Unit]
            Description=Check HP link speed after boot networking settles
            ConditionHost=hpg5.igou.systems
            [Timer]
            OnBootSec=90s
            AccuracySec=1s
            [Install]
            WantedBy=timers.target
