apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-truenas-nvme-readahead
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        # The read-only helper checks TCP on controller paths and multipath heads.
        - path: /usr/local/bin/igou-nvme-is-tcp
          mode: 493
          overwrite: true
          contents:
            source: data:;base64,
        # Cap transfers and read-ahead at 1 MiB on target attachment and change events.
        - path: /etc/udev/rules.d/99-truenas-nvme-readahead.rules
          mode: 420
          overwrite: true
          contents:
            source: data:;base64,
        # NVMe rescans reset the queue limits without generating a udev event.
        - path: /usr/local/bin/igou-nvme-readahead
          mode: 493
          overwrite: true
          contents:
            source: data:;base64,
    systemd:
      units:
        - name: truenas-nvme-readahead.service
          contents: |
            [Unit]
            Description=Reconcile TrueNAS NVMe TCP transfer limits and read-ahead after CSI rescans
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/igou-nvme-readahead
        - name: truenas-nvme-readahead.timer
          enabled: true
          contents: |
            [Unit]
            Description=Keep TrueNAS NVMe TCP transfers and read-ahead at 1 MiB
            [Timer]
            OnBootSec=5s
            OnUnitActiveSec=5s
            AccuracySec=1s
            [Install]
            WantedBy=timers.target
