apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-truenas-nvme-readahead
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        # The read-only helper checks TCP on controller paths and multipath heads.
        - path: /usr/local/bin/igou-nvme-is-tcp
          mode: 493
          overwrite: true
          contents:
            source: data:;base64,
        # Apply 1 MiB read-ahead on attachment and change events for this target.
        - path: /etc/udev/rules.d/99-truenas-nvme-readahead.rules
          mode: 420
          overwrite: true
          contents:
            source: data:;base64,
