    # The operator rewrites every egress Service's spec.externalName from the
    # git placeholder to its proxy FQDN (igou-io-node-exporter, t3-vscode).
    # Defer that field to the operator — no name filter, so future egress
    # Services don't sit permanently OutOfSync.
    ignoreDifferences:
      - group: ""
        kind: Service
        namespace: tailscale
        jsonPointers:
          - /spec/externalName

  cloudnative-pg:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: cloudnative-pg
    source:
