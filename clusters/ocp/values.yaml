  # without AAP, but the intended day-2 integration authenticates against the
  # gateway and dispatches jobs to controller.
  automation-orchestrator:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '31'
    destination:
      namespace: automation-orchestrator
    source:
      path: clusters/ocp/automation-orchestrator

  # AAP 2.7 Ansible automation portal (self-service, RHDH/Backstage-based).
  # POC deployment — authenticates against the AAP gateway OAuth app
  # (lab_aap/aap-portal); wave 31 so the gateway (wave 30) is up first.
  aap-portal:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '31'
    destination:
      namespace: aap-portal
    source:
      path: components/aap-portal

  molecule:
    annotations:
      argocd.argoproj.io/sync-wave: '39'
    source:
      path: components/molecule

  # AI coding benchmark: standing infra (namespace, SAs, RBAC, secrets,
  # identity PVC). The benchmark content and Tekton pipeline live in the
  # Forgejo bench repo (see collection-bench-pipeline below).
  ansible-collection-bench:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '39'
    source:
      path: applications/ansible-collection-bench
    # Same drift as pac-tenants: the image-registry-pull-secrets controller
    # injects <sa>-dockercfg-* into the SAs; defer those fields to it.
    # auth-login replicas are operated manually (oc scale up for login
    # sessions, back to 0 after) — selfHeal must not fight that.
    ignoreDifferences:
      - group: ""
        kind: ServiceAccount
        managedFieldsManagers:
          - openshift.io/image-registry-pull-secrets_service-account-controller
      - group: apps
        kind: Deployment
        name: auth-login
        jsonPointers:
          - /spec/replicas

  # The collection-bench Tekton Pipeline, synced from the bench repo on
  # Forgejo so pipeline changes ship with the benchmark content.
  collection-bench-pipeline:
    project: cluster-apps
    destination:
      namespace: ansible-collection-bench
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '40'
    # Tekton admission defaults Pipeline/EventListener spec fields; SSA
    # keeps ArgoCD owning only the fields present in git, and the diff
    # ignores the serialization artifacts admission adds (empty
    # taskSpec.metadata/spec/computeResources, EL selector defaults).
    syncOptions:
      - ServerSideApply=true
    ignoreDifferences:
      - group: tekton.dev
        kind: Pipeline
        jqPathExpressions:
          - .spec.tasks[].taskSpec.metadata
          - .spec.tasks[].taskSpec.spec
          - .spec.tasks[].taskSpec.steps[].computeResources
          - .spec.finally[].taskSpec.metadata
          - .spec.finally[].taskSpec.spec
          - .spec.finally[].taskSpec.steps[].computeResources
      - group: triggers.tekton.dev
        kind: EventListener
        jqPathExpressions:
          - .spec.namespaceSelector
          - .spec.resources
    source:
      repoURL: https://forgejo.apps.ocp.igou.systems/bench/ansible-collection-bench.git
      targetRevision: main
      path: harness
      extraSourceFields: |
        directory:
          include: '{pipeline.yaml,triggers.yaml}'

  service-accounts:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '40'
    source:
      path: clusters/ocp/service-accounts

  openshift-virt:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '50'
    source:
      path: components/openshift-virt
