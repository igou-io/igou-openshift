  ace-step:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '20'
    source:
      path: applications/ace-step
    # Replicas are scaled manually. Leave them alone so ArgoCD does not
    # revert a scale-down back to the 1 checked into git.
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas

  forgejo:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '22'
    source:
      path: applications/forgejo

    # The DB was disaster-recovered 2026-07-03; the live CNPG Cluster keeps its
    # recovery-baked, CNPG-defaulted bootstrap (immutable, set once at creation)
    # while git holds the steady-state initdb for a clean recreate. Ignore that
    # drift so the app stays Synced.
    ignoreDifferences:
      - group: postgresql.cnpg.io
        kind: Cluster
        jsonPointers:
          - /spec/bootstrap
          - /spec/externalClusters
  gitea-mirror:
    project: cluster-apps
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '23'
    source:
      path: applications/gitea-mirror

  quay-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '22'
    source:
