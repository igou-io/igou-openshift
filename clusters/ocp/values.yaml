  cluster-api-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    destination:
      namespace: capi-operator-system
    source:
      path: components/cluster-api-operator

  cluster-api:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '11'
    destination:
      namespace: openshift-cluster-api
    source:
      path: clusters/ocp/cluster-api
    # Metal3/CAPM3 patches BMH spec fields when it claims the host (online,
    # consumerRef, image, userData, customDeploy, preprovisioning*). Leave
    # those to the controllers so ArgoCD doesn't fight them back to the
    # minimal manifest checked into git.
    ignoreDifferences:
      - group: metal3.io
        kind: BareMetalHost
        jsonPointers:
          - /spec/online
          - /spec/consumerRef
          - /spec/image
          - /spec/userData
          - /spec/customDeploy
          - /spec/preprovisioningNetworkDataName
          - /spec/networkData
      # The casval_scale AAP job owns replicas for this on-demand MachineSet.
      # Leave the live value alone so ArgoCD does not revert an active lease
      # to the 0 checked into git and trigger a delete/recreate loop.
      # (PR #598 accidentally re-parented this whole block under etcd-backup
      # by inserting that entry mid-app; that broke every casval burst
      # scale-up from 2026-07 onward — self-heal deleted Machines
      # mid-provision. Keep this block directly under cluster-api.)
      - group: cluster.x-k8s.io
        kind: MachineSet
        jsonPointers:
          - /spec/replicas

  # Nightly etcd snapshot to rustfs-cold (DR gap #1). Wave 11: only needs
  # ESO (wave 0); grouped with the other cluster-operations cronjobs.
  etcd-backup:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '11'
    destination:
      namespace: etcd-backup
    source:
      path: clusters/ocp/etcd-backup

  # OADP/Velero: scheduled app-consistent backups (namespace objects + PV
  # data via CSI snapshot -> kopia data mover) to rustfs-cold. DR P1 from
  # the 2026-07-03 post-mortem. Wave 12: needs ESO (0) and the
  # democratic-csi drivers (7); grouped with cluster-operations after
  # etcd-backup (11). IgnoreExtraneous: Velero mints Backup/Restore/
  # PodVolume CRs at runtime.
  oadp:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '12'
    destination:
      namespace: openshift-adp
    source:
      path: clusters/ocp/oadp

  loki-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/loki-operator

  openshift-logging:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/openshift-logging

  netobserv-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/netobserv-operator
  sandboxed-containers-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/sandboxed-containers-operator
  agent-sandbox-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/agent-sandbox-operator

  # LokiStack + ClusterLogForwarder operands for central logging (issue
  # #382): store = RustFS S3 (hot instance) via ESO, tenants
  # application/infrastructure/audit. After the loki-operator and
  # openshift-logging operator subscriptions at wave 10.
  cluster-logging:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '15'
    destination:
      namespace: openshift-logging
    source:
      path: clusters/ocp/openshift-logging

  # NetObserv operands: dedicated flow-log LokiStack (openshift-network
  # tenants — the central-logging LokiStack's mode cannot be shared) +
  # FlowCollector (sampled eBPF flows for NetworkPolicy authoring). After
  # the netobserv and loki operator subscriptions at wave 10.
  netobserv:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '15'
    destination:
      namespace: netobserv
    source:
      path: clusters/ocp/netobserv

  openshift-pipelines:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/openshift-pipelines

  # Alloy aggregator for all off-cluster log ingest (issue #382) — the
  # config-as-code replacement for syslog.igou.systems. Syslog :514 +
  # Loki push :3500 behind pinned trusted-lan VIP 10.10.150.16; the only
  # holder of a LokiStack write token for external logs. After
  # cluster-logging (wave 15).
  log-gateway:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: log-gateway
    source:
      path: components/log-gateway

  remote-tenants:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '20'
    source:
      path: clusters/ocp/remote-tenants

  pac-tenants:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '20'
    source:
      path: clusters/ocp/pac-tenants
    # OpenShift's image-registry-pull-secrets controller injects the
    # auto-generated `<sa>-dockercfg-*` entry into the operator-owned
    # `pipeline` SA's imagePullSecrets/secrets. SSA prevents us from
    # overwriting it, but ArgoCD's diff still flags it as OutOfSync.
    # Defer those fields to that controller via field-manager scoping.
    ignoreDifferences:
      - group: ""
        kind: ServiceAccount
        managedFieldsManagers:
          - openshift.io/image-registry-pull-secrets_service-account-controller

  # Weekly Tekton rebuild of the igou-aap-ee-rhel9 execution environment.
  # Wave 21 so the ci-igou-ansible namespace (pac-tenants, wave 20) exists
  # first; this app never creates it.
  ee-rebuild:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '21'
    destination:
      namespace: ci-igou-ansible
    source:
      path: components/ee-rebuild

    # Tekton's admission webhook defaults fields the manifests omit
    # (params[].type, taskRef metadata/spec stubs, steps[].computeResources),
    # which reads as permanent OutOfSync under auto-sync. Ignore exactly those.
    ignoreDifferences:
      - group: tekton.dev
        kind: Pipeline
        jqPathExpressions:
          - '.spec.params[]?.type'
          - '.spec.tasks[]?.params[]?.type'
          - '.spec.tasks[]?.taskRef.metadata'
          - '.spec.tasks[]?.taskRef.spec'
          - '.spec.tasks[]?.taskSpec.metadata'
          - '.spec.tasks[]?.taskSpec.spec'
          - '.spec.tasks[]?.taskSpec.params[]?.type'
          - '.spec.tasks[]?.taskSpec.results[]?.type'
          - '.spec.tasks[]?.taskSpec.steps[]?.computeResources'
      - group: tekton.dev
        kind: Task
        jqPathExpressions:
          - '.spec.steps[]?.computeResources'
          - '.spec.params[]?.type'

  intel-device-plugins-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    source:
      path: components/intel-device-plugins-operator

  grafana:
