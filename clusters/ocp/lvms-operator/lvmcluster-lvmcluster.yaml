apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: lvmcluster
  namespace: openshift-storage
spec:
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
    - effect: NoSchedule
      key: workload
      operator: Equal
      value: burst
  storage:
    deviceClasses:
    - name: lvm-local-storage
      # Node selection and force wiping are immutable: recreate the unused
      # LVMCluster for this change. Rollout ordering is documented in igou-docs.
      nodeSelector:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/master
            operator: Exists
        - matchExpressions:
          - key: node.igou.systems/casval
            operator: Exists
      deviceSelector:
        forceWipeDevicesAndDestroyAllData: false
        # Each node has its own partition; the other node's ID is absent.
        optionalPaths:
        - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNJ0X135879F-part5
        - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNU0Y110642R-part5
      fstype: xfs
      thinPoolConfig:
        chunkSizeCalculationPolicy: Static
        metadataSizeCalculationPolicy: Host
        name: lvm-local-storage-thin-pool
        overprovisionRatio: 1
        sizePercent: 90
