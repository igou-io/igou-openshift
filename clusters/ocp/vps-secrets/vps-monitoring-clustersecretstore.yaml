---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vps-monitoring
spec:
  conditions:
    - namespaces:
        - tailscale
  provider:
    kubernetes:
      remoteNamespace: monitoring
      server:
        url: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
        caProvider:
          type: Secret
          name: vps-secrets
          namespace: openshift-gitops
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: vps-secrets
            namespace: openshift-gitops
            key: argocd-token
