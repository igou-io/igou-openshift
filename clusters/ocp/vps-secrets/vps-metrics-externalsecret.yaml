---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vps-metrics
  namespace: tailscale
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vps-monitoring
  target:
    name: vps-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: metrics-reader-token
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ca.crt
      remoteRef:
        key: metrics-reader-token
        property: ca.crt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
