---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vps-public-tls
  namespace: openshift-gitops
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vps-secrets
      kind: SecretStore
  selector:
    secret:
      name: vps-public-tls
  template:
    engineVersion: v2
    type: Opaque
    data:
      # One property carries a matched pair through remote Secret updates.
      bundle: '{{ dict "tls.crt" (index . "tls.crt") "tls.key" (index . "tls.key") | mustToJson }}'
  data:
    - match:
        secretKey: bundle
        remoteRef:
          remoteKey: vps-public-tls
          property: bundle
