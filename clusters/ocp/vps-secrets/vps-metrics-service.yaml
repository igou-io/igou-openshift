---
apiVersion: v1
kind: Service
metadata:
  name: vps-metrics
  namespace: tailscale
  labels:
    app.kubernetes.io/name: vps-metrics
spec:
  selector:
    tailscale.com/managed: 'true'
    tailscale.com/parent-resource: vps-k3s-api
    tailscale.com/parent-resource-ns: vps-secrets
  ports:
    - name: https
      port: 6443
      targetPort: 6443
      protocol: TCP
