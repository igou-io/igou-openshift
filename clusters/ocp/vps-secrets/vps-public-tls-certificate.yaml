---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vps-public-tls
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  secretName: vps-public-tls
  dnsNames:
    - igou.io
    - '*.igou.io'
    - '*.sharing.igou.io'
  issuerRef:
    kind: Issuer
    name: vps-acme
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
