---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vps-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/ignore-healthcheck: 'true'
spec:
  project: cluster-config
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/igou-io/igou-openshift.git
    targetRevision: main
    path: clusters/ocp/vps-secrets
  ignoreDifferences:
    - kind: Service
      name: vps-k3s-api
      namespace: vps-secrets
      jsonPointers:
        - /spec/externalName
    - group: external-secrets.io
      kind: PushSecret
      name: vps-gotify
      namespace: openshift-gitops
      jqPathExpressions:
        - '.spec.data[].conversionStrategy'
    - group: external-secrets.io
      kind: PushSecret
      name: vps-public-tls
      namespace: openshift-gitops
      jqPathExpressions:
        - '.spec.data[].conversionStrategy'
        - '.spec.template.mergePolicy'
    - group: external-secrets.io
      kind: PushSecret
      name: vps-tailscale
      namespace: openshift-gitops
      jqPathExpressions:
        - '.spec.data[].conversionStrategy'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
