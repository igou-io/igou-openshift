# Localnet CUDN: VLAN 9 on the hub trunk (OVS localnet trunk-network → br-secondary).
# Example: https://github.com/igou-io/igou-docs/blob/main/wiki/UDN%20and%20ClusterUserDefinedNetwork%20Topologies%20%28Layer2%2C%20Layer3%2C%20Localnet%29%20on%20OVN-K.md#cudn-localnet-no-ipam
# Bridge mapping: clusters/ocp/nmstate/mapping-nodenetworkconfigurationpolicy.yaml
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan9-no-ipam
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  namespaceSelector:
    matchLabels:
      network.igou.systems/vlan9: "true"
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: trunk-network
      vlan:
        mode: Access
        access:
          id: 9
      ipam:
        mode: Disabled
