apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Audit application and human API activity by identity, resource, verb,
  # timestamp and result. Request/response bodies add operator churn and
  # oversized records without serving that goal. The collector's scoped
  # audit policy forwards metadata for reads and writes from those callers.
  # This deliberately replaces the CIS-driven WriteRequestBodies setting.
  # Changing this profile rolls all three API servers on the single master.
  audit:
    profile: Default
  encryption:
    type: identity
  servingCerts:
    namedCertificates:
    - names:
      - api.ocp.igou.systems
      servingCertificate:
        name: acme-api
