---
# PREREQUISITE: 1Password item `velero-user-rustfs-cold` (fields
# username/password) in vault `lab_s3`, holding the access/secret keys of
# the `velero` RustFS user. The user, `velero` bucket, and `velero_rw`
# policy are declared in igou-inventory host_vars/rustfs-cold.yml and
# applied by the AAP `rustfs_state_converge` job.
#
# The velero-plugin-for-aws consumes an AWS shared-credentials INI blob
# under the key `cloud` (referenced by the DPA backupLocation credential).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: cloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # API-defaulted; declared so ArgoCD (SSA) stays Synced.
      mergePolicy: Replace
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .username }}
          aws_secret_access_key={{ .password }}
  data:
    - secretKey: username
      remoteRef:
        key: velero-user-rustfs-cold
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: velero-user-rustfs-cold
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
