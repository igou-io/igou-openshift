---
# Large, slow-changing volumes: weekly is enough and keeps the daily
# window short. Saturday 06:00 UTC = 02:00 ET. This schedule (plus
# daily-*) fully supersedes the TrueNAS name-addressed snapshot/
# replication schedules (igou-inventory truenas_k8s_protected_volumes,
# removed in favor of OADP):
# - windows-images: codex-desktop boot + vTPM/EFI persistent-state PVCs.
# - comfyui: comfyui-data only (comfyui-models carries the
#   velero.io/exclude-from-backup label — re-downloadable weights).
# - openshift-virtualization-os-images: the manually-built win2k25/win11
#   goldens; DataImportCron-managed goldens ride along (not in git, no
#   way to name-exclude — rebuildable, but cheap enough weekly).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-heavy
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  schedule: "0 6 * * 6"
  template:
    includedNamespaces:
      - windows-images
      - comfyui
      - openshift-virtualization-os-images
    # Skip pod objects so KubeVirt's virt-freezer hook annotations never
    # run: Windows VSS auto-thaws after its ~10s writer-hold limit, so
    # codex-desktop's post-backup thaw always fails ("couldn't hold
    # writes") and marks the backup PartiallyFailed. KubeVirt has no
    # per-VM opt-out (kubevirt/kubevirt#14056); crash-consistent disks
    # are fine for this pipeline-rebuilt desktop. Pods are never
    # restored from backup anyway. hermes's working freeze lives in
    # daily-apps and is unaffected.
    excludedResources:
      - pods
    snapshotMoveData: true
    ttl: 2160h0m0s
