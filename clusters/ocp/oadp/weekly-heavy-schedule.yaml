---
# Large, slow-changing volumes: weekly is enough and keeps the daily
# window short. Saturday 06:00 UTC = 02:00 ET. This schedule (plus
# daily-*) fully supersedes the TrueNAS name-addressed snapshot/
# replication schedules (igou-inventory truenas_k8s_protected_volumes,
# removed in favor of OADP):
# - comfyui: comfyui-data only (comfyui-models carries the
#   velero.io/exclude-from-backup label — re-downloadable weights).
# Windows goldens have a separate monthly schedule. CDI-managed OS images
# are reproducible from upstream and do not need scheduled volume backups.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-heavy
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  schedule: "0 6 * * 6"
  template:
    includedNamespaces:
      - comfyui
    snapshotMoveData: true
    ttl: 2160h0m0s
