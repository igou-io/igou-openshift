---
# Fixed name: this is one archive, not a recurring Schedule. Update the name
# only after rebuilding a golden and deciding to replace the retained copy.
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: windows-goldens-20261008
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: '13'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  includedNamespaces:
    - openshift-virtualization-os-images
  includedNamespaceScopedResources:
    - persistentvolumeclaims
    - datavolumes.cdi.kubevirt.io
    - datasources.cdi.kubevirt.io
  # Automatic Linux imports carry this label on their PVCs/DataVolumes.
  # The two manually published Windows goldens (win11 and win2k25) do not.
  labelSelector:
    matchExpressions:
      - key: cdi.kubevirt.io/dataImportCron
        operator: DoesNotExist
  storageLocation: default
  snapshotMoveData: true
  # Velero uses the server's default retention when TTL is zero/omitted.
  # A 100-year TTL keeps this unchanged archive beyond normal rotation.
  ttl: 876000h0m0s
