apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: casval-worker-user-data
  namespace: openshift-cluster-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: casval-bootstrap
    kind: SecretStore
  target:
    name: casval-worker-user-data
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        disableTemplating: "true"
        # ESO omits Sprig's fail helper. These mustFromJson guards abort rendering
        # on incompatible upstream data instead of publishing invalid Ignition.
        userData: |-
          {{- $config := .userData | mustFromJson -}}
          {{- if not $config.ignition.version -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: missing Ignition version" -}}
          {{- end -}}
          {{- if dig "ignition" "config" "replace" false $config -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: unexpected Ignition replace" -}}
          {{- end -}}
          {{- $storage := get $config "storage" | default dict -}}
          {{- if get $storage "disks" -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: review upstream disk configuration" -}}
          {{- end -}}
          {{- $matches := 0 -}}
          {{- range $resource := dig "ignition" "config" "merge" (list) $config -}}
          {{- $source := get $resource "source" | default "" -}}
          {{- if regexMatch "^https://[^/?#]+/config/worker$" $source -}}
          {{- $_ := set $resource "source" (regexReplaceAll "/config/worker$" $source "/config/casval") -}}
          {{- $matches = add $matches 1 -}}
          {{- end -}}
          {{- end -}}
          {{- if ne $matches 1 -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: expected exactly one HTTPS worker pool source" -}}
          {{- end -}}
          {{- $config | toJson -}}
  data:
    - secretKey: userData
      remoteRef:
        key: worker-user-data-managed
        property: userData
