apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: casval-worker-user-data
  namespace: openshift-cluster-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: casval-bootstrap
    kind: SecretStore
  target:
    name: casval-worker-user-data
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        disableTemplating: "true"
        # ESO omits Sprig's fail helper. These mustFromJson guards abort rendering
        # on incompatible upstream data instead of publishing invalid Ignition.
        userData: |-
          {{- $config := .userData | mustFromJson -}}
          {{- if not $config.ignition.version -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: missing Ignition version" -}}
          {{- end -}}
          {{- if dig "ignition" "config" "replace" false $config -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: Ignition replace discards the Casval partition" -}}
          {{- end -}}
          {{- $storage := get $config "storage" | default dict -}}
          {{- if get $storage "disks" -}}
          {{- $config = mustFromJson "Invalid worker bootstrap: review upstream disk configuration" -}}
          {{- end -}}
          {{- $disk := `
          device: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNU0Y110642R
          wipeTable: false
          partitions:
            - number: 5
              label: casval-lvm
              startMiB: 307200
              sizeMiB: 0
              typeGuid: E6D6D379-F507-44C2-A23C-238F2A3DF928
          ` | fromYaml -}}
          {{- $_ := set $storage "disks" (list $disk) -}}
          {{- $_ := set $config "storage" $storage -}}
          {{- $config | toJson -}}
  data:
    - secretKey: userData
      remoteRef:
        key: worker-user-data-managed
        property: userData
