apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: casval-bootstrap
  namespace: openshift-cluster-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-machine-api
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: casval-bootstrap-reader
