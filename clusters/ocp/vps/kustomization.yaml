---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vps-gitops

resources:
  - cluster-config-appproject.yaml

helmGlobals:
  chartHome: ../../../.helm/charts

helmCharts:
  - name: argocd-app-of-app
    valuesFile: values.yaml
    namespace: vps-gitops

patches:
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      - op: add
        path: /metadata/namespace
        value: vps-gitops

  # The OCP chart omits syncPolicy for manual Applications. Preserve SSA and
  # retry settings while website/Gotify auto-sync stays off during migration.
  - target:
      group: argoproj.io
      kind: Application
      name: (igou-io|gotify)
    patch: |-
      - op: add
        path: /spec/syncPolicy
        value:
          retry:
            limit: 10
            backoff:
              duration: 5s
              factor: 2
              maxDuration: 3m
          syncOptions:
            - ServerSideApply=true
            - CreateNamespace=false
            - SkipDryRunOnMissingResource=true
