---
# Backend database credentials, shared by two consumers:
#   - CNPG bootstrap (initdb owner secret; reads username/password)
#   - the AutomationOrchestrator CR spec.postgres.backendDatabase.secretRef
#     (reads database/username/password)
# PREREQUISITE: 1Password item `orchestrator-pg-credentials` in the
# `lab_openshift` vault with fields username=orchestrator and password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-pg-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: orchestrator-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        database: orchestrator
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: orchestrator-pg-credentials
        metadataPolicy: None
        nullBytePolicy: Ignore
