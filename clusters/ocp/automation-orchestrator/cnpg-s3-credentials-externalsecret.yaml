---
# S3 credentials for the CNPG Barman Cloud Plugin backups of orchestrator-pg.
# Wave 2 so the secret exists before the Cluster (wave 3) starts with the
# barman sidecar that needs it to archive WAL.
# PREREQUISITE: 1Password item `cnpg-s3-backup` in the S3 vault (already
# provisioned for the other CNPG clusters).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: cnpg-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: cnpg-s3-backup
        metadataPolicy: None
        nullBytePolicy: Ignore
