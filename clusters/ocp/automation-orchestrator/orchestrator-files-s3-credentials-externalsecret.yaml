---
# S3 credentials for automation orchestrator file uploads
# (spec.fileStorage.credentialSecretRef -- note the operator's key names
# access-key-id/secret-access-key differ from the ACCESS_KEY_ID shape the
# barman ObjectStore secret uses). The rustfs-cold user/bucket/policy are
# declared in igou-inventory host_vars/rustfs-cold.yml (orchestrator-files).
# PREREQUISITE: 1Password item `orchestrator-files-rustfs-cold` in the
# `lab_s3` vault with fields username (= access key) and password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-files-s3-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: orchestrator-files-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        access-key-id: "{{ .username }}"
        secret-access-key: "{{ .password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: orchestrator-files-rustfs-cold
        metadataPolicy: None
        nullBytePolicy: Ignore
