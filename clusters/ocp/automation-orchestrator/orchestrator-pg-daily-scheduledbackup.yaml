---
# Nightly full backup of orchestrator-pg via the Barman Cloud Plugin
# (staggered 04:00; 03:00-03:45 and 04:15 are taken by the other clusters).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: orchestrator-pg-daily
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedule: "0 0 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: orchestrator-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
