---
# Initial password for the built-in `admin` account. Only consumed on first
# deployment (the operator ignores changes once the admin user exists).
# Sourced from 1Password so the login lives next to the AAP admin password.
# PREREQUISITE: 1Password item `automation-orchestrator-admin-password` in the
# `lab_aap` vault with a `password` field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: automation-orchestrator-admin-password
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-aap
  target:
    name: automation-orchestrator-admin-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        password: "{{ .password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: automation-orchestrator-admin-password
        metadataPolicy: None
        nullBytePolicy: Ignore
