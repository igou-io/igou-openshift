---
# Temporal database credentials, shared by two consumers:
#   - the CNPG managed role `temporal` (passwordSecret; reads username/password)
#   - the AutomationOrchestrator CR spec.postgres.temporalDatabase.secretRef
#     (reads database/username/password). The operator reuses these
#     credentials for the temporal_visibility database.
# PREREQUISITE: 1Password item `temporal-pg-credentials` in the
# `lab_openshift` vault with fields username=temporal and password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-pg-credentials
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: temporal-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        database: temporal
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: temporal-pg-credentials
        metadataPolicy: None
        nullBytePolicy: Ignore
