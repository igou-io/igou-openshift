---
# Automation orchestrator 2026.8 (standalone deployment model, bring-your-own
# PostgreSQL via the orchestrator-pg CNPG cluster in this directory). AAP
# integration (OIDC via the gateway + job dispatch to controller) is a day-2
# configuration done in the application, not in this CR.
apiVersion: aap.ansible.com/v1alpha1
kind: AutomationOrchestrator
metadata:
  name: automation-orchestrator
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  postgres:
    host: orchestrator-pg-rw
    port: 5432
    # verify-ca (not verify-full): the CNPG-issued server cert is trusted via
    # the cluster CA below; matches the aapctl CloudNativePG template.
    sslMode: verify-ca
    caCertSecretRef:
      name: orchestrator-pg-ca # CNPG-generated cluster CA (key ca.crt)
    backendDatabase:
      secretRef:
        name: orchestrator-pg-credentials
    temporalDatabase:
      # Also used for the temporal_visibility database.
      secretRef:
        name: temporal-pg-credentials
  ingress:
    type: Route
    host: orchestrator.apps.ocp.igou.systems
  # File uploads land in the orchestrator-files bucket on rustfs-cold
  # (declared in igou-inventory host_vars/rustfs-cold.yml). Without this
  # section the operator omits file storage and uploads return HTTP 503.
  fileStorage:
    endpointURL: https://truenas.igou.systems:20292
    bucketName: orchestrator-files
    region: us-east-1 # operator default; RustFS ignores region but the field is signed
    verifySSL: true # endpoint presents a CA-trusted certificate
    usePathStyle: true
    credentialSecretRef:
      name: orchestrator-files-s3-credentials
  secrets:
    initialAdminPasswordSecretRef:
      name: automation-orchestrator-admin-password
  # Outbound SSRF allowlist. The backend rejects any URL resolving to a
  # private IP (identity provider, integration health checks, and workflow
  # HTTP steps all ride the same guard), and every lab endpoint resolves
  # privately - so day-2 AAP SSO/dispatch and the llmkube LLM integrations
  # depend on these entries. Explicit hosts only (no wildcard support).
  workflowHttpRequestAllowedHosts:
    - automation.apps.ocp.igou.systems # AAP gateway: OIDC + job dispatch
    - gemma-4-e2b-llmkube-system.apps.ocp.igou.systems
    - qwen3-35b-a3b-llmkube-system.apps.ocp.igou.systems
    - qwen35-2b-llmkube-system.apps.ocp.igou.systems
    - qwen38-27b-llmkube-system.apps.ocp.igou.systems
    - truenas.igou.systems # rustfs S3 + REST steps (backup verification)
  # Single-replica sizing for the one always-on control-plane node; the
  # operator defaults are 2 backend / 2 UI / 2 worker. The background worker
  # keeps its default HPA (1-5 replicas on CPU) and Redis is fixed at 1.
  backend:
    replicas: 1
  ui:
    replicas: 1
  worker:
    replicas: 1
  temporal:
    server:
      replicas: 1
