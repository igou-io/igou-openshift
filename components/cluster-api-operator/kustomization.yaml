apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - capi-operator-system-namespace.yaml
  - capi-system-namespace.yaml
  - capm3-system-namespace.yaml
  - cluster-api-coreprovider.yaml
  - metal3-infrastructureprovider.yaml
  - metal3-ipamprovider.yaml
  - capi-manager-scc-nonroot-v2-rolebinding.yaml
  - capm3-manager-scc-nonroot-v2-rolebinding.yaml
  - ipam-manager-scc-nonroot-v2-rolebinding.yaml
  - system-openshift-controller-machine-approver-capi-clusterrole.yaml
  - system-openshift-controller-machine-approver-capi-clusterrolebinding.yaml
  - capi-workload-cluster-access-clusterrole.yaml
  - capi-workload-cluster-access-clusterrolebinding.yaml

helmCharts:
  - name: cluster-api-operator
    releaseName: capi-operator
    namespace: capi-operator-system
    version: 0.29.0
    repo: https://kubernetes-sigs.github.io/cluster-api-operator
    includeCRDs: true
    valuesInline:
      # Recreate: pinned to the single control-plane node, which runs at
      # ~99% CPU requests — a RollingUpdate surge pod can never schedule
      # and chart upgrades wedge with the new pod Pending.
      strategy:
        type: Recreate
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
