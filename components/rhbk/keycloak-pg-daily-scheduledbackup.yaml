---
# Nightly full backup of keycloak-pg via the Barman Cloud Plugin (staggered
# 04:15, after rhdh-pg's 03:45). Wave 11 so it lands after the Cluster
# (wave 10) it references.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-pg-daily
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '11'
spec:
  schedule: "0 15 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
