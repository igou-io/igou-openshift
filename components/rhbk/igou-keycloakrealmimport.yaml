---
# One-shot declarative import of the `igou` realm: OIDC clients for OpenShift,
# supported applications, RHDH and OpenShell, the RHDH service account (read roles for the
# keycloakOrg catalog provider), human and agent users, groups, and realm roles.
#
# NOTE: KeycloakRealmImport is import-only — it runs once and does NOT
# reconcile an existing realm. Later realm changes made here require either a
# new realm name or manual admin-console alignment.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: igou
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '12'
spec:
  keycloakCRName: keycloak
  placeholders:
    CWA_CLIENT_SECRET:
      secret:
        name: keycloak-application-secrets
        key: CWA_CLIENT_SECRET
    FORGEJO_CLIENT_SECRET:
      secret:
        name: keycloak-application-secrets
        key: FORGEJO_CLIENT_SECRET
    QUAY_CLIENT_SECRET:
      secret:
        name: keycloak-application-secrets
        key: QUAY_CLIENT_SECRET
    SHELFMARK_CLIENT_SECRET:
      secret:
        name: keycloak-application-secrets
        key: SHELFMARK_CLIENT_SECRET
    AAP_CLIENT_SECRET:
      secret:
        name: keycloak-aap-secret
        key: AAP_CLIENT_SECRET
    OPENSHIFT_CLIENT_SECRET:
      secret:
        name: keycloak-openshift-secret
        key: OPENSHIFT_CLIENT_SECRET
    RHDH_CLIENT_SECRET:
      secret:
        name: keycloak-realm-secrets
        key: RHDH_CLIENT_SECRET
    IGOU_TEMP_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: IGOU_TEMP_PASSWORD
    DEV1_TEMP_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: DEV1_TEMP_PASSWORD
    AGENTS_TEMP_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: AGENTS_TEMP_PASSWORD
    ACP_CLIENT_SECRET:
      secret:
        name: keycloak-realm-secrets
        key: ACP_CLIENT_SECRET
  realm:
    id: igou
    realm: igou
    displayName: Igou Lab
    enabled: true
    registrationAllowed: false
    resetPasswordAllowed: false
    bruteForceProtected: true
    # Explicit clientScopes otherwise suppress Keycloak's built-in scopes on import.
    attributes:
      CreateDefaultClientScopes: 'true'
    clientScopes:
      - name: groups
        description: Optional group scope requested by Shelfmark
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'true'
          display.on.consent.screen: 'false'
    roles:
      realm:
        - name: openshell-admin
          description: OpenShell platform administrator
        - name: openshell-user
          description: OpenShell workspace user
    clients:
      - clientId: calibre-web-automated
        name: Calibre-Web Automated
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${CWA_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://calibre-web-automated.apps.ocp.igou.systems/login/generic/authorized
        defaultClientScopes:
          - profile
          - email
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: 'false'
              id.token.claim: 'true'
              access.token.claim: 'false'
              userinfo.token.claim: 'true'
      - clientId: forgejo
        name: Forgejo
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${FORGEJO_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://forgejo.apps.ocp.igou.systems/user/oauth2/keycloak/callback
        defaultClientScopes:
          - profile
          - email
      - clientId: quay
        name: Quay
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${QUAY_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://quay.apps.ocp.igou.systems/oauth2/keycloak/callback
          - https://quay.apps.ocp.igou.systems/oauth2/keycloak/callback/attach
          - https://quay.apps.ocp.igou.systems/oauth2/keycloak/callback/cli
        defaultClientScopes:
          - profile
          - email
      - clientId: shelfmark
        name: Shelfmark
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${SHELFMARK_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://shelfmark.apps.ocp.igou.systems/api/auth/oidc/callback
        defaultClientScopes:
          - profile
          - email
        optionalClientScopes:
          - groups
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: 'false'
              id.token.claim: 'true'
              access.token.claim: 'false'
              userinfo.token.claim: 'true'
      - clientId: aap
        name: Ansible Automation Platform
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${AAP_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://automation.apps.ocp.igou.systems/api/gateway/social/complete/keycloak/
        defaultClientScopes:
          - profile
          - email
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: 'false'
              id.token.claim: 'true'
              access.token.claim: 'false'
              userinfo.token.claim: 'true'
      - clientId: openshift
        name: OpenShift
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${OPENSHIFT_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://oauth-openshift.apps.ocp.igou.systems/oauth2callback/keycloak
        defaultClientScopes:
          - profile
          - email
      - clientId: rhdh
        name: Red Hat Developer Hub
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${RHDH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        # Service account used by the RHDH keycloakOrg catalog provider
        # (client-credentials grant) to read users/groups.
        serviceAccountsEnabled: true
        redirectUris:
          - https://rhdh.apps.ocp.igou.systems/api/auth/oidc/handler/frame
        webOrigins:
          - https://rhdh.apps.ocp.igou.systems
      - clientId: openshell-cli
        name: OpenShell CLI
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - http://127.0.0.1:*/callback
        attributes:
          pkce.code.challenge.method: S256
          oauth2.device.authorization.grant.enabled: 'true'
        protocolMappers:
          - name: openshell-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: openshell-cli
              access.token.claim: 'true'
    groups:
      - name: admins
      # RHDH RBAC binds group:default/developers to role:default/developer
      # (rbac-policies ConfigMap in components/rhdh). dev1 is the example
      # POC-persona login. NOTE: group + user were ALSO created live via the
      # admin API on 2026-07-31 (realm import never reconciles) — this block
      # keeps the bootstrap record complete for a from-scratch re-import.
      - name: developers
    users:
      - username: service-account-rhdh
        enabled: true
        serviceAccountClientId: rhdh
        clientRoles:
          realm-management:
            - view-users
            - query-users
            - query-groups
      - username: igou
        enabled: true
        firstName: David
        lastName: Igou
        email: igou.david@gmail.com
        emailVerified: true
        groups:
          - /admins
        realmRoles:
          - openshell-admin
        credentials:
          - type: password
            value: "${IGOU_TEMP_PASSWORD}"
            temporary: true
      - username: dev1
        enabled: true
        firstName: Example
        lastName: Developer
        email: dev1@igou.systems
        emailVerified: true
        groups:
          - /developers
        credentials:
          - type: password
            value: "${DEV1_TEMP_PASSWORD}"
            temporary: true
      # Machine persona for AI agents scaffolding via the golden-path skill.
      # Same developer role as dev1; Forgejo counterpart is the `agents` user
      # (lab_forgejo/agents-forgejo). Created live via the admin API
      # 2026-08-13 — this block keeps the bootstrap record complete.
      - username: agents
        enabled: true
        firstName: Lab
        lastName: Agents
        email: agents@igou.systems
        emailVerified: true
        groups:
          - /developers
        credentials:
          - type: password
            value: "${AGENTS_TEMP_PASSWORD}"
            temporary: false
