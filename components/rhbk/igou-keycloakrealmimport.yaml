---
# One-shot declarative import of the `igou` realm: the rhdh OIDC client, its
# service account (realm-management read roles for the keycloakOrg catalog
# provider), the human user, and an admins group.
#
# NOTE: KeycloakRealmImport is import-only — it runs once and does NOT
# reconcile an existing realm. Later realm changes made here require either a
# new realm name or manual admin-console alignment.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: igou
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '12'
spec:
  keycloakCRName: keycloak
  placeholders:
    RHDH_CLIENT_SECRET:
      secret:
        name: keycloak-realm-secrets
        key: RHDH_CLIENT_SECRET
    IGOU_TEMP_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: IGOU_TEMP_PASSWORD
    DEV1_TEMP_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: DEV1_TEMP_PASSWORD
  realm:
    id: igou
    realm: igou
    displayName: Igou Lab
    enabled: true
    registrationAllowed: false
    resetPasswordAllowed: false
    bruteForceProtected: true
    clients:
      - clientId: rhdh
        name: Red Hat Developer Hub
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${RHDH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        # Service account used by the RHDH keycloakOrg catalog provider
        # (client-credentials grant) to read users/groups.
        serviceAccountsEnabled: true
        redirectUris:
          - https://rhdh.apps.ocp.igou.systems/api/auth/oidc/handler/frame
        webOrigins:
          - https://rhdh.apps.ocp.igou.systems
    groups:
      - name: admins
      # RHDH RBAC binds group:default/developers to role:default/developer
      # (rbac-policies ConfigMap in components/rhdh). dev1 is the example
      # POC-persona login. NOTE: group + user were ALSO created live via the
      # admin API on 2026-07-31 (realm import never reconciles) — this block
      # keeps the bootstrap record complete for a from-scratch re-import.
      - name: developers
    users:
      - username: service-account-rhdh
        enabled: true
        serviceAccountClientId: rhdh
        clientRoles:
          realm-management:
            - view-users
            - query-users
            - query-groups
      - username: igou
        enabled: true
        firstName: David
        lastName: Igou
        email: igou.david@gmail.com
        emailVerified: true
        groups:
          - /admins
        credentials:
          - type: password
            value: "${IGOU_TEMP_PASSWORD}"
            temporary: true
      - username: dev1
        enabled: true
        firstName: Example
        lastName: Developer
        email: dev1@igou.systems
        emailVerified: true
        groups:
          - /developers
        credentials:
          - type: password
            value: "${DEV1_TEMP_PASSWORD}"
            temporary: true
