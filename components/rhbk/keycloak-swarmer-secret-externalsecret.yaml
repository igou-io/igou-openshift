---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-swarmer-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: keycloak-swarmer-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SWARMER_OPENSHELL_CLIENT_SECRET: '{{ .OPENSHELL_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: swarmer
        metadataPolicy: None
        nullBytePolicy: Ignore
