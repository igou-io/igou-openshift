apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: keycloak-theme
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  runPolicy: SerialLatestOnly
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
  source:
    type: Dockerfile
    # Retain the realm's existing loginTheme ID; object names use keycloak-theme.
    dockerfile: |
      FROM registry.redhat.io/rhbk/keycloak-rhel9@sha256:b55a3fdf5c836cca9d6b754dd27adbd8de28a27ca46e7d205ceb6c0d7ae35ab9
      LABEL org.igou.theme-sha256="254537a490d858828632ef7f4259e417b8e0f0a1097da3a174980a36b46543ec"
      COPY --chown=1000:0 theme/theme.properties /opt/keycloak/themes/saturn/login/theme.properties
      COPY --chown=1000:0 theme/theme.css /opt/keycloak/themes/saturn/login/resources/css/theme.css
      COPY --chown=1000:0 theme/planet-dark.png theme/planet-light.png theme/favicon.ico /opt/keycloak/themes/saturn/login/resources/img/
      COPY --chown=1000:0 theme/messages_en.properties /opt/keycloak/themes/saturn/login/messages/messages_en.properties
      RUN chmod -R g+rX /opt/keycloak/themes/saturn && \
          /opt/keycloak/bin/kc.sh build --db=postgres --health-enabled=true --metrics-enabled=true
    configMaps:
    - configMap:
        name: keycloak-theme-assets
      destinationDir: theme
  strategy:
    type: Docker
    dockerStrategy:
      pullSecret:
        name: keycloak-theme-registry
  output:
    to:
      kind: DockerImage
      name: quay.apps.ocp.igou.systems/igou-io/keycloak-theme:26.6.7
    pushSecret:
      name: keycloak-theme-quay
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  triggers:
  - type: ConfigChange
