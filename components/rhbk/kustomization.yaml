---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - default-deny-networkpolicy.yaml
  - allow-required-networkpolicy.yaml
  - keycloak-namespace.yaml
  - rhbk-operatorgroup.yaml
  - rhbk-operator-subscription.yaml
  - keycloak-pg-credentials-externalsecret.yaml
  - keycloak-realm-secrets-externalsecret.yaml
  - keycloak-user-user-externalsecret.yaml
  - keycloak-openshift-secret-externalsecret.yaml
  - keycloak-application-secrets-externalsecret.yaml
  - keycloak-aap-secret-externalsecret.yaml
  - cnpg-s3-credentials-externalsecret.yaml
  - keycloak-pg-backup-objectstore.yaml
  - keycloak-pg-cluster.yaml
  - keycloak-pg-daily-scheduledbackup.yaml
  - keycloak-tls-certificate.yaml
  - keycloak-keycloak.yaml
  - igou-keycloakrealmimport.yaml
  - saturn-rhbk-registry-externalsecret.yaml
  - saturn-keycloak-imagestream.yaml
  - saturn-keycloak-buildconfig.yaml

configMapGenerator:
- name: saturn-keycloak-theme
  namespace: keycloak
  files:
  - saturn-theme/favicon.ico
  - saturn-theme/messages_en.properties
  - saturn-theme/saturn-logo-dark.png
  - saturn-theme/saturn-logo-light.png
  - saturn-theme/saturn.css
  - saturn-theme/theme.properties
  options:
    disableNameSuffixHash: true
    annotations:
      argocd.argoproj.io/sync-wave: '9'
