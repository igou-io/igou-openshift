---
# AAP CaC reads this same item directly from its owning lab_aap vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-aap-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-aap
  target:
    name: keycloak-aap-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AAP_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: aap-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
