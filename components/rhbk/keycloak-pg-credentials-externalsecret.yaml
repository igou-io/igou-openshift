---
# Bootstrap credentials for the keycloak-pg CNPG cluster and the Keycloak CR
# db connection (usernameSecret/passwordSecret reference the same keys).
# PREREQUISITE: 1Password item `keycloak-pg-credentials` in the `lab_openshift` vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: keycloak-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: keycloak-pg-credentials
        metadataPolicy: None
        nullBytePolicy: Ignore
