apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saturn-rhbk-registry
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-lab-container-registries
    kind: ClusterSecretStore
  target:
    name: saturn-rhbk-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.redhat.io":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
  - secretKey: username
    remoteRef:
      key: redhat-registry
      property: username
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: redhat-registry
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
