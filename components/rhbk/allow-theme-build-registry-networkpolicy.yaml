apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-theme-build-registry
  namespace: keycloak
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        # Quay's Route uses the host-network router, so match its LAN IP.
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - port: 443
          protocol: TCP
