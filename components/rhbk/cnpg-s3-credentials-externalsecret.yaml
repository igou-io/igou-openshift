---
# S3 credentials for the CNPG Barman Cloud Plugin backups of keycloak-pg.
# Wave 9 so the secret exists before the Cluster (wave 10) starts with the
# barman sidecar that needs it to archive WAL.
# PREREQUISITE: 1Password item `cnpg-s3-backup` in the s3 vault (shared with rhdh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: cnpg-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        ACCESS_SECRET_KEY: "{{ .secret_access_key }}"
  dataFrom:
    - extract:
        key: cnpg-s3-backup
        # API-defaulted fields, declared so ArgoCD (SSA) stays Synced
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
