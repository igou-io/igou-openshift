---
# Placeholder values for the igou KeycloakRealmImport: the rhdh client secret
# and the initial (temporary) password for the human user. Sourced from the
# same 1Password item the rhdh namespace consumes, so both sides of the OIDC
# handshake always agree on the client secret.
# PREREQUISITE: 1Password item `rhdh-keycloak` in the `lab_openshift` vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RHDH_CLIENT_SECRET: "{{ .client_secret }}"
        IGOU_TEMP_PASSWORD: "{{ .user_temp_password }}"
        DEV1_TEMP_PASSWORD: "{{ .dev1_temp_password }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: rhdh-keycloak
        metadataPolicy: None
        nullBytePolicy: Ignore
