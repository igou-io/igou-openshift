---
# Bootstrap credentials only; live clients must be provisioned before rollout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-application-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: keycloak-application-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        FORGEJO_CLIENT_SECRET: "{{ .forgejo_client_secret }}"
        QUAY_CLIENT_SECRET: "{{ .quay_client_secret }}"
        SHELFMARK_CLIENT_SECRET: "{{ .shelfmark_client_secret }}"
        CWA_CLIENT_SECRET: "{{ .cwa_client_secret }}"
  dataFrom:
    - extract:
        key: calibre-web-automated-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      rewrite:
        - regexp:
            source: "(.*)"
            target: "cwa_$1"
    - extract:
        key: forgejo-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      rewrite:
        - regexp:
            source: "(.*)"
            target: "forgejo_$1"
    - extract:
        key: quay-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      rewrite:
        - regexp:
            source: "(.*)"
            target: "quay_$1"
    - extract:
        key: shelfmark-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      rewrite:
        - regexp:
            source: "(.*)"
            target: "shelfmark_$1"
