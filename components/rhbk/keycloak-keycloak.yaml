---
# Red Hat build of Keycloak instance. The operator renders a StatefulSet and,
# with ingress enabled on OpenShift, a passthrough Route for the hostname.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '11'
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-pg-rw.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-pg-credentials
      key: username
    passwordSecret:
      name: keycloak-pg-credentials
      key: password
  http:
    tlsSecret: keycloak-tls
  hostname:
    hostname: keycloak.apps.ocp.igou.systems
  ingress:
    enabled: true
    # Without a class the ingress-to-route controller still admits it but
    # fires IngressWithoutClassName after 24h (igou-inventory#306).
    className: openshift-default
  # Expose /metrics on the management interface (:9000); the operator then
  # creates a ServiceMonitor for UWM (netpol opens 9000 to UWM).
  additionalOptions:
    - name: metrics-enabled
      value: 'true'
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
  # Prefer dedicated workers. ocp is also labeled worker, so exclude
  # control-plane rather than selecting worker. Soft: still schedules on
  # the master if workers are full or drained.
  scheduling:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
