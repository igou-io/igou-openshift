---
# Shared client credential with openshift-config; create the backing item
# and the client in the existing realm before enabling the OAuth provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-openshift-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: keycloak-openshift-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OPENSHIFT_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: openshift-keycloak
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
