apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-registry
  namespace: keycloak
spec:
  podSelector:
    matchExpressions:
      - key: openshift.io/build.name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
          podSelector:
            matchLabels:
              docker-registry: default
      ports:
        - port: 5000
          protocol: TCP
