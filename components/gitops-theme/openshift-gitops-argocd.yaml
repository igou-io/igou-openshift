apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  extraConfig:
    ui.cssurl: ./custom/theme.css
  server:
    volumes:
      - name: gitops-theme
        configMap:
          name: gitops-theme-assets
    volumeMounts:
      - name: gitops-theme
        mountPath: /shared/app/custom
        readOnly: true
