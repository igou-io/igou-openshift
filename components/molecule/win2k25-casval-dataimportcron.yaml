---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataImportCron
metadata:
  name: win2k25-casval
  namespace: openshift-virtualization-os-images
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    molecule.igou.systems/image-cache: casval
spec:
  schedule: '21 * * * *'
  managedDataSource: win2k25-casval
  importsToKeep: 1
  garbageCollect: Outdated
  retentionPolicy: None
  template:
    spec:
      source:
        pvc:
          name: win2k25
          namespace: openshift-virtualization-os-images
      storage:
        storageClassName: lvms-casval
        accessModes:
          - ReadWriteOnce
        volumeMode: Block
        resources:
          requests:
            storage: 50Gi
