---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cluster-apps-sensitive-host-mounts
  namespace: stackrox
spec:
  policyName: 'cluster-apps: Mounting Sensitive Host Directories'
  description: Clone of the built-in "Mounting Sensitive Host Directories" policy, scoped to the current cluster-apps project namespaces (#547).
  rationale: App workloads have no business mounting sensitive host paths.
  remediation: Remove the hostPath volume or move the workload out of the cluster-apps project.
  categories:
    - Security Best Practices
  severity: MEDIUM_SEVERITY
  lifecycleStages:
    - DEPLOY
  # Admission-only actions: inert while the SecuredCluster admissionControl
  # enforcement knob is Disabled; flipping that knob to Enabled is the single
  # switch that makes these block (see README).
  enforcementActions:
    - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
    - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT
  # API-managed Slack notifier (#548) -> #igoucloud-alerts-warning; referenced
  # by name, resolved by config-controller.
  notifiers:
    - slack-igoucloud-alerts
  # Static inventory of cluster-apps namespaces; update all six policies
  # when adding, moving, or retiring an application namespace.
  scope:
    - namespace: aap-portal
    - namespace: ace-step
    - namespace: ansible-automation-platform
    - namespace: ansible-collection-bench
    - namespace: automation-orchestrator
    - namespace: calibre-web
    - namespace: calibre-web-automated
    - namespace: comfyui
    - namespace: firecrawl
    - namespace: forgejo
    - namespace: gotify
    - namespace: hermes-assistant
    - namespace: hermes-developer
    - namespace: hermes-operator
    - namespace: hermes-sre
    - namespace: homepage
    - namespace: it-tools
    - namespace: jellyfin
    - namespace: llmkube-system
    - namespace: metube
    - namespace: openshell
    - namespace: qbittorrent
    - namespace: radarr
    - namespace: sands-of-time
    - namespace: searxng
    - namespace: shelfmark
    - namespace: so-crates
    - namespace: sonarr
    - namespace: squid-proxy
    - namespace: we-get-the-hydro
  policySections:
    - sectionName: Criteria
      policyGroups:
        - fieldName: Volume Source
          booleanOperator: OR
          values:
            - value: (/etc/.*|/sys/.*|/dev/.*|/proc/.*|/var/.*)
