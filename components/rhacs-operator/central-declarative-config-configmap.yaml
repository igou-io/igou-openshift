---
apiVersion: v1
kind: ConfigMap
metadata:
  name: central-declarative-config
  namespace: stackrox
data:
  # Declarative auth (#546): OpenShift OAuth login for Central. The operator
  # does not auto-create an OpenShift auth provider; htpasswd basic auth
  # (admin + central-htpasswd secret) stays as break-glass.
  # Schema: stackrox pkg/declarativeconfig (verified against tag 4.11.1).
  auth-providers.yaml: |
    name: OpenShift
    minimumRole: None
    uiEndpoint: central-stackrox.apps.ocp.igou.systems
    extraUIEndpoints:
      - central-stackrox.apps.ocp.igou.systems:443
    groups:
      - key: groups
        value: global-admins
        role: Admin
      - key: name
        value: user
        role: Analyst
    openshift:
      enable: true
  # Dedicated analyst identity: existing inventory and findings only. No
  # image scan, enforcement, suppression, integration, token or access writes.
  hermes-secops-permission-set.yaml: |
    name: hermes-secops-reader
    description: Existing vulnerability and policy evidence for Hermes SecOps
    resources:
      - resource: Image
        access: READ_ACCESS
      - resource: Deployment
        access: READ_ACCESS
      - resource: WorkflowAdministration
        access: READ_ACCESS
      - resource: CVE
        access: READ_ACCESS
      - resource: Alert
        access: READ_ACCESS
      - resource: Cluster
        access: READ_ACCESS
      - resource: Namespace
        access: READ_ACCESS
      - resource: Node
        access: READ_ACCESS
  hermes-secops-role.yaml: |
    name: hermes-secops-reader
    description: Read security evidence across clusters already ingested by Central
    permissionSet: hermes-secops-reader
    accessScope: Unrestricted
