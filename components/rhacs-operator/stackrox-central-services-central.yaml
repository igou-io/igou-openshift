---
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  monitoring:
    openshift:
      enabled: true
  central:
    telemetry:
      enabled: false
    declarativeConfiguration:
      configMaps:
        - name: central-declarative-config
    exposure:
      route:
        enabled: true
        # Keep passthrough and reencrypt hosts distinct. Sensor mTLS still
        # uses the operator's separate central.stackrox passthrough route.
        host: central-passthrough-stackrox.apps.ocp.igou.systems
        reencrypt:
          enabled: true
          host: central-stackrox.apps.ocp.igou.systems
          # Omit frontend TLS material to use the router's acme-apps cert.
          # The operator supplies Central's CA for backend verification.
    # Placement: unpinned. The #381 phase-1 hostname pins to truenas-w1 are
    # gone — that VM worker is destroyed/rebuilt by the lifecycle workflow,
    # so pinning to it strands everything Pending (18h RHACS outage
    # 2026-07-31). The scheduler places freely now.
    # Requests are sized from the phase-1 7-day p50/p95 measurement (#381).
    resources:
      requests:
        cpu: 50m
        memory: 1536Mi
      limits:
        memory: 4Gi
    db:
      persistence:
        persistentVolumeClaim:
          size: 40Gi
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 4Gi
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 640Mi
        limits:
          memory: 3Gi
    db:
      resources:
        requests:
          cpu: 200m
          # Steady-state working set is ~2Gi flat (p50 1946Mi / p95 2007Mi);
          # the original 2Gi limit left effectively zero headroom.
          memory: 2Gi
        limits:
          memory: 3Gi
  scannerV4:
    scannerComponent: Enabled
    # One indexer/matcher for the lab, with RHACS 4.11 per-container defaults.
    # Keep the legacy scanner above: Central still depends on it in 4.11.
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 1500m
          memory: 512Mi
        limits:
          cpu: '4'
          memory: 3Gi
    matcher:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1536Mi
        limits:
          cpu: '1'
          memory: 3Gi
    db:
      persistence:
        persistentVolumeClaim:
          size: 50Gi
          storageClassName: freenas-nvmeof-ssd-csi
      resources:
        requests:
          cpu: '1'
          memory: 4Gi
        limits:
          cpu: '4'
          memory: 8Gi
