---
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  monitoring:
    openshift:
      enabled: true
  central:
    telemetry:
      enabled: false
    declarativeConfiguration:
      configMaps:
        - name: central-declarative-config
    exposure:
      route:
        enabled: true
    # Placement: unpinned. The #381 phase-1 hostname pins to truenas-w1 are
    # gone — that VM worker is destroyed/rebuilt by the lifecycle workflow,
    # so pinning to it strands everything Pending (18h RHACS outage
    # 2026-07-31). The scheduler places freely now.
    # Requests are sized from the phase-1 7-day p50/p95 measurement (#381).
    resources:
      requests:
        cpu: 50m
        memory: 1536Mi
      limits:
        memory: 4Gi
    db:
      persistence:
        persistentVolumeClaim:
          size: 40Gi
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 4Gi
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 640Mi
        limits:
          memory: 3Gi
    db:
      resources:
        requests:
          cpu: 200m
          # Steady-state working set is ~2Gi flat (p50 1946Mi / p95 2007Mi);
          # the original 2Gi limit left effectively zero headroom.
          memory: 2Gi
        limits:
          memory: 3Gi
  scannerV4:
    # REQUIRED for the minimal footprint: new installs since 4.8 default to
    # Enabled/AutoSense.
    scannerComponent: Disabled
