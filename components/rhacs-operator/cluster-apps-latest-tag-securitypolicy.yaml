---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cluster-apps-latest-tag
  namespace: stackrox
spec:
  policyName: 'cluster-apps: Latest tag'
  description: Clone of the built-in "Latest tag" policy, scoped to the current cluster-apps project namespaces (#559).
  rationale: A mutable latest tag can change without a manifest update; prefer version tags or digest-only references.
  remediation: Pin the image to a version tag or digest-only reference (repo@sha256:...); Renovate tracks digest bumps.
  categories:
    - DevOps Best Practices
    - Supply Chain Security
  severity: LOW_SEVERITY
  lifecycleStages:
    - DEPLOY
  # Admission-only actions: inert while the SecuredCluster admissionControl
  # enforcement knob is Disabled; flipping that knob to Enabled is the single
  # switch that makes these block (see README).
  enforcementActions:
    - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
    - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT
  # API-managed Slack notifier (#548) -> #igoucloud-alerts-warning; referenced
  # by name, resolved by config-controller.
  notifiers:
    - slack-igoucloud-alerts
  # Static inventory of cluster-apps namespaces; update all six policies
  # when adding, moving, or retiring an application namespace.
  scope:
    - namespace: aap-portal
    - namespace: ace-step
    - namespace: ansible-automation-platform
    - namespace: ansible-collection-bench
    - namespace: automation-orchestrator
    - namespace: calibre-web
    - namespace: calibre-web-automated
    - namespace: comfyui
    - namespace: firecrawl
    - namespace: forgejo
    - namespace: gotify
    - namespace: hermes-assistant
    - namespace: hermes-developer
    - namespace: hermes-operator
    - namespace: hermes-sre
    - namespace: homepage
    - namespace: it-tools
    - namespace: jellyfin
    - namespace: llmkube-system
    - namespace: metube
    - namespace: openshell
    - namespace: qbittorrent
    - namespace: radarr
    - namespace: sands-of-time
    - namespace: searxng
    - namespace: shelfmark
    - namespace: so-crates
    - namespace: sonarr
    - namespace: squid-proxy
    - namespace: we-get-the-hydro
  # AAP execution/decision environments are rebuilt and pushed to :latest by
  # design (igou-inventory group_vars/aap/execution_environments.yml + eda.yml)
  # and run as transient automation-job/activation-job pods; excluded rather
  # than pinned.
  exclusions:
    - name: AAP controller job pods (EE images track latest by design)
      deployment:
        name: automation-job.*
        scope:
          namespace: ansible-automation-platform
    - name: EDA activation pods (DE images track latest by design)
      deployment:
        name: activation-job.*
        scope:
          namespace: ansible-automation-platform
    # Reviewed igou-devenv references retain :latest but pin the image digest.
    # Exclusions apply to these workloads, not to the entire Hermes namespaces.
    - name: Hermes SRE helpers and relay (reviewed digest-pinned latest)
      deployment:
        name: ^(auth-login|hermes-sre|igou-docs-sync|sre-heartbeat)$
        scope:
          namespace: ^hermes-sre$
    - name: Hermes developer auth helper (reviewed digest-pinned latest)
      deployment:
        name: ^auth-login$
        scope:
          namespace: ^hermes-developer$
  policySections:
    - sectionName: Criteria
      policyGroups:
        - fieldName: Image Tag
          booleanOperator: OR
          values:
            - value: latest
