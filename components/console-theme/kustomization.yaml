apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cluster-console.yaml
configMapGenerator:
- name: console-theme
  namespace: openshift-config
  files:
  - assets/masthead-dark.svg
  - assets/masthead-light.svg
  - assets/favicon.svg
  options:
    disableNameSuffixHash: true
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
