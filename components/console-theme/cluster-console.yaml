apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
spec:
  customization:
    customProductName: OpenShift - igou.systems
    logos:
    - type: Masthead
      themes:
      - mode: Light
        source:
          from: ConfigMap
          configMap:
            name: console-theme
            key: masthead-light.svg
      - mode: Dark
        source:
          from: ConfigMap
          configMap:
            name: console-theme
            key: masthead-dark.svg
    - type: Favicon
      themes:
      - mode: Light
        source:
          from: ConfigMap
          configMap:
            name: console-theme
            key: favicon.svg
      - mode: Dark
        source:
          from: ConfigMap
          configMap:
            name: console-theme
            key: favicon.svg
