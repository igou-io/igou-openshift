---
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: rhdh-developer-hub
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '11'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deployment:
    patch:
      spec:
        template:
          spec:
            serviceAccountName: rhdh-public-sharing
            containers:
              - name: backstage-backend
                volumeMounts:
                  - name: public-sharing-ocp-reader
                    mountPath: /var/run/public-sharing/ocp
                    readOnly: true
                  - name: public-sharing-vps-reader
                    mountPath: /var/run/public-sharing/vps
                    readOnly: true
            volumes:
              - name: public-sharing-ocp-reader
                projected:
                  sources:
                    - serviceAccountToken:
                        path: token
                        expirationSeconds: 3600
                    - configMap:
                        name: kube-root-ca.crt
                        items:
                          - key: ca.crt
                            path: ca.crt
              - name: public-sharing-vps-reader
                secret:
                  secretName: rhdh-public-sharing-reader
  database:
    enableLocalDb: false
  monitoring:
    enabled: true
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh
        - name: saturn-branding
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rbac-policies
        - name: catalog-templates
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    route:
      host: rhdh.apps.ocp.igou.systems
    extraEnvs:
      secrets:
        - name: rhdh-postgres-credentials
        - name: rhdh-backend-secret
        - name: rhdh-keycloak-credentials
        - name: rhdh-forgejo-credentials
        - name: rhdh-github-app
        - name: rhdh-public-sharing-oauth
