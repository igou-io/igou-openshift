---
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: rhdh-developer-hub
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '11'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  deployment:
    patch:
      spec:
        template:
          spec:
            serviceAccountName: rhdh-public-sharing
  database:
    enableLocalDb: false
  monitoring:
    enabled: true
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rbac-policies
        - name: catalog-templates
      secrets:
        - name: rhdh-public-sharing-reader
          key: public-sharing-vps-token
        - name: rhdh-public-sharing-reader
          key: public-sharing-vps-ca.crt
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    route:
      host: rhdh.apps.ocp.igou.systems
    extraEnvs:
      secrets:
        - name: rhdh-postgres-credentials
        - name: rhdh-backend-secret
        - name: rhdh-keycloak-credentials
        - name: rhdh-forgejo-credentials
        - name: rhdh-github-app
        - name: rhdh-public-sharing-oauth
