---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://rhdh.apps.ocp.igou.systems
    # RHBK (Keycloak) is the sign-in provider; `production` removes the Guest
    # login option. The single resolver matches the Keycloak username against
    # the user entities the keycloakOrg catalog provider provisions below —
    # no dangerouslyAllowSignInWithoutUserInCatalog, so only provisioned realm
    # users can sign in.
    signInPage: oidc
    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: https://keycloak.apps.ocp.igou.systems/realms/igou
            clientId: rhdh
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
    # RBAC: igou is policy admin + superUser (unrestricted); everyone else
    # only gets what rbac-policies.csv grants (default deny). The example
    # `developer` role for POC personas lives in the rbac-policies ConfigMap.
    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/igou
          superUsers:
            - name: user:default/igou
        pluginsWithPermission:
          - catalog
          - scaffolder
          - permission
        policies-csv-file: /opt/app-root/src/rbac-policies.csv
        policyFileReload: true
    # Forgejo speaks the Gitea API/URL scheme; this integration lets the
    # catalog read catalog-info.yaml from forgejo repos (scaffolder register).
    integrations:
      gitea:
        - host: forgejo.apps.ocp.igou.systems
          username: ${FORGEJO_USERNAME}
          password: ${FORGEJO_TOKEN}
      # igou-dev GitHub App: publish:github golden-path destination + catalog
      # reads of github.com catalog-info. Installed on igou-io and david-igou
      # with administration:write (repo creation); repos an App creates are
      # auto-added to its installation selection.
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              # Required by the config reader but only consumed by GitHub
              # OAuth user sign-in (not configured here) — the 1P field holds
              # a labeled placeholder. App auth uses appId+privateKey only.
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
    # Backend proxy used by the http:backstage:request scaffolder action to
    # call the Forgejo API with the machine token. POST = template generate;
    # DELETE = removing the sandbox staging repo on the GitHub destination
    # path (the machine token can only touch org repos it owns).
    proxy:
      endpoints:
        '/forgejo':
          target: https://forgejo.apps.ocp.igou.systems/api/v1
          allowedMethods:
            - POST
            - DELETE
          headers:
            Authorization: token ${FORGEJO_TOKEN}
        # Benchmark launcher: POSTs land on the collection-bench Tekton
        # EventListener, which renders a PipelineRun (one trial).
        '/bench-trigger':
          target: http://el-collection-bench.ansible-collection-bench.svc:8080
          allowedMethods:
            - POST
    catalog:
      locations:
        # Scaffolder templates shipped via the catalog-templates ConfigMap
        # (extraFiles mount). Location-scoped rules so the global catalog
        # rules (and keycloakOrg User/Group ingestion) stay untouched.
        - type: file
          target: /opt/app-root/src/ansible-collection-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/benchmark-run-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/ansible-role-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/ansible-project-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/helm-chart-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/go-app-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/gitops-cluster-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/python-app-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/gitops-component-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/container-image-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/mcp-server-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/aap-job-template-template.yaml
          rules:
            - allow:
                - Template
        - type: file
          target: /opt/app-root/src/grafana-dashboard-template.yaml
          rules:
            - allow:
                - Template
      providers:
        # Provisions realm users/groups into the software catalog via the rhdh
        # client's service account (realm-management view/query roles).
        keycloakOrg:
          default:
            baseUrl: https://keycloak.apps.ocp.igou.systems
            clientId: rhdh
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            realm: igou
            loginRealm: igou
            schedule:
              frequency:
                minutes: 30
              timeout:
                minutes: 3
              initialDelay:
                seconds: 15
    backend:
      baseUrl: https://rhdh.apps.ocp.igou.systems
      cors:
        origin: https://rhdh.apps.ocp.igou.systems
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
      database:
        client: pg
        # Backstage's default `database` plugin-division mode runs
        # CREATE DATABASE per plugin, which requires CREATEDB on the
        # role. CNPG's bootstrap-created role doesn't have it. Switch
        # to `schema` so each plugin gets its own schema inside the
        # already-owned `backstage` database — no extra privileges
        # needed.
        pluginDivisionMode: schema
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
