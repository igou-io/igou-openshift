---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub
      baseUrl: https://rhdh.apps.ocp.igou.systems
    # RHBK (Keycloak) is the sign-in provider; `production` removes the Guest
    # login option. The single resolver matches the Keycloak username against
    # the user entities the keycloakOrg catalog provider provisions below —
    # no dangerouslyAllowSignInWithoutUserInCatalog, so only provisioned realm
    # users can sign in.
    signInPage: oidc
    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: https://keycloak.apps.ocp.igou.systems/realms/igou
            clientId: rhdh
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
    # RBAC: igou is policy admin + superUser (unrestricted); everyone else
    # only gets what rbac-policies.csv grants (default deny). The example
    # `developer` role for POC personas lives in the rbac-policies ConfigMap.
    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/igou
          superUsers:
            - name: user:default/igou
        pluginsWithPermission:
          - catalog
          - scaffolder
          - permission
        policies-csv-file: /opt/app-root/src/rbac-policies.csv
        policyFileReload: true
    catalog:
      providers:
        # Provisions realm users/groups into the software catalog via the rhdh
        # client's service account (realm-management view/query roles).
        keycloakOrg:
          default:
            baseUrl: https://keycloak.apps.ocp.igou.systems
            clientId: rhdh
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            realm: igou
            loginRealm: igou
            schedule:
              frequency:
                minutes: 30
              timeout:
                minutes: 3
              initialDelay:
                seconds: 15
    backend:
      baseUrl: https://rhdh.apps.ocp.igou.systems
      cors:
        origin: https://rhdh.apps.ocp.igou.systems
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"
      database:
        client: pg
        # Backstage's default `database` plugin-division mode runs
        # CREATE DATABASE per plugin, which requires CREATEDB on the
        # role. CNPG's bootstrap-created role doesn't have it. Switch
        # to `schema` so each plugin gets its own schema inside the
        # already-owned `backstage` database — no extra privileges
        # needed.
        pluginDivisionMode: schema
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
