---
# igou-dev GitHub App credentials for the RHDH github integration: the
# publish:github scaffolder destination and catalog reads of github.com
# catalog-info.yaml. Same App the devcontainer ghapp CLI uses — rotating the
# App key means updating the 1P item AND the devcontainer key file.
# PREREQUISITE: 1Password item `rhdh-github-app` in the `lab_github` vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-github-app
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-github
  target:
    name: rhdh-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        GITHUB_APP_ID: "{{ .app_id }}"
        GITHUB_APP_CLIENT_ID: "{{ .client_id }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .private_key }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: rhdh-github-app
        metadataPolicy: None
        nullBytePolicy: Ignore
