---
# Default-deny (ingress + egress) for namespace rhdh. Allow policies below
# open exactly the flows observed via NetObserv eBPF sampling. Generated;
# review before merge (see PR body for methodology + caveats).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: rhdh
  annotations:
    # After the namespace (wave 8): CreateNamespace=false, so a wave-0 apply
    # into a not-yet-created namespace wedges a from-scratch sync.
    argocd.argoproj.io/sync-wave: '9'
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
