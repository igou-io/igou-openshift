---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-public-sharing-oauth
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-aap
  target:
    name: rhdh-public-sharing-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RHDH_PUBLIC_SHARING_CLIENT_ID: "{{ .client_id }}"
        RHDH_PUBLIC_SHARING_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: rhdh-public-sharing
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
