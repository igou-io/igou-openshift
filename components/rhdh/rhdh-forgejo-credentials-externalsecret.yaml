---
# Forgejo machine-user credentials for the scaffolder golden path: the gitea
# integration (catalog reads) and the /forgejo backend proxy (template
# generate API) both consume these env vars.
# PREREQUISITE: 1Password item `rhdh-forgejo` in the `lab_forgejo` vault
# (rhdh user, token scoped write:repository + write:organization + read:user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-forgejo-credentials
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-forgejo
  target:
    name: rhdh-forgejo-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        FORGEJO_USERNAME: "{{ .username }}"
        FORGEJO_TOKEN: "{{ .token }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: rhdh-forgejo
        metadataPolicy: None
        nullBytePolicy: Ignore
