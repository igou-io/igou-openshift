---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: ref://backstage-community-plugin-auth-backend-module-keycloak-provider
        enabled: true
      - package: ref://backstage-community-plugin-catalog-backend-module-keycloak
        enabled: true
      - package: ref://roadiehq-scaffolder-backend-module-http-request
        enabled: true
      - package: ref://backstage-community-plugin-rbac
        enabled: true
      - package: ref://backstage-plugin-scaffolder-backend-module-github
        enabled: true
      # Preserve the existing external analytics opt-out.
      - package: ref://backstage-community-plugin-analytics-provider-segment
        enabled: false
      - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant
        enabled: true
      - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
        enabled: true
      # RHDH 2.1 enables adoption analytics by default; retain the lab opt-out.
      - package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights
        enabled: false
      - package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights-backend
        enabled: false
      - package: ref://red-hat-developer-hub-backstage-plugin-analytics-module-adoption-insights
        enabled: false
