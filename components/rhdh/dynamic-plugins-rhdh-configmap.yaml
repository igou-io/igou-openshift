---
# Custom dynamic-plugins config, referenced by the Backstage CR. Setting
# dynamicPluginsConfigMapName REPLACES the operator-generated default
# ConfigMap, so the two lightspeed entries the 1.10 operator profile adds by
# default are carried over verbatim ({{inherit}} resolves the version from
# dynamic-plugins.default.yaml) to keep plugin parity.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Keycloak catalog provider: provisions igou realm users/groups into
      # the software catalog (config in app-config-rhdh).
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false
      # http:backstage:request scaffolder action — drives the Forgejo
      # template-generate API through the /forgejo backend proxy.
      - package: ./dynamic-plugins/dist/roadiehq-scaffolder-backend-module-http-request-dynamic
        disabled: false
      # RBAC frontend/backend (permission framework config in app-config-rhdh).
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false
      # publish:github scaffolder action — GitHub destination on the golden
      # paths (integrations.github App creds in app-config-rhdh).
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: false
      # Telemetry off — this lab does not phone home.
      - package: ./dynamic-plugins/dist/backstage-plugin-analytics-provider-segment
        disabled: true
      # Operator-profile defaults (lightspeed), preserved from the generated
      # default ConfigMap.
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed:{{inherit}}
        disabled: false
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed-backend:{{inherit}}
        disabled: false
