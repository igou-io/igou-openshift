---
# OIDC client secret + Backstage session secret, projected into the RHDH pod
# as env vars via the CR's extraEnvs. Shares the `rhdh-keycloak` 1Password
# item with the keycloak namespace's realm import, so both sides of the OIDC
# handshake always agree on the client secret.
# PREREQUISITE: 1Password item `rhdh-keycloak` in the `lab_openshift` vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-keycloak-credentials
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '9'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: rhdh-keycloak-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KEYCLOAK_CLIENT_SECRET: "{{ .client_secret }}"
        SESSION_SECRET: "{{ .session_secret }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: rhdh-keycloak
        metadataPolicy: None
        nullBytePolicy: Ignore
