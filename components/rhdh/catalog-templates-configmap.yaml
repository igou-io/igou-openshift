---
# Scaffolder Template entities, mounted via the CR's extraFiles and registered
# as file locations in app-config (rules allow Template).
#
# All templates share one shape and a destination dropdown:
#   sandbox      — Forgejo native template-generate (expansion) + register.
#   github-*     — RHDH 1.10 ships no gitea/forgejo publish module and
#                  regex:replace only transforms strings (not files), so the
#                  GitHub path STAGES through Forgejo's expander (generate
#                  into sandbox under the real name — expansion derives from
#                  the generated repo's name), fetches the expanded tree,
#                  deletes the staging repo, strips Dev Spaces artifacts
#                  (graduated GitHub repos use the devcontainer flow),
#                  rewrites catalog-info via catalog:write, then
#                  publish:github + register.
# Known warts on the GitHub path, accepted for v1: README/galaxy.yml may
# still reference forgejo sandbox URLs baked by the staging expansion.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-templates
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  ansible-collection-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: ansible-collection
      title: Ansible Collection
      description: >-
        Scaffold a new david_igou Ansible collection with a starter role, devfile, and catalog registration — ready to open in OpenShift Dev Spaces.
      tags:
        - ansible
        - forgejo
        - recommended
    spec:
      owner: group:default/admins
      type: ansible-collection
      parameters:
        - title: Ansible Collection details
          required:
            - name
            - description
          properties:
            name:
              title: Collection name
              type: string
              description: >-
                lower_snake_case; becomes the repo name and the galaxy collection name (david_igou.<name>)
              pattern: '^[a-z][a-z0-9_]{1,62}$'
            description:
              title: Description
              type: string
              description: One line on what this does
            destination:
              title: Destination
              type: string
              description: >-
                Forgejo sandbox is the POC space (Dev Spaces devfile kept);
                GitHub destinations create a graduated repo (Dev Spaces
                artifacts stripped, devcontainer workflow assumed)
              default: sandbox
              enum:
                - sandbox
                - github-igou-io
                - github-david-igou
              enumNames:
                - Forgejo sandbox (POC)
                - GitHub igou-io
                - GitHub david-igou
      steps:
        # --- Forgejo sandbox destination: native template generation
        - id: generate
          name: Generate repository from Forgejo template
          if: ${{ parameters.destination == 'sandbox' }}
          action: http:backstage:request
          input:
            method: POST
            path: /proxy/forgejo/repos/platform/ansible-collection-template/generate
            headers:
              content-type: application/json
            body:
              owner: sandbox
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              git_content: true
              private: false
        - id: register
          name: Register in catalog (Forgejo)
          if: ${{ parameters.destination == 'sandbox' }}
          action: catalog:register
          input:
            catalogInfoUrl: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}/src/branch/main/catalog-info.yaml
        # --- GitHub destinations: stage through Forgejo's expander (the only
        # thing that substitutes the skeleton placeholders), fetch the
        # expanded tree, drop the staging repo, strip Dev Spaces artifacts,
        # write a GitHub-correct catalog-info, publish, register.
        - id: stage
          name: Stage expanded copy in sandbox
          if: ${{ parameters.destination != 'sandbox' }}
          action: http:backstage:request
          input:
            method: POST
            path: /proxy/forgejo/repos/platform/ansible-collection-template/generate
            headers:
              content-type: application/json
            body:
              owner: sandbox
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              git_content: true
              private: false
        - id: fetch-staged
          name: Fetch expanded content
          if: ${{ parameters.destination != 'sandbox' }}
          action: fetch:plain
          input:
            # branch-qualified: GiteaUrlReader derives the ref from the URL
            # path; a bare repo URL yields git/commits/undefined -> 404
            url: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}/src/branch/main
        - id: cleanup-staged
          name: Delete staging repo
          if: ${{ parameters.destination != 'sandbox' }}
          action: http:backstage:request
          input:
            method: DELETE
            path: /proxy/forgejo/repos/sandbox/${{ parameters.name }}
        - id: strip-devspaces
          name: Strip Dev Spaces artifacts
          if: ${{ parameters.destination != 'sandbox' }}
          action: fs:delete
          input:
            files:
              - .gitea/template
              - catalog-info.yaml
              - devfile.yaml
              - scripts/install-agents.sh
        - id: entity
          name: Write GitHub catalog-info
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:write
          input:
            entity:
              apiVersion: backstage.io/v1alpha1
              kind: Component
              metadata:
                name: ${{ parameters.name }}
                description: ${{ parameters.description }}
                annotations:
                  github.com/project-slug: ${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}/${{ parameters.name }}
                links:
                  - url: https://github.com/${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}/${{ parameters.name }}
                    title: GitHub repository
                    icon: scm
              spec:
                type: ansible-collection
                lifecycle: experimental
                owner: group:default/developers
        - id: publish-github
          name: Publish to GitHub
          if: ${{ parameters.destination != 'sandbox' }}
          action: publish:github
          input:
            repoUrl: github.com?owner=${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}&repo=${{ parameters.name }}
            description: ${{ parameters.description }}
            repoVisibility: public
            defaultBranch: main
        - id: register-github
          name: Register in catalog (GitHub)
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:register
          input:
            catalogInfoUrl: ${{ steps['publish-github'].output.repoContentsUrl }}/catalog-info.yaml
      output:
        links:
          - title: Repository
            url: ${{ steps['publish-github'].output.remoteUrl if parameters.destination != 'sandbox' else 'https://forgejo.apps.ocp.igou.systems/sandbox/' + parameters.name }}
          # Sandbox repos open via the raw devfile URL (Dev Spaces has no
          # Forgejo provider); GitHub repos open via the native provider.
          - title: Open in OpenShift Dev Spaces
            url: >-
              ${{ 'https://devspaces.apps.ocp.igou.systems/#https://github.com/'
              + ('igou-io' if parameters.destination == 'github-igou-io' else 'david-igou')
              + '/' + parameters.name if parameters.destination != 'sandbox'
              else 'https://devspaces.apps.ocp.igou.systems/#https://forgejo.apps.ocp.igou.systems/sandbox/'
              + parameters.name + '/raw/branch/main/devfile.yaml' }}
          - title: Catalog entity
            entityRef: component:default/${{ parameters.name }}
  ansible-role-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
