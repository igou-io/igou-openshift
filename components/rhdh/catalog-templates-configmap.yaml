            - name
            - description
          properties:
            name:
              title: Project name
              type: string
              description: >-
                kebab-case; becomes the repo name and the AAP project name
              pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
            description:
              title: Description
              type: string
              description: One line on what this automates or serves
      steps:
        - id: generate
          name: Generate repository from Forgejo template
          action: http:backstage:request
          input:
