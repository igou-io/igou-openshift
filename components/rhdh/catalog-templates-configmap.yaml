              - scripts/install-agents.sh
        - id: entity
          name: Write GitHub catalog-info
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:write
          input:
            entity:
              apiVersion: backstage.io/v1alpha1
              kind: Component
              metadata:
                name: ${{ parameters.name }}
                description: ${{ parameters.description }}
                annotations:
                  github.com/project-slug: ${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}/${{ parameters.name }}
                links:
                  - url: https://github.com/${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}/${{ parameters.name }}
                    title: GitHub repository
                    icon: scm
              spec:
                type: mcp-server
                lifecycle: experimental
                owner: group:default/developers
        - id: publish-github
          name: Publish to GitHub
          if: ${{ parameters.destination != 'sandbox' }}
          action: publish:github
          input:
            repoUrl: github.com?owner=${{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}&repo=${{ parameters.name }}
            description: ${{ parameters.description }}
            repoVisibility: public
            defaultBranch: main
        - id: register-github
          name: Register in catalog (GitHub)
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:register
          input:
            catalogInfoUrl: ${{ steps['publish-github'].output.repoContentsUrl }}/catalog-info.yaml
      output:
        links:
          - title: Repository
            url: ${{ steps['publish-github'].output.remoteUrl if parameters.destination != 'sandbox' else 'https://forgejo.apps.ocp.igou.systems/sandbox/' + parameters.name }}
          # Sandbox repos open via the raw devfile URL (Dev Spaces has no
          # Forgejo provider); GitHub repos open via the native provider.
          - title: Open in OpenShift Dev Spaces
            url: >-
              ${{ 'https://devspaces.apps.ocp.igou.systems/#https://github.com/'
              + ('igou-io' if parameters.destination == 'github-igou-io' else 'david-igou')
              + '/' + parameters.name if parameters.destination != 'sandbox'
              else 'https://devspaces.apps.ocp.igou.systems/#https://forgejo.apps.ocp.igou.systems/sandbox/'
              + parameters.name + '/raw/branch/main/devfile.yaml' }}
          - title: Catalog entity
            entityRef: component:default/${{ parameters.name }}
  aap-job-template-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: aap-job-template
      title: AAP Playbook + Job Template (PR to igou-ansible)
      description: >-
        Open a PR adding playbooks/<domain>/<name>.yml to igou-ansible with
        the ready-to-paste controller_templates entry embedded in the
        playbook header and PR body. The igou-inventory splice into
        group_vars/aap/job_templates.yml stays a manual follow-up.
      tags:
        - ansible
        - aap
        - pull-request
    spec:
      owner: group:default/admins
      type: aap-job-template
      parameters:
        - title: Playbook details
          required:
            - name
            - domain
            - title
            - description
            - targeting
          properties:
            name:
              title: Playbook name
              type: string
              description: lower_snake_case; becomes playbooks/<domain>/<name>.yml and JT name <domain>_<name>
              pattern: '^[a-z][a-z0-9_]{1,50}$'
            domain:
              title: Domain
              type: string
              description: Existing playbooks/ subdirectory
              enum:
                - aap
                - devenv
                - hermes
                - kubernetes
                - kubevirt
                - linux
                - logging
                - netboot
                - openshift
                - openshift_virtualization
                - rhel
                - routeros
                - rustfs
                - tailscale
                - truenas
                - upsmonitor
                - windows
            title:
              title: Play title
              type: string
              description: Imperative Title-cased play name (no quotes or braces)
              pattern: "^[A-Z][A-Za-z0-9 ,./()'-]{4,72}$"
            description:
              title: Description
              type: string
              description: One line on what this playbook automates
            targeting:
              title: Targeting
              type: string
              default: limit
              enum:
                - limit
                - localhost
              enumNames:
                - Managed hosts (ansible_limit contract)
                - Localhost / API-driven
            default_group:
              title: Default host group
              type: string
              default: none
              description: >-
                Managed-hosts only — hosts pattern when ansible_limit is not
                passed; 'none' keeps the no-limit-runs-nothing safety contract
              pattern: '^[a-z][a-z0-9_.:-]{1,62}$'
            execution_environment:
              title: Execution environment
              type: string
              default: igou-awx-ee
              enum:
                - igou-awx-ee
                - igou-aap-ee-rhel9
      steps:
        - id: fetch
          name: Render playbook skeleton
          action: fetch:template
          input:
            url: https://forgejo.apps.ocp.igou.systems/platform/aap-job-template-template/src/branch/main/skeletons/${{ parameters.targeting }}
            targetPath: playbooks/${{ parameters.domain }}
            values:
              name: ${{ parameters.name }}
              domain: ${{ parameters.domain }}
              title: ${{ parameters.title }}
              description: ${{ parameters.description }}
              default_group: ${{ parameters.default_group }}
              execution_environment: ${{ parameters.execution_environment }}
        - id: publish-pr
          name: Open pull request
          action: publish:github:pull-request
          input:
            repoUrl: github.com?owner=igou-io&repo=igou-ansible
            branchName: goldenpath/playbook-${{ parameters.name }}
            title: 'feat(${{ parameters.domain }}): scaffold ${{ parameters.name }} playbook'
            description: >-
              Scaffolded by the aap-job-template golden path
              (${{ parameters.description }}). Manual follow-ups before use:
              splice the controller_templates entry from the playbook header
              comment into igou-inventory group_vars/aap/job_templates.yml
              (config-as-code), then run the aap_sync_templates JT; flesh out
              the task list; keep ansible-lint production green.
            targetBranchName: main
      output:
        links:
          - title: Pull request
            url: ${{ steps['publish-pr'].output.remoteUrl }}
  grafana-dashboard-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: grafana-dashboard
      title: Grafana Dashboard (PR to igou-openshift)
      description: >-
        Open a PR adding a GrafanaDashboard CR to components/grafana —
        grafana.com id import or a vendored placeholder JSON. The
        kustomization.yaml wiring lines stay a manual follow-up listed in
        the PR body.
      tags:
        - grafana
        - observability
        - pull-request
    spec:
      owner: group:default/admins
      type: grafana-dashboard
      parameters:
        - title: Dashboard details
          required:
            - name
            - description
            - folder
            - source
          properties:
            name:
              title: Dashboard slug
              type: string
              description: kebab-case; CR name suffix, JSON filename, configmap key
              pattern: '^[a-z][a-z0-9-]{1,38}$'
            description:
              title: Description
              type: string
              description: One line on what this dashboard shows
            folder:
              title: Grafana folder
              type: string
              description: 'Existing folders: hardware, kubernetes, logging, network, power, sre'
              pattern: '^[a-z][a-z0-9-]{1,29}$'
            source:
              title: Source
              type: string
              default: custom-json
              enum:
                - custom-json
                - grafanaCom
              enumNames:
                - Hand-authored JSON (vendored placeholder)
                - grafana.com dashboard id
            title:
              title: Dashboard title
              type: string
              description: custom-json only; defaults to the slug
            grafana_com_id:
              title: grafana.com id
              type: integer
              description: grafanaCom source only — numeric id from the dashboard URL
            datasource:
              title: Datasource
              type: string
              default: thanos-querier
              enum:
                - thanos-querier
                - rk8s-prometheus
                - loki-infrastructure
                - loki-application
                - loki-network
            input_name:
              title: Dashboard input name
              type: string
              default: DS_PROMETHEUS
              description: __inputs[].name in the JSON to bind (exact, case-sensitive)
      steps:
        - id: fetch
          name: Render dashboard skeleton
          action: fetch:template
          input:
            url: https://forgejo.apps.ocp.igou.systems/platform/grafana-dashboard-template/src/branch/main/skeletons/${{ parameters.source }}
            targetPath: components/grafana
            values:
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              folder: ${{ parameters.folder }}
              title: ${{ parameters.title }}
              grafana_com_id: ${{ parameters.grafana_com_id }}
              datasource: ${{ parameters.datasource }}
              input_name: ${{ parameters.input_name }}
        - id: publish-pr
          name: Open pull request
          action: publish:github:pull-request
          input:
            repoUrl: github.com?owner=igou-io&repo=igou-openshift
            branchName: goldenpath/dashboard-${{ parameters.folder }}-${{ parameters.name }}
            title: 'feat(grafana): ${{ parameters.folder }}/${{ parameters.name }} dashboard'
            description: >-
              Scaffolded by the grafana-dashboard golden path
              (${{ parameters.description }}). Manual follow-ups before merge:
              add the CR file (and for custom-json the configMapGenerator
              stanza) to components/grafana/kustomization.yaml, and for
              custom-json replace the placeholder panels with the real
              dashboard model.
            targetBranchName: main
      output:
        links:
          - title: Pull request
            url: ${{ steps['publish-pr'].output.remoteUrl }}
  benchmark-run-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: benchmark-run
      title: Benchmark Run
      description: >-
        Launch an ansible-collection-bench trial: an AI coding agent gets a
        10-role collection spec and KubeVirt-backed molecule tests; the run
        is graded and committed to the results ledger with a per-run repo.
        Pick a harness and its model menu appears.
      tags:
        - benchmark
        - ai
    spec:
      owner: group:default/admins
      type: benchmark-run
      parameters:
        - title: Trial parameters
          required:
            - harness
          properties:
            harness:
              title: Harness
              type: string
              default: opencode
              description: >-
                Agent CLI under test — the Model dropdown below is filtered to
                the models this harness can address.
              enum:
                - opencode
                - claude-code
                - codex
                - cursor-cli
            agent_timeout:
              title: Agent budget (seconds)
              type: string
              default: "5400"
              description: Wall-clock budget for the agent phase of the trial
              enum:
                - "900"
                - "1800"
                - "3600"
                - "5400"
            network:
              title: Network profile
              type: string
              default: sealed
              description: >-
                Egress policy for the agent pod — profiles are directories
                under network/ in the bench repo.
              enum:
                - sealed
                - open
                - docs
            skills:
              title: Skills bundle
              type: string
              default: none
              description: >-
                Bundles are directories under skills/ in the bench repo — add
                a directory there, then add its name to this enum (one-line
                change in this template).
              enum:
                - none
                - lab-ansible
                - ai-forge
            burst:
              title: Burst to casval
              type: string
              default: "false"
              description: Requires the casval burst node
              enum:
                - "false"
                - "true"
            verbosity:
              title: Transcript verbosity
              type: string
              default: high
              description: >-
                high = full stream/JSON agent transcript + harness session
                artifacts in results
              enum:
                - high
                - low
          # Dynamic model menu: RJSF resolves `dependencies.harness.oneOf` by
          # matching the branch whose single-value `harness` enum equals the
          # picked harness, then merges that branch's `model` enum into the
          # form. New model? Add it to the matching branch's enum.
          dependencies:
            harness:
              oneOf:
                - required:
                    - model
                  properties:
                    harness:
                      enum:
                        - opencode
                    model:
                      title: Model
                      type: string
                      default: opencode-go/kimi-k2.7-code
                      ui:help: >-
                        @high/@medium/@low suffix sets reasoning effort.
                        llmkube/* = locally served cluster models (no API cost;
                        qwen38-27b needs casval up)
                      enum:
                        - opencode-go/kimi-k2.7-code
                        - opencode-go/kimi-k3
                        - opencode-go/kimi-k2.6
                        - opencode-go/gpt-5.6-luna@high
                        - opencode-go/gpt-5.6-luna
                        - opencode-go/glm-5.2
                        - opencode-go/glm-5.1
                        - opencode-go/grok-4.5
                        - opencode-go/qwen3.8-max
                        - opencode-go/qwen3.7-max
                        - opencode-go/qwen3.7-plus
                        - opencode-go/minimax-m3
                        - opencode-go/minimax-m2.7
                        - opencode/deepseek-v4-flash-free
                        - llmkube/qwen38-27b
                        - llmkube/qwen35-2b
                        - llmkube/gemma-4-e2b
                - required:
                    - model
                  properties:
                    harness:
                      enum:
                        - claude-code
                    model:
                      title: Model
                      type: string
                      default: sonnet
                      ui:help: >-
                        Aliases resolve to the newest model of that tier;
                        thinking is automatic
                      enum:
                        - sonnet
                        - opus
                        - haiku
                        - claude-sonnet-5
                        - claude-opus-5
                        - claude-haiku-4-5
                - required:
                    - model
                  properties:
                    harness:
                      enum:
                        - codex
                    model:
                      title: Model
                      type: string
                      default: gpt-5.6-terra@high
                      ui:help: >-
                        ChatGPT-account models are terra and sol only;
                        @suffix maps to model_reasoning_effort
                      enum:
                        - gpt-5.6-terra@high
                        - gpt-5.6-terra@xhigh
                        - gpt-5.6-terra@medium
                        - gpt-5.6-terra@low
                        - gpt-5.6-luna@high
                        - gpt-5.6-luna@xhigh
                        - gpt-5.6-luna@medium
                        - gpt-5.6-luna@low
                        - gpt-5.6-sol@high
                        - gpt-5.6-sol@xhigh
                        - gpt-5.6-sol@medium
                        - gpt-5.6-sol@low
                - required:
                    - model
                  properties:
                    harness:
                      enum:
                        - cursor-cli
                    model:
                      title: Model
                      type: string
                      default: composer-2.5
                      ui:help: >-
                        Effort and speed are baked into cursor's model names;
                        -fast variants trade quality for latency
                      enum:
                        - composer-2.5
                        - composer-2.5-fast
                        - auto
                        - cursor-grok-4.6-xhigh
                        - cursor-grok-4.6-high
                        - cursor-grok-4.6-medium
                        - cursor-grok-4.6-low
                        - cursor-grok-4.5-high
                        - gpt-5.3-codex-xhigh
                        - gpt-5.3-codex-high
                        - gpt-5.3-codex
                        - gpt-5.6-sol-xhigh
                        - gpt-5.6-sol-high
                        - gpt-5.6-luna-high
                        - claude-opus-5-thinking-high
                        - claude-sonnet-5-thinking-xhigh
                        - claude-sonnet-5-thinking-high
                        - claude-fable-5-thinking-xhigh
                        - gemini-3.7-flash-high
      steps:
        - id: launch
          name: Launch PipelineRun via EventListener
          action: http:backstage:request
          input:
            method: POST
            path: /proxy/bench-trigger
            headers:
              content-type: application/json
            # Every field is sent on every run: the TriggerBinding requires all
            # seven, and an omitted/empty value would override the server-side
            # default with an empty string.
            body:
              harness: ${{ parameters.harness }}
              model: ${{ parameters.model }}
              agent_timeout: ${{ parameters.agent_timeout }}
              network: ${{ parameters.network }}
              skills: ${{ parameters.skills }}
              burst: ${{ parameters.burst }}
              verbosity: ${{ parameters.verbosity }}
      output:
        links:
          - title: PipelineRuns (watch the trial)
            url: https://console-openshift-console.apps.ocp.igou.systems/pipelines/ns/ansible-collection-bench/pipeline-runs
          - title: Results ledger
            url: https://forgejo.apps.ocp.igou.systems/bench/ansible-collection-bench/src/branch/main/results/INDEX.md
