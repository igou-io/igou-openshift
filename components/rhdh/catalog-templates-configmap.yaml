              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              git_content: true
              private: false
        - id: register
          name: Register in catalog (Forgejo)
          if: ${{ parameters.destination == 'sandbox' }}
          action: catalog:register
          input:
            catalogInfoUrl: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}/src/branch/main/catalog-info.yaml
        # --- GitHub destinations: stage through Forgejo's expander (the only
        # thing that substitutes the skeleton placeholders), fetch the
        # expanded tree, drop the staging repo, strip Dev Spaces artifacts,
        # write a GitHub-correct catalog-info, publish, register.
        - id: stage
          name: Stage expanded copy in sandbox
          if: ${{ parameters.destination != 'sandbox' }}
          action: http:backstage:request
          input:
            method: POST
            path: /proxy/forgejo/repos/platform/go-app-template/generate
            headers:
              content-type: application/json
            body:
              owner: sandbox
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              git_content: true
              private: false
        - id: fetch-staged
          name: Fetch expanded content
          if: ${{ parameters.destination != 'sandbox' }}
          action: fetch:plain
          input:
            url: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}
        - id: cleanup-staged
          name: Delete staging repo
          if: ${{ parameters.destination != 'sandbox' }}
          action: http:backstage:request
          input:
            method: DELETE
            path: /proxy/forgejo/repos/sandbox/${{ parameters.name }}
        - id: strip-devspaces
          name: Strip Dev Spaces artifacts
          if: ${{ parameters.destination != 'sandbox' }}
          action: fs:delete
          input:
            files:
              - .gitea/template
              - catalog-info.yaml
              - devfile.yaml
              - scripts/install-agents.sh
        - id: entity
          name: Write GitHub catalog-info
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:write
          input:
            entity:
              apiVersion: backstage.io/v1alpha1
              kind: Component
              metadata:
                name: ${{ parameters.name }}
                description: ${{ parameters.description }}
                annotations:
                  github.com/project-slug: ${{{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}}/${{ parameters.name }}
                links:
                  - url: https://github.com/${{{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}}/${{ parameters.name }}
                    title: GitHub repository
                    icon: scm
              spec:
                type: go-app
                lifecycle: experimental
                owner: group:default/developers
        - id: publish-github
          name: Publish to GitHub
          if: ${{ parameters.destination != 'sandbox' }}
          action: publish:github
          input:
            repoUrl: github.com?owner=${{{ 'igou-io' if parameters.destination == 'github-igou-io' else 'david-igou' }}}&repo=${{ parameters.name }}
            description: ${{ parameters.description }}
            repoVisibility: public
            defaultBranch: main
        - id: register-github
          name: Register in catalog (GitHub)
          if: ${{ parameters.destination != 'sandbox' }}
          action: catalog:register
          input:
            catalogInfoUrl: ${{ steps['publish-github'].output.repoContentsUrl }}/catalog-info.yaml
      output:
        links:
          - title: Repository
            url: ${{ steps['publish-github'].output.remoteUrl if parameters.destination != 'sandbox' else 'https://forgejo.apps.ocp.igou.systems/sandbox/' + parameters.name }}
          # Sandbox repos open via the raw devfile URL (Dev Spaces has no
          # Forgejo provider); GitHub repos open via the native provider.
          - title: Open in OpenShift Dev Spaces
            url: >-
              ${{ 'https://devspaces.apps.ocp.igou.systems/#https://github.com/'
              + ('igou-io' if parameters.destination == 'github-igou-io' else 'david-igou')
              + '/' + parameters.name if parameters.destination != 'sandbox'
              else 'https://devspaces.apps.ocp.igou.systems/#https://forgejo.apps.ocp.igou.systems/sandbox/'
              + parameters.name + '/raw/branch/main/devfile.yaml' }}
          - title: Catalog entity
            entityRef: component:default/${{ parameters.name }}
