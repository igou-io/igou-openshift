              private: false
        - id: register
          name: Register in catalog
          action: catalog:register
          input:
            catalogInfoUrl: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}/src/branch/main/catalog-info.yaml
      output:
        links:
          - title: Forgejo repository
            url: https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}
          # Raw devfile URL factory — see the ansible-collection template above
          # for why a plain repo URL breaks the Dev Spaces resolver.
          - title: Open in OpenShift Dev Spaces
            url: https://devspaces.apps.ocp.igou.systems/#https://forgejo.apps.ocp.igou.systems/sandbox/${{ parameters.name }}/raw/branch/main/devfile.yaml
          - title: Catalog entity
            entityRef: component:default/${{ parameters.name }}
  helm-chart-template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: helm-chart
      title: Helm Chart
      description: >-
        Scaffold a Helm chart repo the way lab charts are written: kustomize-rendered, restricted-v2 clean, helm lint green out of the box.
      tags:
        - helm
        - forgejo
    spec:
      owner: group:default/admins
      type: helm-chart
      parameters:
        - title: Helm Chart details
          required:
            - name
            - description
          properties:
            name:
              title: Chart name
              type: string
              description: >-
