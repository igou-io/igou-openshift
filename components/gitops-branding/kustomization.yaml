apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openshift-gitops-argocd.yaml
configMapGenerator:
  - name: saturn-gitops-assets
    namespace: openshift-gitops
    files:
      - assets/saturn.css
      - assets/saturn-gitops-dark.png
      - assets/saturn-planet.png
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: '-1'
