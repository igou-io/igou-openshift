global:
  resolve_timeout: 5m
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity =~ "warning|info"
    equal: [namespace, alertname]
  - source_matchers:
      - severity = warning
    target_matchers:
      - severity = info
    equal: [namespace, alertname]
route:
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: gotify
  routes:
    - matchers:
        - alertname = Watchdog
      receiver: 'null'
    - matchers:
        - alertname = AlertmanagerReceiversNotConfigured
      receiver: 'null'
    # Suppress self-referential delivery-failure alerts when the failing
    # integration is the gotify-bridge webhook. Bridge v2.3.2 has a bug:
    # with --dispatch_errors it does send a debug notification to Gotify
    # but still returns HTTP 400 for alerts missing the `description`
    # annotation, which Alertmanager treats as a permanent client error.
    # Several upstream OpenShift alerts (CDIDataImportCronOutdated,
    # CDIDefaultStorageClassDegraded, KubeJobFailed, ...) ship without a
    # description annotation and trigger this. Remove this matcher once
    # the bridge is patched or replaced.
    - matchers:
        - alertname =~ "Alertmanager(Cluster)?FailedToSendAlerts"
        - integration = webhook
      receiver: 'null'
    # The netobserv and openshift-logging operators ship Loki PDBs with
    # replicas == minAvailable, so they sit at-limit permanently on a
    # single-node cluster (11 chronically-firing series, pure noise).
    - matchers:
        - alertname = PodDisruptionBudgetAtLimit
        - namespace =~ "netobserv|openshift-logging"
      receiver: 'null'
    # Single-node control plane: this alert's own remediation assumes three
    # control-plane nodes and ~2/3 memory headroom for failover, which does
    # not apply to a compact homelab cluster where the master is also the
    # always-on workload node. Firing continuously since 2026-08-20 after the
    # llmkube/bench workloads landed (40 re-fires on igou-inventory#671);
    # informational here, not a remediable condition.
    - matchers:
        - alertname = HighOverallControlPlaneMemory
      receiver: 'null'
    # Orchestrator monitoring was removed entirely (2026-08-31): the operator
    # re-applies its own broken backend ServiceMonitor every reconcile
    # (mandatory client cert, no pod-IP SAN), so TargetDown from this
    # namespace is permanent noise. Belt to the AlertRelabelConfig's
    # suspenders — relabeling already drops these upstream.
    - matchers:
        - alertname = TargetDown
        - namespace = automation-orchestrator
      receiver: 'null'
    - matchers:
        - severity =~ "critical|warning"
      receiver: eda-github-issue
      continue: true
    # Read-only SRE Hermes instance investigates and posts to Slack itself
    # (applications/hermes-sre). continue: the Gotify/Slack fan-out below is
    # unchanged.
    - matchers:
        - severity =~ "critical|warning"
      receiver: hermes-sre
      continue: true
      # Each notification costs a full LLM investigation; batch re-fires and
      # don't re-deliver an unchanged group more than twice a day. The agent
      # additionally dedupes against the EDA-filed GitHub issue.
      group_interval: 30m
      repeat_interval: 12h
    - matchers:
        - severity = critical
      receiver: gotify-and-slack-critical
    - matchers:
        - severity = warning
      receiver: gotify-and-slack-warning
    - matchers:
        - severity = info
      receiver: 'null'
receivers:
  - name: 'null'
  - name: hermes-sre
    webhook_configs:
      - url: http://hermes-sre.hermes-sre.svc:8644/webhooks/alertmanager
        send_resolved: true
        max_alerts: 10
        http_config:
          # The relay now requires this token on every POST (it is exposed on
          # a Route for the rk8s Alertmanager, so network policy alone no
          # longer authorizes it) and answers 503 while Hermes is at its
          # session limit, which makes Alertmanager retry instead of the
          # gateway dropping the alert.
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/hermes-sre-am-relay/token
  - name: gotify
    webhook_configs:
      - url: http://alertmanager-gotify-bridge.gotify.svc:8080/gotify_webhook
        send_resolved: true
  - name: eda-github-issue
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alertmanager-eda-event-stream/url
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alertmanager-eda-event-stream/token
  # Severity receivers fan out to both Gotify (push) and Slack. Bridge
  # v2.3.2 still returns HTTP 400 on alerts missing the `description`
  # annotation, but the `Alertmanager(Cluster)?FailedToSendAlerts
  # integration=webhook` route above null-routes the resulting flap, and
  # --dispatch_errors makes the bridge push a debug notification anyway.
  - name: gotify-and-slack-critical
    webhook_configs:
      - url: http://alertmanager-gotify-bridge.gotify.svc:8080/gotify_webhook
        send_resolved: true
    slack_configs:
      - api_url: https://slack.com/api/chat.postMessage
        channel: '#igoucloud-alerts-critical'
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/alertmanager-slack-bot-token/password
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
  - name: gotify-and-slack-warning
    webhook_configs:
      - url: http://alertmanager-gotify-bridge.gotify.svc:8080/gotify_webhook
        send_resolved: true
    slack_configs:
      - api_url: https://slack.com/api/chat.postMessage
        channel: '#igoucloud-alerts-warning'
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/alertmanager-slack-bot-token/password
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
