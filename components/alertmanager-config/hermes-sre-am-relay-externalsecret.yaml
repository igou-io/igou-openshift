---
# Bearer token the hermes-sre am-relay requires on every POST; mounted into
# alertmanager-main via `alertmanagerMain.secrets` (user-workload-monitoring's
# cluster-monitoring-config) and referenced by the hermes-sre receiver's
# credentials_file. Same 1Password item backs the relay itself (hermes-sre ns)
# and the rk8s AlertmanagerConfig (igou-kubernetes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sre-am-relay
  namespace: openshift-monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: hermes-sre-am-relay
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hermes-sre-am-relay
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
