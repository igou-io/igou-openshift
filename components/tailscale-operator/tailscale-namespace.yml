apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Opts this namespace's HTTPRoutes into the shared trusted-lan Gateway
    # (clusters/ocp/gateway-api) — routes fronting operator egress proxies
    # (t3-vscode-egress.yml) live here because their selector Services must
    # be in the proxy pods' namespace.
    gateway-access/trusted-lan: 'true'
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
