resources:
  - external-secrets-operator-namespace.yaml
helmCharts:
  - name: external-secrets
    includeCRDs: true
    releaseName: external-secrets
    namespace: external-secrets-operator
    version: 2.11.0
    repo: https://charts.external-secrets.io
    valuesInline:
      global:
        nodeSelector:
          node-role.kubernetes.io/control-plane: ''
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        compatibility:
          openshift:
            adaptSecurityContext: force
      replicaCount: 1
      image:
        repository: ghcr.io/external-secrets/external-secrets
        pullPolicy: IfNotPresent
        tag: v2.2.0@sha256:876e627dbee5b0edd12da49b035469d12418cd6c3c4be5e383ae6a82e8bd4565
        flavour: ''
      crds:
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
      serviceAccount:
        create: true
        automount: true
        annotations: {}
        extraLabels: {}
        name: ''
      rbac:
        create: true
        servicebindings:
          create: true
        aggregateToView: true
        aggregateToEdit: true
      strategy: {}
      podSecurityContext:
        enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        enabled: true
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources: {}
      serviceMonitor:
        enabled: true
        renderMode: alwaysRender
      livenessProbe:
        spec:
          httpGet:
            port: 8082
      webhook:
        certCheckInterval: 1h0m0s
        replicaCount: 1
        image:
          repository: ghcr.io/external-secrets/external-secrets
          pullPolicy: IfNotPresent
          tag: v2.2.0@sha256:876e627dbee5b0edd12da49b035469d12418cd6c3c4be5e383ae6a82e8bd4565
          flavour: ''
        serviceAccount:
          create: true
          automount: true
          annotations: {}
          extraLabels: {}
          name: ''
        certManager:
          cert:
            duration: 8760h
        strategy: {}
        podSecurityContext:
          enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          enabled: true
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources: {}
      certController:
        requeueInterval: 1h0m0s
        replicaCount: 1
        image:
          repository: ghcr.io/external-secrets/external-secrets
          pullPolicy: IfNotPresent
          tag: v2.2.0@sha256:876e627dbee5b0edd12da49b035469d12418cd6c3c4be5e383ae6a82e8bd4565
          flavour: ''
        rbac:
          create: true
        serviceAccount:
          create: true
          automount: true
          annotations: {}
          extraLabels: {}
          name: ''
        strategy: {}
        startupProbe:
          useReadinessProbePort: true
          port: ''
        podSecurityContext:
          enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          enabled: true
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources: {}
