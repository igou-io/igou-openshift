---
# Registry auth for the dynamic-plugins initContainer. It pulls the portal
# plug-in OCI artifacts from registry.redhat.io/ansible-automation-platform/
# automation-portal with skopeo *inside* the container, so the cluster global
# pull secret does not apply — the chart mounts this secret's auth.json
# instead. Name contract: <helm-release>-dynamic-plugins-registry-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-portal-dynamic-plugins-registry-auth
  namespace: aap-portal
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-lab-container-registries
    kind: ClusterSecretStore
  target:
    name: aap-portal-dynamic-plugins-registry-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # API-defaulted; declared so ArgoCD (SSA) stays Synced.
      mergePolicy: Replace
      data:
        auth.json: |
          {"auths":{"registry.redhat.io":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: redhat-registry
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: redhat-registry
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
