---
# AAP gateway connection for the automation portal. The chart's Backstage
# Deployment reads these exact secret/key names (secrets-rhaap-portal /
# aap-host-url, oauth-client-id, oauth-client-secret, aap-token) — contract
# from the AAP 2.7 "Create secrets in OpenShift" install doc; do not rename.
# Source item lab_aap/aap-portal holds the gateway OAuth app (authorization
# code, confidential, org igou) plus an admin-owned write-scope API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-rhaap-portal
  namespace: aap-portal
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-lab-aap
    kind: ClusterSecretStore
  target:
    name: secrets-rhaap-portal
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: aap-host-url
      remoteRef:
        key: aap-portal
        property: aap-host-url
    - secretKey: oauth-client-id
      remoteRef:
        key: aap-portal
        property: oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: aap-portal
        property: oauth-client-secret
    - secretKey: aap-token
      remoteRef:
        key: aap-portal
        property: aap-token
