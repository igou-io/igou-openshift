---
# Stable Backstage backend service-to-service secret (BACKEND_SECRET). Same
# regenerate-on-every-render problem as the postgres password — pin it via
# existingSecret. Key name `backend-secret` is the chart contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-portal-backend-auth
  namespace: aap-portal
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-lab-aap
    kind: ClusterSecretStore
  target:
    name: aap-portal-backend-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: backend-secret
      remoteRef:
        key: aap-portal
        property: backend-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
