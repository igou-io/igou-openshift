---
# Stable PostgreSQL credentials for the chart-managed database. Without an
# existingSecret the RHDH chart generates a NEW random password on every
# render, so each ArgoCD sync rotated the Secret out from under the
# already-initialized PGDATA ("password authentication failed for user
# postgres"). Key names match the chart's auth.secretKeys contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-portal-postgresql-auth
  namespace: aap-portal
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-lab-aap
    kind: ClusterSecretStore
  target:
    name: aap-portal-postgresql-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: postgres-password
      remoteRef:
        key: aap-portal
        property: pg-postgres-password
    - secretKey: password
      remoteRef:
        key: aap-portal
        property: pg-user-password
