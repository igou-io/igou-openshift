apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - aap-portal-namespace.yaml
  - default-deny-networkpolicy.yaml
  - allow-portal-networkpolicy.yaml
  - secrets-rhaap-portal-externalsecret.yaml
  - aap-portal-dynamic-plugins-registry-auth-externalsecret.yaml
  - aap-portal-postgresql-auth-externalsecret.yaml
  - aap-portal-backend-auth-externalsecret.yaml

helmCharts:
  - name: redhat-rhaap-portal
    releaseName: aap-portal
    namespace: aap-portal
    version: 2.2.6
    repo: https://charts.openshift.io
    valuesInline:
      redhat-developer-hub:
        global:
          # Required by chart validation (apps.example.com fails the render);
          # host pins the Route + all baseUrl values in one place.
          clusterRouterBase: apps.ocp.igou.systems
          host: portal.apps.ocp.igou.systems
          # OCI plug-in delivery (recommended): the init container pulls
          # ansible-automation-platform/automation-portal:<imageTagInfo> from
          # registry.redhat.io using the aap-portal-dynamic-plugins-registry-auth
          # secret. Tag pinned to the chart appVersion.
          pluginMode: oci
          imageTagInfo: "2.2.5"
          # Pin the backend service-to-service secret; without existingSecret
          # the chart regenerates it every render (ArgoCD sync = rotation).
          auth:
            backend:
              existingSecret: aap-portal-backend-auth
        upstream:
          # Same regenerate-on-render problem for the postgres passwords —
          # see aap-portal-postgresql-auth-externalsecret.yaml.
          postgresql:
            auth:
              existingSecret: aap-portal-postgresql-auth
