---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: public-services-egress
  namespace: public-services-egress
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "public-services-egress",
      "type": "macvlan",
      "master": "br-ex",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "10.10.9.12/24"
          }
        ]
      }
    }
