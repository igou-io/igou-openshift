---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: public-services-egress
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowedCapabilities:
  - NET_ADMIN
requiredDropCapabilities:
  - ALL
allowedUnsafeSysctls: []
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - emptyDir
  - projected
  - secret
