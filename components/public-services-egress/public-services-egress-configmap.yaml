---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-services-egress
  namespace: public-services-egress
data:
  start.sh: |
    #!/bin/sh
    set -eu
    export XTABLES_LOCKFILE=/tmp/xtables.lock

    # This pod has its own network namespace. Configure the firewall before Tailscale.
    iptables-restore <<'RULES'
    *mangle
    :PREROUTING ACCEPT [0:0]
    :INPUT ACCEPT [0:0]
    :FORWARD ACCEPT [0:0]
    :OUTPUT ACCEPT [0:0]
    :POSTROUTING ACCEPT [0:0]
    -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
    COMMIT
    *filter
    :INPUT DROP [0:0]
    :FORWARD DROP [0:0]
    :OUTPUT ACCEPT [0:0]
    -A INPUT -i lo -j ACCEPT
    -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    -A INPUT -i eth0 -p udp --dport 41641 -j ACCEPT
    -A FORWARD -m conntrack --ctstate INVALID -j DROP
    -A FORWARD -i tailscale0 -o net1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    -A FORWARD -d 0.0.0.0/8 -j DROP
    -A FORWARD -d 10.0.0.0/8 -j DROP
    -A FORWARD -d 100.64.0.0/10 -j DROP
    -A FORWARD -d 127.0.0.0/8 -j DROP
    -A FORWARD -d 169.254.0.0/16 -j DROP
    -A FORWARD -d 172.16.0.0/12 -j DROP
    -A FORWARD -d 192.168.0.0/16 -j DROP
    -A FORWARD -d 224.0.0.0/4 -j DROP
    -A FORWARD -d 240.0.0.0/4 -j DROP
    -A FORWARD -i net1 -o tailscale0 -s 10.128.0.0/14 -p tcp -m multiport --dports 80,443,27000:27100 -j ACCEPT
    -A FORWARD -i net1 -o tailscale0 -s 10.128.0.0/14 -p udp --dport 27000:27100 -j ACCEPT
    COMMIT
    *nat
    :PREROUTING ACCEPT [0:0]
    :INPUT ACCEPT [0:0]
    :OUTPUT ACCEPT [0:0]
    :POSTROUTING ACCEPT [0:0]
    -A POSTROUTING -s 10.128.0.0/14 -o tailscale0 -j MASQUERADE
    COMMIT
    RULES

    # Replies must return on the underlay to OVN, not through a pod logical port
    # that rejects packets bearing the original public source IP.
    ip -4 route replace blackhole 10.128.0.0/14
    ip -4 route replace 10.129.0.0/23 via 10.10.9.34 dev net1
    ip -4 route replace 10.131.0.0/23 via 10.10.9.24 dev net1
    # These rules precede Tailscale's rules; keep state API and return paths local.
    ip -4 rule add pref 5000 to 10.128.0.0/14 lookup main
    ip -4 rule add pref 5001 to 172.30.0.0/16 lookup main

    tailscaled --state=kube:public-services-egress-state \
      --statedir=/tmp/tailscale --socket=/tmp/tailscaled.sock --port=41641 &
    daemon_pid=$!
    trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" || true' EXIT
    trap 'exit 0' INT TERM

    until [ -S /tmp/tailscaled.sock ]; do
      kill -0 "$daemon_pid"
      sleep 1
    done
    tailscale --socket=/tmp/tailscaled.sock up \
      --auth-key=file:/auth/authkey --hostname=ocp-public-egress \
      --advertise-tags=tag:ocp-public-service --accept-dns=false \
      --accept-routes=false --netfilter-mode=off \
      --exit-node="$EXIT_NODE" --exit-node-allow-lan-access=true --timeout=120s
    wait "$daemon_pid"
  ready.sh: |
    #!/bin/sh
    set -eu
    status="$(tailscale --socket=/tmp/tailscaled.sock status --json)"
    printf '%s\n' "$status" | grep -q '"BackendState": "Running"'
    printf '%s\n' "$status" | sed -n '/"ExitNodeStatus": {/,/^  }/p' |
      grep -q '"Online": true'
    ip -4 route get 1.1.1.1 | grep -q 'dev tailscale0'
