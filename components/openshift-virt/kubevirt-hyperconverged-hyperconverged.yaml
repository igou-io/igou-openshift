apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # CDI inherits the burst toleration so imports and clones can consume
    # Casval-local PVCs. Prefer always-on nodes for other CDI work; PVC
    # topology still forces lvms-casval consumers onto Casval.
    # HCO reports jsonpatch annotations as an unsupported modification
    # (kubevirt_hco_unsafe_modification_count metric), an accepted trade-off.
    containerizeddataimporter.kubevirt.io/jsonpatch: |-
      [
        {
          "op": "add",
          "path": "/spec/workload/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution",
          "value": [
            {
              "weight": 100,
              "preference": {
                "matchExpressions": [
                  {
                    "key": "node-role.kubernetes.io/burst",
                    "operator": "DoesNotExist"
                  }
                ]
              }
            }
          ]
        }
      ]
spec:
  # The default 750m CPU limit throttled CDI copies on an otherwise idle Casval.
  resourceRequirements:
    storageWorkloads:
      limits:
        cpu: "4"
        memory: 600M
      requests:
        cpu: 100m
        memory: 60M
  # Backend storage for persistent vTPM + persistent EFI (NVRAM) state PVCs.
  # Every Windows VM here carries persistent vTPM + EFI (baked into the
  # windows.* ClusterPreferences), and KubeVirt stores that state in a small
  # per-VM PVC. Resolution order is this field -> SC annotated
  # storageclass.kubevirt.io/is-default-virt-class -> cluster default. Both of
  # the latter are unset, so it would silently fall to freenas-nvmeof-ssd-csi
  # (Block, RWO) — but TPM/EFI state needs Filesystem mode. Pin it explicitly to
  # an NFS (Filesystem-native, RWX) class. Performance is irrelevant for a
  # boot-time-read state volume. This must be set BEFORE the first VM with
  # persistent TPM/EFI state is created (changing it later orphans state PVCs).
  # See igou-io/igou-openshift#380 (Phase 0).
  vmStateStorageClass: freenas-nfs-ssd-csi
  # This cluster does NOT support live migration by design: we run RWO block
  # storage only (no RWX block), so VM disks can't be shared across nodes and
  # VMs are never migratable. A short outage to power-cycle a VM during node
  # maintenance is acceptable here. Default every VM's eviction strategy to
  # None so a node drain cleanly shuts the VM down instead of attempting a
  # migration that can't succeed — which is what raises the (noise)
  # VMCannotBeEvicted alert under the KubeVirt default of LiveMigrate.
  # See igou-io/igou-openshift#405.
  evictionStrategy: None
  # No VM here is ever live-migratable (RWO disks, see evictionStrategy above),
  # so with the HCO default of [LiveMigrate] alone a running VMI can never be
  # moved onto the new virt-launcher image: after every CNV control-plane
  # update every long-running VMI goes outdated and
  # OutdatedVirtualMachineInstanceWorkloads fires 24h later. Adding Evict lets
  # CNV shut down and restart outdated VMIs itself — VMs reboot unannounced
  # shortly after an operator update (the subscription auto-approves, and with
  # evictionStrategy None there is no PDB to throttle the batch), which is the
  # same trade-off already accepted for node drains. LiveMigrate stays listed
  # first so any future RWX-backed VM migrates instead of rebooting.
  # See igou-io/igou-inventory#768.
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
      - Evict
    batchEvictionSize: 10
    batchEvictionInterval: 1m0s
  featureGates:
    deployTektonTaskResources: true
    enableCommonBootImageImport: true
  #   nonRoot: true
  #   withHostPassthroughCPU: true
  # Allow virt-handler (and virt-launcher pods it spawns) onto the casval burst
  # worker, which carries workload=burst:NoSchedule from the CAPI MachineSet.
  # HCO propagates this to the virt-handler DaemonSet so VMs that opt in via
  # matching nodeSelector + toleration can run there. CDI also needs this
  # toleration for Casval-local storage; its annotation above adds a
  # preference for always-on workers when storage permits.
  workloads:
    nodePlacement:
      # Keep virt-handler (and therefore VM scheduling) OFF truenas-w1:
      # that worker is itself a KVM guest on the TrueNAS host — nested
      # virtualization there is unsupported/unwanted, and its disk and
      # the cluster's CSI storage share one failure domain.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - truenas-w1
      tolerations:
        - key: workload
          operator: Equal
          value: burst
          effect: NoSchedule
