apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cluster-console.yaml
configMapGenerator:
- name: saturn-brand
  namespace: openshift-config
  files:
  - assets/saturn-masthead-dark.svg
  - assets/saturn-masthead-light.svg
  - assets/saturn-favicon.svg
  options:
    disableNameSuffixHash: true
    annotations:
      # Embedded artwork exceeds the client-side apply annotation limit.
      argocd.argoproj.io/sync-options: ServerSideApply=true
      argocd.argoproj.io/sync-wave: '-1'
