---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is created by the pac-tenants app at sync wave 20; this
# component only adds resources to it, hence the transformer instead of a
# Namespace resource. It also keeps ansible-builder-task.yaml a byte-for-byte
# copy of igou-ansible's .tekton/tasks/ansible-builder-task.yml.
namespace: ci-igou-ansible

resources:
  - ansible-builder-task.yaml
  - igou-aap-ee-rhel9-pipeline.yaml
  - ee-rebuild-serviceaccount.yaml
  - ee-rebuild-role.yaml
  - ee-rebuild-rolebinding.yaml
  - allow-ee-rebuild-apiserver-egress-networkpolicy.yaml
  - ee-rebuild-cronjob.yaml
