---
# Weekly rebuild of the igou-aap-ee-rhel9 execution environment.
#
# Rebuild from igou-ansible/main to pick up base-image fixes even when
# no EE artifact changes trigger the separate PaC push pipeline.
#
# CronJob -> PipelineRun rather than a Tekton trigger: no webhook, no
# Forgejo dependency, and nothing to interpolate at trigger time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ee-rebuild
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  # k8s evaluates cron in UTC unless timeZone is set.
  schedule: "0 3 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Do not submit a second build automatically after a build failure.
      backoffLimit: 0
      activeDeadlineSeconds: 8100
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ee-rebuild
        spec:
          serviceAccountName: ee-rebuild
          restartPolicy: Never
          containers:
            - name: create-pipelinerun
              # renovate: datasource=docker depName=registry.redhat.io/openshift4/ose-cli
              image: registry.redhat.io/openshift4/ose-cli:latest@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: BUILD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
              args:
                # Wait for the run so Job status, CronJob last-success time,
                # and concurrencyPolicy reflect the actual build outcome.
                - |
                  run=$(oc create -n "${BUILD_NAMESPACE}" -o name -f - <<'EOF'
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: igou-aap-ee-rhel9-weekly-
                    labels:
                      app.kubernetes.io/name: ee-rebuild
                  spec:
                    pipelineRef:
                      name: igou-aap-ee-rhel9
                    taskRunTemplate:
                      # Operator-owned SA; the pac-tenant chart already
                      # attached the Quay push secret to it.
                      serviceAccountName: pipeline
                    timeouts:
                      pipeline: "2h"
                    taskRunSpecs:
                      # buildah needs to run as root inside the container.
                      # The cluster TektonConfig injects
                      # default-pod-template.securityContext.runAsNonRoot=true
                      # into every taskrun, which kubelet rejects for this
                      # image. pipelines-scc is RunAsAny, so dropping
                      # runAsNonRoot for this task only is safe.
                      #
                      # computeResources is explicit because the namespace
                      # LimitRange defaults containers to 500m/1Gi, and an
                      # EE build OOMs there. 4 CPU / 8Gi is the LimitRange
                      # ceiling for this namespace.
                      - pipelineTaskName: build-image
                        podTemplate:
                          securityContext:
                            runAsNonRoot: false
                        computeResources:
                          requests:
                            cpu: "1"
                            memory: 2Gi
                          limits:
                            cpu: "4"
                            memory: 8Gi
                      - pipelineTaskName: ansible-builder
                        computeResources:
                          requests:
                            cpu: 500m
                            memory: 1Gi
                          limits:
                            cpu: "1"
                            memory: 2Gi
                    workspaces:
                      - name: shared-workspace
                        volumeClaimTemplate:
                          spec:
                            accessModes:
                              - ReadWriteOnce
                            resources:
                              requests:
                                storage: 1Gi
                  EOF
                  )
                  echo "Waiting for ${run}"
                  for ((attempt = 0; attempt < 520; attempt++)); do
                    status=$(oc get -n "${BUILD_NAMESPACE}" "${run}" \
                      -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
                    case "${status}" in
                      True)
                        echo "${run} succeeded; image pushed to internal Quay"
                        exit 0
                        ;;
                      False)
                        echo "${run} failed; inspect its TaskRun logs" >&2
                        exit 1
                        ;;
                    esac
                    sleep 15
                  done
                  echo "Timed out waiting for ${run}" >&2
                  exit 1
          volumes:
            - name: tmp
              emptyDir: {}
