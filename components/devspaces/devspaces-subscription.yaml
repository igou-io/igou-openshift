---
# Subscribed in its own namespace (global-mode OperatorGroup) rather than
# openshift-operators: OLM approval is effectively namespace-wide, and the
# Manual-approval servicemeshoperator3 subscription there leaves every other
# InstallPlan permanently pending.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devspaces
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  channel: stable
  installPlanApproval: Automatic
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
