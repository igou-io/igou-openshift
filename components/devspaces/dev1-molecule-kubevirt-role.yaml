---
# Mirror of the igou-devspaces molecule-kubevirt Role for the dev1 persona.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: molecule-kubevirt
  namespace: dev1-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '11'
rules:
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
