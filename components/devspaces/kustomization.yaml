---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openshift-devspaces-namespace.yaml
  - devspaces-operatorgroup.yaml
  - devspaces-subscription.yaml
  - devspaces-checluster.yaml
helmCharts:
  # Per-user devspace namespace + scoped molecule/KubeVirt RBAC.
  # Onboard a persona by adding their username here (plus their htpasswd/
  # Keycloak/Forgejo identities — see igou-docs "Using the Ansible Golden Path").
  - name: devspaces-users
    releaseName: devspaces-users
    valuesInline:
      users:
        - igou
        - dev1
