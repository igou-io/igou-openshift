---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openshift-devspaces-namespace.yaml
  - devspaces-operatorgroup.yaml
  - devspaces-subscription.yaml
  - devspaces-checluster.yaml
helmGlobals:
  # In-tree chart home (kustomize load restrictions forbid ../../.helm from a
  # plain Kustomization). Named `chart/` — singular — because `make clean`
  # deletes dirs named `charts/` (kustomize pull caches).
  chartHome: chart
helmCharts:
  # Per-user devspace namespace + scoped molecule/KubeVirt RBAC.
  # Onboard a persona by adding their username here (plus their htpasswd/
  # Keycloak/Forgejo identities — see igou-docs "Using the Ansible Golden Path").
  - name: devspaces-users
    releaseName: devspaces-users
    valuesInline:
      users:
        - igou
        - dev1
        - user
      aapMcpUsers:
        - igou
        - dev1
      # 1P Connect creds for igou-devenv workspaces (op-connect ExternalSecret).
      # Lab-vault-scoped token — sandbox personas (dev1) stay off this list.
      opConnectUsers:
        - igou

secretGenerator:
- name: devspaces-theme-logo
  namespace: openshift-devspaces
  files:
  - theme/che-logo.svg
- name: devspaces-theme-logo-gzip
  namespace: openshift-devspaces
  files:
  - theme/che-logo.svg.gz
- name: devspaces-theme-loader
  namespace: openshift-devspaces
  files:
  - theme/loader.svg
- name: devspaces-theme-loader-gzip
  namespace: openshift-devspaces
  files:
  - theme/loader.svg.gz
- name: devspaces-theme-favicon
  namespace: openshift-devspaces
  files:
  - theme/favicon.ico
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    che.eclipse.org/mount-as: subpath
    che.eclipse.org/mount-path: /public/dashboard/assets/branding
    argocd.argoproj.io/sync-wave: '10'
  labels:
    app.kubernetes.io/component: devspaces-dashboard-secret
    app.kubernetes.io/part-of: che.eclipse.org
