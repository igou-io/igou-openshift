{{- range .Values.opConnectUsers }}
---
# Per-user 1Password Connect credentials, auto-mounted into every DevWorkspace
# in the user's namespace as OP_CONNECT_HOST / OP_CONNECT_TOKEN (DevWorkspace-
# operator mount-to-devworkspace contract). This is what lets `op read` /
# `op inject` — and everything layered on them in igou-devenv workspaces:
# use/unuse env switching, ssh-use, ghapp token minting — work without any
# host bind mounts (igou-devenv ADR-0003 Connect mode). The token reads the
# lab claude/awx vaults, so this is deliberately a separate opConnectUsers
# list: sandbox personas (dev1) must never appear in it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: op-connect
  namespace: {{ . }}-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '11'
spec:
  secretStoreRef:
    name: onepassword-claude
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Pinned to the values ESO defaults into the live object; without them
      # git and cluster never converge and the app sits perpetually OutOfSync.
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          controller.devfile.io/mount-to-devworkspace: 'true'
          # REQUIRED: the DevWorkspace operator's secret informer is
          # label-filtered on watch-secret — without it the secret is
          # invisible to DWO and never env-mounted.
          controller.devfile.io/watch-secret: 'true'
        annotations:
          controller.devfile.io/mount-as: env
      data:
        OP_CONNECT_HOST: http://onepassword-connect.onepassword-connect.svc:8080
        OP_CONNECT_TOKEN: '{{ printf "{{ .token }}" }}'
  data:
    - secretKey: token
      remoteRef:
        key: devspaces-op-connect-{{ . }}
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
