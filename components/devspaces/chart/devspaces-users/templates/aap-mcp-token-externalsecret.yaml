{{- range .Values.users }}
---
# Per-user AAP MCP bearer token, auto-mounted into every DevWorkspace in the
# user's namespace as the AAP_MCP_TOKEN env var (DevWorkspace-operator
# mount-to-devworkspace contract). The 1Password item aap-mcp-token-<user>
# is scoped to that persona's AAP RBAC, so a workspace can only reach what
# its user could reach in AAP — dev1 sees only the sandbox organization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-mcp-token
  namespace: {{ . }}-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '11'
spec:
  secretStoreRef:
    name: onepassword-lab-aap
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Pinned to the values ESO defaults into the live object; without them
      # git and cluster never converge and the app sits perpetually OutOfSync.
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          controller.devfile.io/mount-to-devworkspace: 'true'
          # REQUIRED: the DevWorkspace operator's secret informer is
          # label-filtered on watch-secret — without it the secret is
          # invisible to DWO and never env-mounted (e2e-caught).
          controller.devfile.io/watch-secret: 'true'
        annotations:
          controller.devfile.io/mount-as: env
      data:
        AAP_MCP_TOKEN: '{{ printf "{{ .token }}" }}'
  data:
    - secretKey: token
      remoteRef:
        key: aap-mcp-token-{{ . }}
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
