{{- if .Values.opConnectUsers }}
---
# Network path matching the op-connect credential grant: workspaces in an
# opConnectUsers namespace must reach the Connect API, but the baseline
# connect-allow-eso-and-router policy (clusters/ocp/onepassword-connect)
# only admits ESO and the ingress router — in-cluster `op read` from a
# DevWorkspace times out without this. Additive ingress policy in the
# onepassword-connect namespace, generated from the same opConnectUsers
# list so token grant and network grant never drift apart.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connect-allow-devspaces-op-users
  namespace: onepassword-connect
  annotations:
    argocd.argoproj.io/sync-wave: '11'
spec:
  podSelector:
    matchLabels:
      app: onepassword-connect
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- range .Values.opConnectUsers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}-devspaces
{{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
