---
# Bound to the namespace's ServiceAccount group (workspace SA names are
# DevWorkspace-managed) — single-user namespace, so this stays scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: molecule-kubevirt
  namespace: igou-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '11'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: molecule-kubevirt
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:igou-devspaces
