---
# Pre-provisioned Dev Spaces user namespace for igou (labels/annotation per
# the Che "pre-create namespaces" contract) so GitOps can carry the molecule
# RBAC below before first login.
apiVersion: v1
kind: Namespace
metadata:
  name: igou-devspaces
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    che.eclipse.org/username: igou
    argocd.argoproj.io/sync-wave: '10'
