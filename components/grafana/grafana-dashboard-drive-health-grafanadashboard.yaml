---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-drive-health
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: hardware
  resyncPeriod: 24h
  # The JSON resolves DS_PROMETHEUS through a hidden datasource variable.
  # Name substitution into a datasource.uid would break Grafana queries.
  configMapRef:
    name: grafana-dashboard-drive-health-json
    key: drive-health.json
