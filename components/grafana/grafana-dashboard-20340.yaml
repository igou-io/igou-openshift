---
# Vendored locally (2026-08-05 dashboard audit): the upstream board's
# $namespace variable scanned exported_namespace across all metrics and
# defaulted to a namespace with no certificates, opening the board empty.
# Re-vendor by refreshing dashboards/cert-manager.json and re-scoping the
# namespace variable to certmanager_certificate_expiration_timestamp_seconds.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-20340
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  configMapRef:
    name: grafana-dashboard-20340-json
    key: cert-manager.json
