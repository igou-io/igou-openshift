---
# Authored in-repo (2026-08-14): compact Forgejo app stats (gitea_* metrics
# from the forgejo-http ServiceMonitor).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-forgejo
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  configMapRef:
    name: grafana-dashboard-forgejo-json
    key: forgejo.json
