---
# The netobserv-loki gateway post-filters network-tenant reads by the
# caller's namespace visibility (a reader with no `view` gets success +
# zero streams). Cluster-wide `view` (no Secret access) lets grafana see
# flows for all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-view
  annotations:
    argocd.argoproj.io/sync-wave: '10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: grafana
