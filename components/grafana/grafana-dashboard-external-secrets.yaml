---
# Vendored locally (2026-08-05 dashboard audit): the upstream board's three
# provider panels query externalsecret_provider_api_calls_count, which the
# deployed ESO version no longer exports; those panels are removed. Re-vendor
# by refreshing dashboards/external-secrets.json from the upstream URL and
# re-dropping the provider panels.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-external-secrets
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  configMapRef:
    name: grafana-dashboard-external-secrets-json
    key: external-secrets.json
