---
# Vendored from the upstream dashboard and patched for OpenShift GitOps.
# Select controller/repo/server metrics by container and namespace so both
# the primary and dedicated VPS Argo CD instances work. Scope the cluster
# variable by namespace; use the observed cluster.SettingsService label.
# The Operations panel is omitted because app_info has no operation label.
# Reapply these changes when refreshing dashboards/argocd.json upstream.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-14584
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: thanos-querier
  configMapRef:
    name: grafana-dashboard-14584-json
    key: argocd.json
