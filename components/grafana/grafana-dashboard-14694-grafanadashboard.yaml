---
# Windows Exporter Dashboard (mx3d) - host picker keys off the instance
# label, fed by the mx3d-windows-exporter ServiceMonitor relabel.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-14694
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: thanos-querier
  grafanaCom:
    id: 14694
