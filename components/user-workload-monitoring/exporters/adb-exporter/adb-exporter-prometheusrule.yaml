---
# Only AdbExporterDown remains alertable. AdbDeviceUnreachable and
# AdbCollectorFailing were removed 2026-09-03: the Shield sleeps / loses
# collectors often enough that they were the noisiest warning series on the
# cluster (chronic for days). Metrics (adb_up, collector_success) stay; only
# the alert rules go. severity critical routes to the EDA GitHub-issue
# pipeline + Gotify/Slack via the platform Alertmanager. These adb_* series
# only exist in the UWM leaf Prometheus, hence the leaf-prometheus
# evaluation-scope label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: adb-exporter
  labels:
    app.kubernetes.io/name: adb-exporter
    app.kubernetes.io/part-of: adb-exporter
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: adb-exporter.scrape
      rules:
        - alert: AdbExporterDown
          expr: up{job="adb-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: adb-exporter scrape failing for {{ $labels.instance }}
            description: |
              UWM Prometheus cannot scrape adb-exporter for
              {{ $labels.instance }} - the exporter pod is down or unschedulable
              and all adb_* device metrics are invisible.
