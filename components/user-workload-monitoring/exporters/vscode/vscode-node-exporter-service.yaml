---
# node_exporter on the vscode devhost (CentOS netboot host, VLAN9), scraped
# DIRECTLY over the LAN - no in-cluster proxy. Selectorless Service + manual
# Endpoints point UWM Prometheus at the host's static MAC-pinned address
# (rb5009 lease). Classic Endpoints (not EndpointSlice): the mirroring
# controller derives the slice automatically, so discovery works for both
# endpoint roles.
apiVersion: v1
kind: Service
metadata:
  name: vscode-node-exporter
  labels:
    app.kubernetes.io/name: vscode-node-exporter
    app.kubernetes.io/part-of: vscode
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
