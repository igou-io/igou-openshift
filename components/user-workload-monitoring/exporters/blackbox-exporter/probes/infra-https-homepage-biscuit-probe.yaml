---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infra-https-homepage-biscuit
  namespace: blackbox-exporter
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc:9115
  targets:
    staticConfig:
      static:
        - https://homepage.biscuit.igou.systems/
        - https://quay.apps.ocp.igou.systems
        - https://igounas.igou.systems/
        - https://unifi.infra.igou.systems
        - https://prowlarr.lan.igou.systems/ping
        - https://radarr.lan.igou.systems/ping
        - https://romm.biscuit.igou.systems
        - https://sonarr.lan.igou.systems/ping
        - https://torrent.lan.igou.systems/
      labels:
        tier: critical
        category: infra
        owner: platform
