---
# External (public-internet) uptime + TLS probe of the personal website. The
# in-cluster blackbox-exporter reaches https://igou.io over egress, a true
# outside-in check of the VPS site, independent of the tailnet path used for
# node_exporter. tier=critical enrolls it in BlackboxProbeFailedCritical and
# the BlackboxSSLCertExpiring* alerts. OpenShift cert-manager renews the TLS
# certificate and ESO delivers it to the VPS. Check HTTPS and HTTP redirects
# for both the apex and www hostnames.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: igou-io
  namespace: blackbox-exporter
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc:9115
  targets:
    staticConfig:
      static:
        - https://igou.io
        - http://igou.io
        - https://www.igou.io
        - http://www.igou.io
      labels:
        tier: critical
        category: website
        owner: platform
