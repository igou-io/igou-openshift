---
# Allow policy for olm-state-metrics, authored from the component's known
# flows (same shape as the NetObserv-derived policies elsewhere in this
# repo): UWM scrapes + kubelet probes in, apiserver watch + DNS out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observed
  namespace: olm-state-metrics
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # UWM Prometheus scrapes :8080 (CR metrics) and :8081 (telemetry)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    # host-network sources: kubelet liveness/readiness probes arrive from the
    # node IP and cannot be matched by namespaceSelector. Scoped to the
    # node/lab network.
    - from:
        - ipBlock:
            cidr: 10.10.9.0/24
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    # cluster DNS (always required)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # kube-apiserver (list/watch of CRDs + Subscriptions/InstallPlans via the
    # kubernetes.default endpoint)
    - to:
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - port: 6443
          protocol: TCP
