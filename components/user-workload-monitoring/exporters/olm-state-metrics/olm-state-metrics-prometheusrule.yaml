---
# Informational notifications report available and completed OLM updates.
# Existing warning alerts cover updates stuck pending or failing. olm_*
# series only exist in UWM, hence the leaf-prometheus evaluation-scope label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: olm-state-metrics
  labels:
    app.kubernetes.io/name: olm-state-metrics
    app.kubernetes.io/part-of: olm-state-metrics
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: olm-state-metrics.scrape
      rules:
        - alert: OlmStateMetricsDown
          expr: up{job="olm-state-metrics"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: olm-state-metrics scrape failing
            description: |
              UWM Prometheus cannot scrape olm-state-metrics - operator
              update availability is invisible until this recovers.
    - name: olm-state-metrics.updates
      rules:
        # Compare CSV labels, not the constant value of an info metric.
        # Hold brief automatic updates long enough for Alertmanager delivery.
        - alert: OperatorUpdateAvailable
          expr: |
            max by (subscription_namespace, subscription, installed_csv, current_csv) (
              olm_subscription_info{installed_csv!="", current_csv!=""}
            )
            unless on (subscription_namespace, subscription, current_csv)
            label_replace(
              olm_subscription_info{installed_csv!=""},
              "current_csv", "$1", "installed_csv", "(.+)"
            )
          keep_firing_for: 15m
          labels:
            severity: info
          annotations:
            summary: >-
              Operator update available: {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
              {{ $labels.installed_csv }} -> {{ $labels.current_csv }}
            description: |
              OLM has discovered {{ $labels.current_csv }} for
              {{ $labels.subscription_namespace }}/{{ $labels.subscription }};
              the installed version is {{ $labels.installed_csv }}.
              Automatic subscriptions install without approval. Inspect manual plans with:
              oc get installplans -n {{ $labels.subscription_namespace }}
        # A version must have existed 15m ago: initial installs and exporter
        # startup without history do not count as completed updates. Aggregate
        # away channel, plan and scrape labels before comparing versions.
        - alert: OperatorUpdateCompleted
          expr: |
            (
              max by (subscription_namespace, subscription, installed_csv) (
                olm_subscription_info{installed_csv!=""}
              )
              unless on (subscription_namespace, subscription, installed_csv)
              max by (subscription_namespace, subscription, installed_csv) (
                olm_subscription_info{installed_csv!=""} offset 15m
              )
            )
            and on (subscription_namespace, subscription)
            max by (subscription_namespace, subscription) (
              olm_subscription_info{installed_csv!=""} offset 15m
            )
          labels:
            severity: info
          annotations:
            summary: >-
              Operator update completed: {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
              {{ $labels.installed_csv }} installed
            description: |
              OLM reports {{ $labels.installed_csv }} installed for
              {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
              after a version change within the last 15 minutes.
              This reports the operator installation, not completion of every operand rollout.
        - alert: OperatorUpdatePending
          expr: olm_subscription_state{state="UpgradePending"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Operator update available for
              {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
            description: |
              Subscription {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
              has been in UpgradePending for over an hour - an update is
              available but not installing, almost certainly waiting on
              InstallPlan approval. Inspect with:
              oc get installplans -n {{ $labels.subscription_namespace }}
              and approve the current plan to upgrade.
        - alert: OperatorUpgradeFailed
          expr: olm_subscription_state{state="UpgradeFailed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Operator upgrade failed for
              {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
            description: |
              Subscription {{ $labels.subscription_namespace }}/{{ $labels.subscription }}
              reports UpgradeFailed. Check the Subscription conditions and
              the failing InstallPlan:
              oc describe subscription {{ $labels.subscription }} -n {{ $labels.subscription_namespace }}
