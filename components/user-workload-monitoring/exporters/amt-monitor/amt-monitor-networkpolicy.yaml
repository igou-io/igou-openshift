---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amt-monitor
  namespace: amt-monitor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - ipBlock:
            cidr: 10.10.9.0/24
      ports:
        - port: 9151
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.60.225/32
        - ipBlock:
            cidr: 10.10.9.34/32
        - ipBlock:
            cidr: 10.10.9.24/32
      ports:
        - port: 16992
          protocol: TCP
        - port: 16993
          protocol: TCP
