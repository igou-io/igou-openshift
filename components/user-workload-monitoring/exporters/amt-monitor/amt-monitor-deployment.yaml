---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amt-monitor
  namespace: amt-monitor
  labels: &id001
    app.kubernetes.io/name: amt-monitor
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: amt-monitor
          image: registry.access.redhat.com/ubi9/python-312:latest@sha256:f72227ffc4f3faa3772a6ae91ffc03bcf3c507d6b7a525d2bfe90b3579dcb8af
          command:
            - python3
            - /app/monitor.py
          args:
            - --interval
            - '300'
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          ports:
            - name: metrics
              containerPort: 9151
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: ms01
              mountPath: /secrets/ms01
              readOnly: true
            - name: hpg5
              mountPath: /secrets/hpg5
              readOnly: true
            - name: p330
              mountPath: /secrets/p330
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: amt-monitor
        - name: ms01
          secret:
            secretName: amt-ms01
        - name: hpg5
          secret:
            secretName: amt-hpg5
        - name: p330
          secret:
            secretName: amt-p330
