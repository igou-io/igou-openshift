---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amt-hpg5
  namespace: amt-monitor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: amt-hpg5
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: '{{ .password }}'
  dataFrom:
    - extract:
        key: hpg5-amt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
