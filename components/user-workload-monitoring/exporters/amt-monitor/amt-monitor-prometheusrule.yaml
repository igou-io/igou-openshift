---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amt-monitor
  namespace: amt-monitor
  labels:
    app.kubernetes.io/part-of: amt-monitor
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: amt-health
      rules:
        - alert: AMTEndpointUnavailable
          expr: amt_up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AMT authentication or state reads failed for {{ $labels.node
              }}.
            description: Checks enumerate management state every five minutes. They
              never change power, boot settings, or consent policy.
        - alert: AMTConsentRequired
          expr: amt_user_consent_required != 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AMT user consent is enabled on {{ $labels.node }}.
            description: Checks enumerate management state every five minutes. They
              never change power, boot settings, or consent policy.
        - alert: AMTNotAdminControlMode
          expr: amt_control_mode != 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AMT is not in Admin Control Mode on {{ $labels.node }}.
            description: Checks enumerate management state every five minutes. They
              never change power, boot settings, or consent policy.
        - alert: AMTKVMUnavailable
          expr: amt_kvm_available == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AMT KVM is disabled on {{ $labels.node }}.
            description: Checks enumerate management state every five minutes. They
              never change power, boot settings, or consent policy.
        - alert: AMTChecksStale
          expr: time() - amt_last_success_timestamp_seconds > 900
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No successful AMT check for {{ $labels.node }} in 15 minutes.
            description: Checks enumerate management state every five minutes. They
              never change power, boot settings, or consent policy.
