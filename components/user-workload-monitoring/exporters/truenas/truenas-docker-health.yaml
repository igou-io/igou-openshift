---
# docker-health-exporter on TrueNAS (VLAN9) — container_health enum per
# container name (0 unknown / 1 stopped / 2 alive-no-healthcheck /
# 3 unhealthy / 4 healthy) + docker_up. This is the Prometheus-side view of
# the compose healthchecks: a dead VPN tunnel shows as gluetun/qbittorrent
# unhealthy, a crashed/stopped app as stopped. Deployed from
# igou-inventory group_vars/truenas.yml (docker-health-exporter).
# Selectorless Service + manual Endpoints, mirroring truenas-netdata.
apiVersion: v1
kind: Service
metadata:
  name: truenas-docker-health
  labels:
    app.kubernetes.io/name: truenas-docker-health
    app.kubernetes.io/part-of: truenas
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  # Must match the Service name for endpoint discovery.
  name: truenas-docker-health
  labels:
    app.kubernetes.io/name: truenas-docker-health
    app.kubernetes.io/part-of: truenas
subsets:
  - addresses:
      - ip: 10.10.9.243
    ports:
      - name: metrics
        port: 9000
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-docker-health
  labels:
    app.kubernetes.io/name: truenas-docker-health
    app.kubernetes.io/part-of: truenas
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-docker-health
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        # The target address is a bare IP; name the real source.
        # action: replace is the CRD default - set explicitly so the
        # rendered manifest matches the live object and ArgoCD stays Synced.
        - action: replace
          targetLabel: instance
          replacement: truenas.igou.systems
