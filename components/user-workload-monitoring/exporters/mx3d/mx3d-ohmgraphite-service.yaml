---
# OhmGraphite (LibreHardwareMonitor) hardware sensors on the mx3d desktop,
# deployed by igou-ansible playbooks/windows/deploy_ohmgraphite.yaml.
# Covers what windows_exporter can't: GPU temps, GPU fan tach, NVMe temps.
# Same selectorless Service + manual Endpoints pattern as the
# windows_exporter scrape beside this file.
apiVersion: v1
kind: Service
metadata:
  name: mx3d-ohmgraphite
  labels:
    app.kubernetes.io/name: mx3d-ohmgraphite
    app.kubernetes.io/part-of: mx3d
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 4445
      targetPort: 4445
      protocol: TCP
