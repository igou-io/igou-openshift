---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mx3d-alerts
  namespace: mx3d
spec:
  groups:
    - name: mx3d.rules
      rules:
        - alert: Mx3dWindowsExporterDown
          expr: up{job="mx3d-windows-exporter"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: mx3d windows_exporter scrape failing
            description: |
              windows_exporter on {{ $labels.instance }} is not answering -
              the mx3d host may be down or the service stopped.
        - alert: Mx3dDiskSpaceLow
          expr: 100 * (1 - windows_logical_disk_free_bytes{job="mx3d-windows-exporter",volume="C:"} / windows_logical_disk_size_bytes{job="mx3d-windows-exporter",volume="C:"}) > 85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: mx3d C drive above 85%
            description: |
              C: on {{ $labels.instance }} is {{ $value | printf "%.0f" }}% full.
