---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mx3d-alerts
  namespace: mx3d
spec:
  groups:
    - name: mx3d.rules
      # No exporter-down / host-down alert here BY OPERATOR DECISION
      # (2026-08-14): mx3d is a personal desktop that sleeps and powers
      # off routinely - an up==0 alert would open a GitHub issue via the
      # EDA pipeline every night. Metrics gaps while it sleeps are
      # expected and fine.
      rules:
        - alert: Mx3dDiskSpaceLow
          expr: 100 * (1 - windows_logical_disk_free_bytes{job="mx3d-windows-exporter",volume="C:"} / windows_logical_disk_size_bytes{job="mx3d-windows-exporter",volume="C:"}) > 85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: mx3d C drive above 85%
            description: |
              C: on {{ $labels.instance }} is {{ $value | printf "%.0f" }}% full.
