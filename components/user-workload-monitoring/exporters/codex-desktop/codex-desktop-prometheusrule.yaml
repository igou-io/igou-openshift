---
# No exporter-down alert on purpose: this VM is a test host that is
# legitimately shut down at times; absent metrics are not a failure.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: codex-desktop-alerts
  namespace: windows-images
spec:
  groups:
    - name: codex-desktop.rules
      rules:
        - alert: CodexDesktopDiskSpaceLow
          expr: 100 * (1 - windows_logical_disk_free_bytes{job="codex-desktop-metrics",volume="C:"} / windows_logical_disk_size_bytes{job="codex-desktop-metrics",volume="C:"}) > 85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: codex-desktop C drive above 85%
            description: |
              C: on {{ $labels.instance }} is {{ $value | printf "%.0f" }}% full.
