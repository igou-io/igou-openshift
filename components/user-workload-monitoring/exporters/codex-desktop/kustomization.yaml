---
# codex-desktop windows_exporter (KubeVirt VM in windows-images). The
# namespace is owned by the windows-vms tooling - resources here carry an
# explicit namespace and are additive only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - codex-desktop-metrics-service.yaml
  - codex-desktop-servicemonitor.yaml
  - allow-uwm-scrape-networkpolicy.yaml
  - codex-desktop-prometheusrule.yaml
