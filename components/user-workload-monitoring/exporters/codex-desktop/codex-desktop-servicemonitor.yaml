---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: codex-desktop-windows-exporter
  namespace: windows-images
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-desktop-metrics
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: codex-desktop.igou.systems
