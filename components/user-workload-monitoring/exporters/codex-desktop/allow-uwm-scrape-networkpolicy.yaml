---
# Additive to the windows-images default-deny: UWM prometheus -> exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uwm-scrape-codex-desktop
  namespace: windows-images
spec:
  podSelector:
    matchLabels:
      vm.kubevirt.io/name: codex-desktop
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9182
          protocol: TCP
