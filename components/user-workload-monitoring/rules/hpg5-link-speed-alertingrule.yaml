---
# Node-exporter is scraped by platform Prometheus, outside UWM's namespace scope.
apiVersion: monitoring.openshift.io/v1
kind: AlertingRule
metadata:
  name: hpg5-link-speed
  namespace: openshift-monitoring
spec:
  groups:
    - name: hpg5-link-speed
      rules:
        - alert: HPWorkerLinkSpeedLow
          expr: |
            (node_network_speed_bytes{job="node-exporter",instance="hpg5.igou.systems",device="eno1"} > 0)
            and
            (node_network_speed_bytes{job="node-exporter",instance="hpg5.igou.systems",device="eno1"} < 125000000)
            and on (instance, device)
            (node_network_carrier{job="node-exporter",instance="hpg5.igou.systems",device="eno1"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: HP worker uplink negotiated below gigabit
            description: >-
              {{ $labels.instance }} interface {{ $labels.device }} has been up below 1 Gb/s
              for 5 minutes. The boot recovery check makes at most two attempts per boot;
              inspect journalctl -u hpg5-link-recovery.service, AMT redirection sessions,
              and CRS328 ether22 before another authorized link reset.
            runbook_url: https://github.com/igou-io/igou-docs/blob/main/hardware/Intel%20AMT%20on%20the%20P330%20Tiny%20and%20HP%20EliteDesk%20G5.md
