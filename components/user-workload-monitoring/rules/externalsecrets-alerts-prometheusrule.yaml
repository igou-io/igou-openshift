---
# Lives in the ESO namespace because UWM enforces the namespace label on
# user rules - the externalsecret_* series are scraped here; the owning
# ExternalSecret's real namespace is in exported_namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: externalsecrets-alerts
  namespace: external-secrets-operator
spec:
  groups:
    - name: external-secrets.rules
      rules:
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ExternalSecret failing to sync
            description: |
              ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }}
              has been NotReady for 15m - its Secret is no longer refreshing
              from 1Password. Check the ExternalSecret status and 1P Connect.
        - alert: ExternalSecretSyncErrors
          expr: increase(externalsecret_sync_calls_error[30m]) > 3
          labels:
            severity: warning
          annotations:
            summary: ExternalSecret sync calls erroring
            description: |
              ESO sync calls are failing repeatedly (>3 in 30m). If this is
              fleet-wide, suspect the 1Password Connect backend.
