---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: cert-manager
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerCertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: cert-manager Certificate not Ready
            description: |
              Certificate {{ $labels.exported_namespace }}/{{ $labels.name }}
              has been NotReady for 30m - issuance or renewal is failing.
        - alert: CertManagerCertificateExpiringSoon
          # LE certs renew at ~2/3 of their 90d lifetime, so anything within
          # 14d of expiry means renewal has been failing for weeks.
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 1209600
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: certificate expires in under 14 days
            description: |
              Certificate {{ $labels.exported_namespace }}/{{ $labels.name }}
              expires in under 14 days and should have auto-renewed already.
