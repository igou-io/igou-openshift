---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  config.yaml: |
    enableUserWorkload: true
    # NOTE: do NOT set prometheusK8s.externalLabels.cluster — the
    # monitoringconfigmaps.openshift.io admission webhook reserves
    # prometheus/prometheus_replica/cluster and rejects the ConfigMap,
    # wedging this app in a retry loop. CMO already stamps platform
    # series with cluster=<ClusterVersion UUID>, which is what the
    # kubernetes-folder Grafana boards' $cluster variable resolves for
    # ocp (rk8s series carry cluster="rk8s" from federation).
    alertmanagerMain:
      # Receive alerts from user-workload Prometheus too (UWM AM is
      # disabled in user-workload-monitoring-config) so user-namespace
      # alerts route through the gotify/slack receivers configured here.
      enableUserAlertmanagerConfig: true
      secrets:
        - alertmanager-eda-event-stream
        - alertmanager-slack-bot-token
        - hermes-sre-am-relay
