---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  config.yaml: |
    enableUserWorkload: true
    prometheusK8s:
      # Stamp platform series with a cluster identity (visible through
      # Thanos Querier) so cluster-scoped Grafana boards can tell ocp
      # apart from the federated rk8s series (cluster="rk8s"). Also lands
      # on alerts sent to Alertmanager — extra label, no routing impact.
      externalLabels:
        cluster: ocp
    alertmanagerMain:
      # Receive alerts from user-workload Prometheus too (UWM AM is
      # disabled in user-workload-monitoring-config) so user-namespace
      # alerts route through the gotify/slack receivers configured here.
      enableUserAlertmanagerConfig: true
      secrets:
        - alertmanager-eda-event-stream
        - alertmanager-slack-bot-token
