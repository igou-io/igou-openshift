        - nfsvers=4
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
    # Staging-only class for Velero's data-mover backupPVCs — same
    # rationale as freenas-nvmeof-ssd-csi-velero: zfs clone from
