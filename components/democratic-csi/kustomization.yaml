apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: democratic-csi
resources:
  - democratic-csi-namespace.yaml
  - allow-privileged-to-democratic-csi-iscsi-fast-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-iscsi-ssd-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-iscsi-cold-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nfs-fast-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nfs-ssd-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nfs-cold-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nvmeof-fast-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nvmeof-ssd-config-node-sa-clusterrolebinding.yaml
  - allow-privileged-to-democratic-csi-nvmeof-cold-config-node-sa-clusterrolebinding.yaml
# Give each node a unique, stable NVMe host NQN (igou-io/igou-openshift#404).
# Targets only the three NVMe-oF node DaemonSets by name regex.
patches:
  - path: patches/nvmeof-unique-hostnqn.yaml
    target:
      kind: DaemonSet
      name: democratic-csi-nvmeof-.*-config-node
helmCharts:
# ---- iSCSI - fast pool ----
- name: democratic-csi
  namespace: democratic-csi
  includeCRDs: false
  releaseName: democratic-csi-iscsi-fast-config
  version: 0.15.1
  repo: https://democratic-csi.github.io/charts/
  valuesInline:
    controller:
      # klog sidecars default --v=5: leader-election renewals alone were
      # most of this namespace's residual log volume (igou-openshift#382).
      externalProvisioner:
        verbosityLevel: 2
      externalAttacher:
        verbosityLevel: 2
      externalResizer:
        verbosityLevel: 2
      externalSnapshotter:
        verbosityLevel: 2
      driver:
        enabled: true
        logLevel: warn
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa"
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      # Prefer dedicated workers. ocp is also labeled worker, so exclude
      # control-plane rather than selecting worker. Soft: still schedules
      # on the master if workers are full or drained. Node DaemonSets stay.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      rbac:
        enabled: true
        openshift:
          privileged: true
      hostNetwork: true
    node:
      driverRegistrar:
        verbosityLevel: 2
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: workload
        operator: Exists
      rbac:
        openshift:
          privileged: true
      driver:
        enabled: true
        logLevel: warn
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa"
        localtimeHostPath: null
    csiDriver:
      name: "org.democratic-csi.iscsi-fast"
    storageClasses:
    - name: freenas-iscsi-fast-csi
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4
        detachedVolumesFromSnapshots: true
      mountOptions: []
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
    volumeSnapshotClasses:
      - name: freenas-iscsi-fast-csi
        deletionPolicy: Delete
        # Per-driver default so consumers that pick a class implicitly
        # (KubeVirt VirtualMachineSnapshot, CDI smart-clone, classless
        # VolumeSnapshots) get the local class, never the -detached one.
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        parameters:
          detachedSnapshots: "false"
      # -detached = full zfs send/receive copy onto the cold pool (see the
      # release's detachedSnapshotsDatasetParentName); survives loss of the
      # source pool but creation/restore are full data copies, not instant.
      - name: freenas-iscsi-fast-csi-detached
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"
    driver:
      existingConfigSecret: "democratic-csi-iscsi-fast-config"
      config:
        driver: freenas-api-iscsi
