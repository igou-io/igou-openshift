          snapshot.storage.kubernetes.io/is-default-class: "true"
        parameters:
          detachedSnapshots: "false"
      - name: freenas-nvmeof-fast-csi-detached
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"
    driver:
      existingConfigSecret: "democratic-csi-nvmeof-fast-config"
      config:
        driver: freenas-api-nvmeof
# ---- NVMe-oF - ssd pool ----
- name: democratic-csi
  namespace: democratic-csi
  includeCRDs: false
  releaseName: democratic-csi-nvmeof-ssd-config
  version: 0.15.1
  repo: https://democratic-csi.github.io/charts/
  valuesInline:
    controller:
      # klog sidecars default --v=5: leader-election renewals alone were
      # most of this namespace's residual log volume (igou-openshift#382).
      externalProvisioner:
        verbosityLevel: 2
      externalAttacher:
        verbosityLevel: 2
      externalResizer:
        verbosityLevel: 2
      externalSnapshotter:
        verbosityLevel: 2
      driver:
        enabled: true
        logLevel: warn
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa"
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      # Prefer dedicated workers. ocp is also labeled worker, so exclude
      # control-plane rather than selecting worker. Soft: still schedules
      # on the master if workers are full or drained. Node DaemonSets stay.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      rbac:
        enabled: true
        openshift:
          privileged: true
      hostNetwork: true
    node:
      driverRegistrar:
        verbosityLevel: 2
      rbac:
        openshift:
          privileged: true
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: workload
        operator: Exists
      driver:
        enabled: true
        logLevel: warn
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "next@sha256:0f308ae601474cb9633f90dc96f59dbd23440b0ed0e77d70e224465246a12dfa"
        localtimeHostPath: null
    csiDriver:
      name: "org.democratic-csi.nvmeof-ssd"
    storageClasses:
    - name: freenas-nvmeof-ssd-csi
      defaultClass: true
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4
        detachedVolumesFromSnapshots: true
        detachedVolumesFromVolumes: true
      mountOptions: []
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
    # Staging-only class for Velero's data-mover backupPVCs (wired up via
    # the DPA's nodeAgent.backupPVC map). Volume-from-snapshot here is a
    # zfs clone instead of the detached full zvol copy the main class
    # does — a copy of every volume ahead of kopia is what blew the
    # node-agent's 30m prepare timeout and left daily-apps/weekly-heavy
    # PartiallyFailed. The clone lives only for the DataUpload; kopia in
    # S3 remains the durable copy, so nothing here weakens the
    # self-contained-backup design.
    - name: freenas-nvmeof-ssd-csi-velero
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
      parameters:
        fsType: ext4
        detachedVolumesFromSnapshots: false
        detachedVolumesFromVolumes: false
      mountOptions: []
      secrets:
        provisioner-secret:
        controller-publish-secret:
        node-stage-secret:
        node-publish-secret:
        controller-expand-secret:
    volumeSnapshotClasses:
      - name: freenas-nvmeof-ssd-csi
        deletionPolicy: Delete
        # Per-driver default so consumers that pick a class implicitly
        # (KubeVirt VirtualMachineSnapshot, CDI smart-clone, classless
        # VolumeSnapshots) get the local class, never the -detached one.
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        parameters:
          detachedSnapshots: "false"
      - name: freenas-nvmeof-ssd-csi-detached
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"
    driver:
      existingConfigSecret: "democratic-csi-nvmeof-ssd-config"
      config:
        driver: freenas-api-nvmeof
