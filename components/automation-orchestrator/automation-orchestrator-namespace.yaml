apiVersion: v1
kind: Namespace
metadata:
  name: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    # The operator recreates its incompatible backend ServiceMonitor. Exclude
    # this namespace from both Prometheus stacks instead of masking TargetDown.
    openshift.io/cluster-monitoring: "false"
    openshift.io/user-monitoring: "false"
