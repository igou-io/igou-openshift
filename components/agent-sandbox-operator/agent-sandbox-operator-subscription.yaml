---
# preview channel: v0.9.0 is the only published version of the Red Hat build
# of Agent Sandbox. Manual approval so a preview-channel bump is never silent.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: agent-sandbox-operator
  namespace: agent-sandbox-system
spec:
  channel: preview-0.9
  installPlanApproval: Manual
  name: agent-sandbox-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: agent-sandbox-operator.v0.9.0
