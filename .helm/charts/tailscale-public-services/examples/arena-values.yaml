---
# Illustrative application; these values are not registered with Argo CD.
services:
  - name: arena-public
    hostname: ocp-public-arena
    tag: tag:ocp-public-arena
    selector:
      app.kubernetes.io/name: arena
    ports:
      - name: web
        port: 8080
        targetPort: 8080
        protocol: TCP
      - name: arena-tcp
        port: 27015
        targetPort: 27015
        protocol: TCP
      - name: arena-udp
        port: 27016
        targetPort: 27016
        protocol: UDP
