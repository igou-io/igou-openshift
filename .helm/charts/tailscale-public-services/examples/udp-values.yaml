---
# Endpoint for test-workloads/public-services-udp; not registered with Argo CD.
services:
  - name: udp-echo-public
    hostname: ocp-public-udp-echo
    tag: tag:ocp-public-udp-echo
    selector:
      app.kubernetes.io/name: udp-echo
    ports:
      - name: udp
        port: 9000
        targetPort: 9000
        protocol: UDP
