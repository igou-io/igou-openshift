services:
  - name: public-web-test-public
    hostname: ocp-public-web-test
    tag: tag:ocp-public-web-test
    selector:
      app.kubernetes.io/name: public-web-test
    ports:
      - name: web
        port: 8080
        targetPort: 8080
        protocol: TCP
