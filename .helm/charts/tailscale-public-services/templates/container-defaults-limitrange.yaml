---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: public-services
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.containerResources.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.containerResources.default | nindent 8 }}
