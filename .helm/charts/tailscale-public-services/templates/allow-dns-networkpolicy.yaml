---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: public-services
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        # OVN-K evaluates the DNS Service's post-NAT target port.
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
