---
# All public-facing application pods and endpoint Services belong in public-services.
proxyTag: tag:ocp-public-service
# Empty until an application is selected; namespace guardrails still render.
services: []

quota:
  requests.cpu: '2'
  requests.memory: 2Gi
  limits.cpu: '4'
  limits.memory: 4Gi
  pods: '20'
  services: '20'
  services.loadbalancers: '10'
  persistentvolumeclaims: '5'
  requests.storage: 20Gi
  requests.ephemeral-storage: 512Mi
  limits.ephemeral-storage: 2Gi

containerResources:
  defaultRequest:
    cpu: 25m
    memory: 64Mi
    ephemeral-storage: 16Mi
  default:
    cpu: '1'
    memory: 512Mi
    ephemeral-storage: 128Mi
