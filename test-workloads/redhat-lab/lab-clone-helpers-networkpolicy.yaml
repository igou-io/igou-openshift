---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-clone-helpers
  namespace: redhat-lab
spec:
  podSelector:
    matchExpressions:
      - key: cdi.kubevirt.io
        operator: In
        values:
          - cdi-upload-server
          - importer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-virtualization-os-images
          podSelector:
            matchLabels:
              cdi.kubevirt.io: cdi-clone-source
      ports:
        - port: 8443
          protocol: TCP
  egress:
    # CDI helpers report transfer progress to the Kubernetes API.
    # Guest virt-launcher pods do not match this policy.
    - to:
        - ipBlock:
            cidr: 172.30.0.1/32
        - ipBlock:
            cidr: 10.10.9.10/32
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
