---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-dns
  namespace: redhat-lab
data:
  Corefile: |
    .:5353 {
        errors
        health :8080
        ready :8181
        hosts {
            192.168.240.10 idm.lab.igou.systems
            192.168.240.20 satellite.lab.igou.systems
            192.168.240.31 client1.lab.igou.systems
            192.168.240.32 client2.lab.igou.systems
            ttl 60
            fallthrough
        }
        forward . /etc/resolv.conf
        cache 30
        loop
    }
