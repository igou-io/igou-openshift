---
# A stand-in stateful app: serves its PVC over HTTP and can seed
# checksummed data into it (see README drill procedure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-app
  namespace: dr-restore-drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drill-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drill-app
    spec:
      containers:
        - name: app
          # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/python-312
          image: registry.access.redhat.com/ubi9/python-312:latest@sha256:74689dbf82199b2099873d81941f8c2996edfb1cefe544f115f46be06c30e093
          command: ["python3", "-m", "http.server", "8080", "--directory", "/data"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drill-data
