---
# A stand-in stateful app: serves its PVC over HTTP and can seed
# checksummed data into it (see README drill procedure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drill-app
  namespace: dr-restore-drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drill-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drill-app
    spec:
      containers:
        - name: app
          # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/python-312
          image: registry.access.redhat.com/ubi9/python-312:latest@sha256:aebe03384391689993c42998836597e6161ac5340cbc84518c1b0528a1c59ea8
          command: ["python3", "-m", "http.server", "8080", "--directory", "/data"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drill-data
