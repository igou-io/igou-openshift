---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo
  labels:
    app.kubernetes.io/name: udp-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: udp-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udp-echo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
          command:
            - /agnhost
          args:
            - netexec
            - --udp-port=9000
            - --http-port=8080
            - --http-override=/healthz
          ports:
            - name: udp
              containerPort: 9000
              protocol: UDP
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
