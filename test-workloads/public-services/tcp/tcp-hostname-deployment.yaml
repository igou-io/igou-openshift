---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-hostname
  labels:
    app.kubernetes.io/name: tcp-hostname
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tcp-hostname
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcp-hostname
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
          command:
            - /agnhost
          args:
            - serve-hostname
            - --http=false
            - --tcp=true
            - --port=9000
          ports:
            - name: tcp
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: tcp
          livenessProbe:
            tcpSocket:
              port: tcp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
