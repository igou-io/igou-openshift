---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-web-test-public
  namespace: public-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: public-web-test
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: 'true'
              tailscale.com/parent-resource-type: svc
              tailscale.com/parent-resource: public-web-test-public
              tailscale.com/parent-resource-ns: public-services
      ports:
        - port: 8080
          protocol: TCP
