apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-receiver
  template:
    metadata:
      labels:
        app: demo-receiver
    spec:
      automountServiceAccountToken: false
      containers:
        - name: receiver
          image: docker.io/library/node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command:
            - node
            - /app/receiver.cjs
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-receiver
                  key: secret
          ports:
            - name: http
              containerPort: 39991
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: demo-receiver
