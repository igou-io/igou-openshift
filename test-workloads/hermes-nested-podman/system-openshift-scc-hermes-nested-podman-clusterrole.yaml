# Equivalent of: oc adm policy add-scc-to-user hermes-nested-podman -z hermes-agent-test
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:hermes-nested-podman
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - hermes-nested-podman
    verbs:
      - use
