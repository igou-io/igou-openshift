apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no top-level namespace transformer: scc.yaml and its
# ClusterRole are cluster-scoped, so every namespaced resource declares its
# own namespace.
resources:
  - gluetun-openshift-test-namespace.yaml
  - gluetun-test-serviceaccount.yaml
  - gluetun-test-securitycontextconstraints.yaml
  - system-openshift-scc-gluetun-test-clusterrole.yaml
  - system-openshift-scc-gluetun-test-rolebinding.yaml
  - gluetun-mullvad-externalsecret.yaml
  - gluetun-egress-test-deployment.yaml
  - direct-egress-control-deployment.yaml
