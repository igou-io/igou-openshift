apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no top-level namespace transformer: scc.yaml and its
# ClusterRole are cluster-scoped, so every namespaced resource declares its
# own namespace.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - scc.yaml
  - scc-rbac.yaml
  - mullvad-externalsecret.yaml
  - gluetun-egress-test-deployment.yaml
  - direct-egress-control-deployment.yaml
