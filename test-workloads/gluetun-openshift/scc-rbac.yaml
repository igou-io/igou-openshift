# Equivalent of: oc adm policy add-scc-to-user gluetun-test -z gluetun-test -n gluetun-openshift-test
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:gluetun-test
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - gluetun-test
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:gluetun-test
  namespace: gluetun-openshift-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:gluetun-test
subjects:
  - kind: ServiceAccount
    name: gluetun-test
    namespace: gluetun-openshift-test
