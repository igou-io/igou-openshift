apiVersion: apps/v1
kind: Deployment
metadata:
  name: direct-egress-control
  namespace: gluetun-openshift-test
  labels:
    app.kubernetes.io/name: direct-egress-control
    app.kubernetes.io/part-of: gluetun-openshift-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: direct-egress-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: direct-egress-control
        app.kubernetes.io/part-of: gluetun-openshift-test
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: docker.io/nicolaka/netshoot:latest@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while :; do sleep 3600; done
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
