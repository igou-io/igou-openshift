---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: deliberately no top-level `namespace:` transformer. Every resource
# below already declares its own namespace, and the transformer would stamp
# one onto the SecurityContextConstraints too — kustomize has no scope
# information for that CRD-backed kind and treats it as namespaced.

# The hermes-operator is a dependency of this workload, not something to
# `helm install` by hand. kustomize inflates the OCI chart in place, so the
# whole thing is one `kustomize build`.
#
# Requires --enable-helm (see README): `oc apply -k` does NOT pass it, so
# build and pipe rather than applying the directory directly.
helmCharts:
  - name: hermes-operator
    repo: oci://ghcr.io/paperclipinc/charts
    version: 0.1.20
    releaseName: hermes-operator
    namespace: hermes-operator
    includeCRDs: true

resources:
  - hermes-k8s-test-namespace.yaml
  - hermes-agent-serviceaccount.yaml
  - hermes-operator-namespace.yaml
  - hermes-agent-root-securitycontextconstraints.yaml
  - system-openshift-scc-hermes-agent-root-clusterrole.yaml
  - system-openshift-scc-hermes-agent-root-rolebinding.yaml
  - hermes-session-noperms-serviceaccount.yaml
  - hermes-session-exec-role.yaml
  - hermes-session-exec-rolebinding.yaml
  - hermes-session-sandbox-role.yaml
  - hermes-session-sandbox-rolebinding.yaml
  - hermes-session-default-deny-networkpolicy.yaml
  - hermes-session-allow-internet-networkpolicy.yaml
  - hermes-agent-openshift-egress-networkpolicy.yaml
  - quay-local-pull-externalsecret.yaml
  - hermes-k8s-hermesinstance.yaml
