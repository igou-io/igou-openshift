---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-session-exec
  namespace: hermes-k8s-test
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - get
  - create
