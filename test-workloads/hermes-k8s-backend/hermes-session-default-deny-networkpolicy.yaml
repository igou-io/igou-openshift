# Egress lockdown for Hermes session pods.
#
# The RBAC and pod-shape hardening in this directory address the FILESYSTEM and
# ServiceAccount-token attack surface. They say nothing about the network: by
# default an agent-controlled shell in a session pod can reach the Kubernetes
# API endpoint, every ClusterIP Service in the cluster, and any internal admin
# UI on the pod network.
#
# This policy is the network half. It selects session pods by
# `app.kubernetes.io/managed-by: hermes-agent`, which the backend stamps as the
# LAST step of pod-template rendering, after every override layer, and which
# terminal.kubernetes config cannot remove (the reserved-key validation rejects
# it in `labels`, in `pod_template_overrides` and in
# `sandbox.spec_overrides.podTemplate`).
#
# ONE CASE IS NOT COVERED: `provisioner: sandbox` with `sandbox.template_ref` or
# `sandbox.use_claim`. There the pod is built by agent-sandbox-operator from a
# SandboxTemplate that Hermes neither writes nor reads, so it carries this label
# only if the TEMPLATE sets it — and if it does not, NEITHER policy below
# applies and the session pod has full cluster-network access. Put the label in
# your SandboxTemplate's pod metadata, or stay on `provisioner: direct`.
#
# Replace hermes-k8s-test. Requires a NetworkPolicy-capable CNI (OVN-Kubernetes
# on OpenShift qualifies).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-session-default-deny
  namespace: hermes-k8s-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: hermes-agent
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # DNS only. Everything else is denied by the empty-ish egress list above.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
