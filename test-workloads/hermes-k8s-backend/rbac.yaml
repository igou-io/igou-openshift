apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-session-noperms
  namespace: hermes-k8s-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-session-exec
  namespace: hermes-k8s-test
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-session-exec
  namespace: hermes-k8s-test
subjects:
- kind: ServiceAccount
  name: hermes-agent
  namespace: hermes-k8s-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-session-exec
